<!DOCTYPE html>
<html>

<head>
  <script src="theme-manager.js"></script>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="inspector.css">
    <link rel="stylesheet" href="devtools-styles.css">
    <link rel="stylesheet" href="glass-toast.css">
    <script src="lib/font-awesome.min.js" defer></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=pest_control" />
    <script src="custom-tooltip.js" defer></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
    </style>
    <link rel="icon" href="../icons/icon-48.png" type="image/png">
    <link rel="stylesheet" href="custom-dropdown.css">
    <link rel="stylesheet" href="controls.css">
</head>

<body>
    <div id="sfarc-panel-container">
        <div class="sfarc-popup-container">
            <div class="sfarc-header">
                <div class="sfarc-title">
                    Salesforce Comet
                </div>
                <div class="sfarc-header-controls">
                    <button class="sfarc-header-btn" id="sfarc-org-btn" title="Org Details">
                        <svg width="18" height="18" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M3 6L8 2L13 6V12C13 12.5523 12.5523 13 12 13H4C3.44772 13 3 12.5523 3 12V6Z"
                                stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                                stroke-linejoin="round" />
                            <path d="M6 13V8H10V13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                                stroke-linejoin="round" />
                        </svg>
                    </button>
                    <button class="sfarc-header-btn" id="sfarc-settings-btn" title="Settings">
                        <i class="fa-solid fa-gear"></i>
                    </button>
                    <button id="sfarc-theme-toggle" class="sfarc-header-btn" title="Toggle Theme" style="display:none;">
                        <svg class="sfarc-moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                        </svg>
                        <svg class="sfarc-sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" style="display:none;">
                            <circle cx="12" cy="12" r="5"></circle>
                            <line x1="12" y1="1" x2="12" y2="3"></line>
                            <line x1="12" y1="21" x2="12" y2="23"></line>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                            <line x1="1" y1="12" x2="3" y2="12"></line>
                            <line x1="21" y1="12" x2="23" y2="12"></line>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                        </svg>
                    </button>
                    <button class="sfarc-header-btn" id="sfarc-report-bugs-btn" title="Report Bugs">
                        <i class="fa-solid fa-bug"></i>
                    </button>
                    <button class="sfarc-header-btn sfarc-close-btn" id="sfarc-panel-close-btn" title="Close Panel">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="sfarc-toolbar">
                <button class="sfarc-toolbar-btn" id="sfarc-data-import" title="Data Import">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M8 11V3M8 11L5 8M8 11L11 8" stroke="currentColor" stroke-width="1.5"
                            stroke-linecap="round" stroke-linejoin="round" />
                        <path d="M2 13H14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                    <span>Import</span>
                </button>
                <button class="sfarc-toolbar-btn" id="sfarc-data-export" title="Data Export">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M8 3V11M8 3L5 6M8 3L11 6" stroke="currentColor" stroke-width="1.5"
                            stroke-linecap="round" stroke-linejoin="round" />
                        <path d="M2 13H14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                    <span>Export</span>
                </button>
                <button class="sfarc-toolbar-btn sfarc-disabled" id="sfarc-show-all"
                    title="Navigate to a record page to view all data" disabled>
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M2 3H14M2 8H14M2 13H14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                    <span>Show All Data</span>
                </button>
            </div>

            <div class="sfarc-tabs">
                <div class="sfarc-tab-indicator"></div>
                <button class="sfarc-tab active" data-tab="objects">
                    <i class="fa-solid fa-database"></i>
                    Objects
                </button>
                <button class="sfarc-tab" data-tab="users">
                    <i class="fa-regular fa-user"></i>
                    Users
                </button>
                <button class="sfarc-tab" data-tab="shortcuts">
                    <i class="fa-solid fa-braille"></i>
                    Shortcuts
                </button>
                <button class="sfarc-tab" data-tab="devtools">
                    <i class="fa-solid fa-terminal"></i>
                    DevTools
                </button>
                <button class="sfarc-tab" data-tab="debug-logs">
                    <span class="material-symbols-outlined" style="font-size: 15px; vertical-align: middle; margin-right: 4px;">pest_control</span>
                    Debug log
                </button>
                <button class="sfarc-tab" data-tab="metadata">
                    <i class="fa-solid fa-server"></i>
                    Metadata
                </button>
            </div>

            <div class="sfarc-search-container">
                <span class="sfarc-search-icon">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </span>
                <input type="text" id="sfarc-search" placeholder="Search..." class="sfarc-search-input">
            </div>

            <div class="sfarc-content">
                <div id="sfarc-suggestions-container" class="sfarc-section">
                    <div class="sfarc-suggestions" id="sfarc-suggestions"></div>
                </div>
                <div id="sfarc-flow-monitor" style="display: none;"></div>
                <div id="sfarc-devtools-container" style="display: none;"></div>
                <div id="sfarc-metadata-container" style="display: none; height: 100%; flex-direction: column;">
                    <!-- Metadata content -->
                </div>
                <div id="sfarc-debug-logs-view"
                    style="display: none; height: 100%; overflow: hidden; flex-direction: column;">
                    <!-- Debug logs content -->
                </div>
            </div>

            <div class="sfarc-footer">
                <div class="sfarc-footer-item" title="Salesforce Instance">
                    <i class="fa-solid fa-database"></i>
                    <span id="sfarc-footer-instance">Unknown</span>
                </div>
                <div class="sfarc-footer-item" title="Current User">
                    <i class="fa-solid fa-user"></i>
                    <span id="sfarc-footer-user">Unknown User</span>
                </div>
            </div>
        </div>
    </div>
    <script src="glass-toast.js"></script>
    <script src="custom-dropdown.js"></script>
</body>

</html>

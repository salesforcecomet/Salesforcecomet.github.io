  <style>
/* custom-dropdown.css */

/* NUKE native styles from wrapper container, beating inspector.css specificity */
html body .sfarc-custom-dropdown-container,
html body #sfarc-panel .sfarc-custom-dropdown-container,
html body #sfarc-panel:not(.sfarc-dark-theme) .sfarc-custom-dropdown-container,
html body #sfarc-panel.sfarc-dark-theme .sfarc-custom-dropdown-container,
html body #sfarc-panel .sfarc-custom-dropdown-container:hover,
html body #sfarc-panel:not(.sfarc-dark-theme) .sfarc-custom-dropdown-container:hover,
html body #sfarc-panel.sfarc-dark-theme .sfarc-custom-dropdown-container:hover,
html body #sfarc-panel .sfarc-custom-dropdown-container:focus,
html body #sfarc-panel:not(.sfarc-dark-theme) .sfarc-custom-dropdown-container:focus,
html body #sfarc-panel.sfarc-dark-theme .sfarc-custom-dropdown-container:focus {
    position: relative;
    display: inline-block;
    box-sizing: border-box;
    font-family: inherit;
    /* Reset all native select styles that leaked in via copied classes */
    background: transparent !important;
    background-color: transparent !important;
    background-image: none !important;
    border: none !important;
    padding: 0 !important;
    border-radius: 0 !important;
    height: auto !important;
    box-shadow: none !important;
    min-height: 0 !important;
}

/* Hide the original native select but keep it in DOM for events/forms */
select.sfarc-custom-dropdown-hidden-select,
body select.sfarc-custom-dropdown-hidden-select,
html body select.sfarc-custom-dropdown-hidden-select {
    display: none !important;
    opacity: 0 !important;
    pointer-events: none !important;
    position: absolute !important;
    width: 0 !important;
    height: 0 !important;
}

.sfarc-custom-dropdown-trigger {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    height: 100%;
    min-height: 26px;
    height: 26px;
    padding: 0 8px 0 12px;
    background: rgba(0, 0, 0, 0.06);
    border: 1px solid rgba(0, 0, 0, 0.12);
    border-radius: 6px;
    color: #1e293b;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    box-shadow: none;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    user-select: none;
    box-sizing: border-box;
}

.sfarc-custom-dropdown-trigger:hover {
    background: rgba(0, 0, 0, 0.1);
    border-color: rgba(0, 0, 0, 0.2);
}

.sfarc-custom-dropdown-trigger[data-disabled="true"] {
    opacity: 0.6;
    cursor: not-allowed;
    background: #f4f4f5;
}

.sfarc-custom-dropdown-value {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-right: 8px;
}

.sfarc-custom-dropdown-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    color: #71717a;
    transition: transform 0.2s ease;
}

.sfarc-custom-dropdown-container.sfarc-open .sfarc-custom-dropdown-icon {
    transform: rotate(180deg);
}

.sfarc-custom-dropdown-container.sfarc-open {
    z-index: 100 !important;
}

.sfarc-custom-dropdown-menu {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    min-width: 100%;
    max-height: 250px;
    overflow-y: auto;
    background: #ffffff;
    border: 1px solid #e4e4e7;
    border-radius: 8px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    z-index: 100;
    opacity: 0;
    visibility: hidden;
    transform: translateY(-4px);
    transition: opacity 0.15s ease, transform 0.15s ease, visibility 0.15s;
    padding: 4px;
    box-sizing: border-box;
}

.sfarc-custom-dropdown-container.sfarc-open .sfarc-custom-dropdown-menu {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
}

.sfarc-custom-dropdown-option {
    display: flex;
    align-items: center;
    padding: 4px 12px 4px 32px; /* Extra left padding for checkmark space */
    border-radius: 6px;
    cursor: pointer;
    color: #27272a;
    font-size: 13px;
    font-weight: 500;
    transition: background 0.1s ease;
    position: relative;
    user-select: none;
    white-space: nowrap;
}

.sfarc-custom-dropdown-option:hover {
    background: #f4f4f5;
}

.sfarc-custom-dropdown-option.sfarc-selected {
    background: #e0f2fe; /* Light blue background for selected */
    color: #0369a1; /* Dark blue text */
}

/* The checkmark for selected options */
.sfarc-custom-dropdown-checkmark {
    position: absolute;
    left: 10px;
    display: none;
    color: #0284c7; /* Primary blue checkmark */
}

.sfarc-custom-dropdown-option.sfarc-selected .sfarc-custom-dropdown-checkmark {
    display: flex;
}

/* Dark Mode Overrides */
.sfarc-dark-theme .sfarc-custom-dropdown-trigger {
    background: #1e1e1e;
    border-color: #3c3c3c;
    color: #cccccc;
}

.sfarc-dark-theme .sfarc-custom-dropdown-trigger:hover,
.sfarc-dark-theme .sfarc-custom-dropdown-container.sfarc-open .sfarc-custom-dropdown-trigger {
    border-color: #007fd4;
}

.sfarc-dark-theme .sfarc-custom-dropdown-trigger[data-disabled="true"] {
    background: #18181b;
    color: #71717a;
}

.sfarc-dark-theme .sfarc-custom-dropdown-menu {
    background: #252526;
    border: 1px solid #454545;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
}

.sfarc-dark-theme .sfarc-custom-dropdown-option {
    color: #cccccc;
}

.sfarc-dark-theme .sfarc-custom-dropdown-option:hover,
.sfarc-dark-theme .sfarc-custom-dropdown-option.sfarc-selected {
    background: #04395e;
    color: #ffffff;
}

.sfarc-dark-theme .sfarc-custom-dropdown-checkmark {
    color: #38bdf8;
}

/* ============================================================================
   Salesforce Comet — Universal Control System
   ----------------------------------------------------------------------------
   One design language for search inputs, selects/dropdowns, icon buttons and
   toggles across every page of the extension, matching the reference UI
   (the header's segmented nav pill proportions):
     • Uniform control height  — 24px
     • Search inputs & selects — 6px radius on light #e8edf2 / #e5e8ed
     • Icon / "+" buttons      — 24x24 with 6px radius on light #e5e8ed
     • Toggles                 — iOS green (#4cd964) when checked
   Dark-theme variants are provided via tokens so pages using
   body.sfarc-dark-theme / .sfarc-dark-theme stay coherent.

   Load this file LAST in every page so it wins the cascade (the codebase
   relies on !important; equal-specificity rules resolve by load order).

   Top-bar chrome (.sfir-header-select, .sfir-header-icon-btn,
   .sfir-badge-action-btn) is intentionally untouched — the compact header
   keeps its approved size.
   ========================================================================== */

:root {
    --sfarc-ctl-h: 24px;
    --sfarc-ctl-radius-pill: 6px;
    --sfarc-ctl-radius-box: 6px;
    --sfarc-ctl-bg: #e5e8ed;         /* selects, icon buttons */
    --sfarc-ctl-bg-search: #e8edf2;  /* search fields */
    --sfarc-ctl-border: #d8dde6;
    --sfarc-ctl-text: #1e293b;
    --sfarc-ctl-muted: #64748b;
    --sfarc-ctl-primary: #0070d2;
    --sfarc-ctl-primary-hover: #005fb2;
    --sfarc-ctl-toggle-on: #4cd964;
    --sfarc-ctl-toggle-off: #e9e9ea;
    --sfarc-ctl-hover: rgba(0, 0, 0, 0.06);
    --sfarc-ctl-focus-ring: rgba(0, 112, 210, 0.18);
}

/* Dark-theme tokens */
body.sfarc-dark-theme,
.sfarc-dark-theme {
    --sfarc-ctl-bg: rgba(255, 255, 255, 0.09);
    --sfarc-ctl-bg-search: rgba(255, 255, 255, 0.1);
    --sfarc-ctl-border: rgba(255, 255, 255, 0.16);
    --sfarc-ctl-text: #f1f5f9;
    --sfarc-ctl-muted: #94a3b8;
    --sfarc-ctl-toggle-off: #555555;
    --sfarc-ctl-hover: rgba(255, 255, 255, 0.12);
    --sfarc-ctl-focus-ring: rgba(56, 189, 248, 0.28);
}

(function() {

    const CHECKMARK_SVG = `<svg class="sfarc-custom-dropdown-checkmark" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;

    // Close all open dropdowns when clicking outside
    document.addEventListener('click', (e) => {
        if (!e.target.closest('.sfarc-custom-dropdown-container')) {
            document.querySelectorAll('.sfarc-custom-dropdown-container.sfarc-open').forEach(el => {
                el.classList.remove('sfarc-open');
            });
        }
    });

    function enhanceSelect(selectEl) {
        if (selectEl.classList.contains('sfarc-custom-processed')) return;
        if (selectEl.hasAttribute('multiple')) return; // Skip multi-select for now

        selectEl.classList.add('sfarc-custom-processed');
        selectEl.classList.add('sfarc-custom-dropdown-hidden-select');

        // Create Container
        const container = document.createElement('div');
        container.className = 'sfarc-custom-dropdown-container';
        
        // Inherit inline styles that affect layout
        if (selectEl.style.width) container.style.width = selectEl.style.width;
        if (selectEl.style.flex) container.style.flex = selectEl.style.flex;
        if (selectEl.style.flexShrink) container.style.flexShrink = selectEl.style.flexShrink;
        if (selectEl.style.flexGrow) container.style.flexGrow = selectEl.style.flexGrow;
        if (selectEl.style.minWidth) container.style.minWidth = selectEl.style.minWidth;
        if (selectEl.style.maxWidth) container.style.maxWidth = selectEl.style.maxWidth;

        // Copy classes from the select (except the hidden one) to the container to inherit positioning/margin
        Array.from(selectEl.classList).forEach(cls => {
            if (cls !== 'sfarc-custom-processed' && cls !== 'sfarc-custom-dropdown-hidden-select') {
                container.classList.add(cls);
            }
        });

        // Trigger Button
        const trigger = document.createElement('div');
        trigger.className = 'sfarc-custom-dropdown-trigger';
        if (selectEl.disabled) trigger.setAttribute('data-disabled', 'true');
        
        // Inherit height/padding if explicitly set
        if (selectEl.style.height) trigger.style.height = selectEl.style.height;
        if (selectEl.style.padding) trigger.style.padding = selectEl.style.padding;
        if (selectEl.style.fontSize) trigger.style.fontSize = selectEl.style.fontSize;

        const valueSpan = document.createElement('span');
        valueSpan.className = 'sfarc-custom-dropdown-value';
        
        const iconSpan = document.createElement('span');
        iconSpan.className = 'sfarc-custom-dropdown-icon';
        iconSpan.innerHTML = CHEVRON_SVG;

        trigger.appendChild(valueSpan);
        trigger.appendChild(iconSpan);

        // Menu
        const menu = document.createElement('div');
        menu.className = 'sfarc-custom-dropdown-menu';

        container.appendChild(trigger);
        container.appendChild(menu);

        // Insert container right after the select in the DOM
        selectEl.parentNode.insertBefore(container, selectEl.nextSibling);

        // Function to rebuild options
        const rebuildMenu = () => {
            menu.innerHTML = '';
            const options = Array.from(selectEl.options);
            
            // Sync selected value to trigger
            const selectedOption = options.find(opt => opt.selected) || options[0];
            if (selectedOption) {
                valueSpan.textContent = selectedOption.textContent;
            } else {
                valueSpan.textContent = '';
            }

            options.forEach((opt, index) => {
                const optDiv = document.createElement('div');
                optDiv.className = 'sfarc-custom-dropdown-option';
                if (opt.selected) {
                    optDiv.classList.add('sfarc-selected');
                }
                optDiv.innerHTML = `${CHECKMARK_SVG} ${opt.textContent}`;
                
                optDiv.addEventListener('click', (e) => {
                    e.stopPropagation();
                    
                    // Close menu
                    container.classList.remove('sfarc-open');
                    
                    // Update native select
                    selectEl.selectedIndex = index;
                    selectEl.value = opt.value;
                    
                    // Dispatch change event so existing logic fires
                    selectEl.dispatchEvent(new Event('change', { bubbles: true }));
                    
                    // Update UI
                    rebuildMenu();
                });
                
                menu.appendChild(optDiv);
            });
            
            // Sync disabled state
            if (selectEl.disabled) {
                trigger.setAttribute('data-disabled', 'true');
            } else {
                trigger.removeAttribute('data-disabled');
            }
        };

        rebuildMenu();

        // Trigger Click Event
        trigger.addEventListener('click', (e) => {
            e.stopPropagation();
            if (selectEl.disabled) return;
            
            // Close other open menus
            document.querySelectorAll('.sfarc-custom-dropdown-container.sfarc-open').forEach(el => {
                if (el !== container) el.classList.remove('sfarc-open');
            });

            container.classList.toggle('sfarc-open');
        });

        // Watch for changes to the original select (e.g., options injected dynamically or value changed via JS)
        const observer = new MutationObserver((mutations) => {
            let needsRebuild = false;
            mutations.forEach(m => {
                if (m.type === 'childList' || (m.type === 'attributes' && (m.attributeName === 'disabled' || m.attributeName === 'value'))) {
                    needsRebuild = true;
                }
            });
            if (needsRebuild) rebuildMenu();
        });

        observer.observe(selectEl, { childList: true, attributes: true, subtree: true });
        
        // Also listen to 'change' event on original select in case it's changed by code without attributes mutating
        selectEl.addEventListener('change', () => {
            rebuildMenu();
        });
    }

    // Initialize all existing selects
    function initAll() {
        document.querySelectorAll('select').forEach(enhanceSelect);
    }

    // Watch for new selects added to the DOM dynamically
    const domObserver = new MutationObserver((mutations) => {
        let hasNewNodes = false;
        mutations.forEach(m => {
            if (m.addedNodes.length > 0) hasNewNodes = true;
        });
        
        if (hasNewNodes) {
            document.querySelectorAll('select:not(.sfarc-custom-processed)').forEach(enhanceSelect);
        }
    });

    // Start observing DOM when ready
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => {
            initAll();
            domObserver.observe(document.body, { childList: true, subtree: true });
        });
    } else {
        initAll();
        domObserver.observe(document.body, { childList: true, subtree: true });
    }

})();

  </script>
</body>
</html>

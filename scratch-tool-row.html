<!doctype html><html><head><meta charset="utf-8"><style>
        .material-symbols-rounded {
            font-family: 'Material Symbols Rounded', sans-serif !important;
            font-weight: 300 !important;
            font-style: normal !important;
            font-size: 22px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
            -webkit-font-smoothing: antialiased;
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }

        :root {
            --bg-main: #1e1e1e;
            --bg-sidebar: #181818;
            --bg-activity: #181818;
            --bg-header: #181818;
            --bg-tab: #2d2d2d;
            --bg-tab-active: #1e1e1e;
            --bg-terminal: #181818;
            --bg-terminal-header: #252526;
            --bg-input: #2d2d2d;
            --border-color: #252526;
            --text-main: #cccccc;
            --text-muted: #858585;
            --text-active: #ffffff;
            --primary: #007acc;
            --primary-hover: #0098ff;
            --accent-green: #2ea043;
            --accent-red: #f85149;
            --item-hover: #2a2d2e;
            --item-active: #37373d;
            --icon-color: #858585;

            /* VS Code Dark+ muted palette — success uses the editor's olive green
               (#6a9955), errors/warnings stay soft so the console reads like a
               real terminal instead of a rainbow log feed. */
            --log-info-color: #cccccc;
            --log-success-color: #6a9955;
            --log-warn-color: #d19a66;
            --log-error-color: #f48771;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background-color: var(--bg-header);
            border-bottom: 1px solid var(--border-color);
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 36px;
            flex-shrink: 0;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-active);
        }

        .header-title i {
            color: #ff9800;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-actions .btn {
            height: 26px !important;
            padding: 0 10px !important;
            font-size: 11.5px !important;
            border-radius: 5px !important;
            line-height: 1 !important;
        }

        .header-actions .btn .material-symbols-rounded {
            font-size: 15px !important;
            margin-right: 3px !important;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 5px 12px;
            font-size: 12px;
            font-weight: 400;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            box-sizing: border-box;
        }

        .btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0, 122, 204, 0.35);
        }

        .btn:active {
            transform: translateY(0) scale(0.97);
            box-shadow: none;
        }

        .btn-success {
            background: var(--accent-green);
        }

        .btn-success:hover {
            background: #3fb950;
            box-shadow: 0 4px 14px rgba(46, 160, 67, 0.45);
        }

        .btn-success i {
            transition: transform 0.2s ease;
        }

        .btn-success:hover i {
            transform: translateY(-1.5px);
        }

        #btn-save-org {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #btn-save-org:hover {
            box-shadow: 0 0 16px rgba(46, 160, 67, 0.55);
        }

        #btn-save-org.saving-pulse {
            animation: savePulse 1.2s infinite ease-in-out;
        }

        @keyframes savePulse {
            0% {
                box-shadow: 0 0 0 0 rgba(46, 160, 67, 0.6);
            }

            70% {
                box-shadow: 0 0 0 8px rgba(46, 160, 67, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(46, 160, 67, 0);
            }
        }

        @keyframes iconBounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-2px);
            }
        }

        #btn-save-org:hover i {
            animation: iconBounce 0.6s ease infinite;
        }

        .btn-secondary {
            background: var(--item-hover);
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--item-active);
            color: var(--text-active);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .btn-blue {
            background-color: #007acc !important;
            color: #ffffff !important;
            border: 1px solid #007acc !important;
            font-weight: 600 !important;
        }

        .btn-blue:hover {
            background-color: #0098ff !important;
            border-color: #0098ff !important;
            box-shadow: 0 4px 12px rgba(0, 122, 204, 0.4) !important;
        }

        .btn-danger {
            background: #dc2626;
            color: white;
        }

        .btn-danger:hover {
            background: #ef4444;
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.4);
        }

        .editor-workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* VS Code Left Activity Bar */
        .activity-bar {
            width: 48px;
            background-color: var(--bg-activity);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            flex-shrink: 0;
            user-select: none;
            z-index: 10;
        }

        .activity-bar-top,
        .activity-bar-bottom {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 100%;
        }

        .activity-icon {
            width: 48px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            color: var(--icon-color);
            cursor: pointer;
            position: relative;
            border-left: 2px solid transparent;
            transition: color 0.15s, border-color 0.15s;
            border-radius: 0;
            opacity: 0.85;
        }

        .activity-icon:hover {
            color: var(--text-active);
            background: transparent;
            opacity: 1;
        }

        .activity-icon.active {
            color: var(--text-active);
            border-left-color: var(--primary);
            background: transparent;
            opacity: 1;
        }

        .sidebar {
            width: 280px;
            min-width: 160px;
            max-width: 700px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            overflow: hidden;
        }

        .sidebar-resizer {
            width: 4px;
            background: rgba(255, 255, 255, 0.03);
            cursor: col-resize;
            user-select: none;
            z-index: 25;
            transition: background 0.15s ease;
            flex-shrink: 0;
        }

        .sidebar-resizer:hover,
        .sidebar-resizer.resizing {
            background: #007acc !important;
        }

        .terminal-resizer {
            height: 4px;
            background: rgba(255, 255, 255, 0.03);
            cursor: row-resize;
            user-select: none;
            z-index: 25;
            transition: background 0.15s ease;
            flex-shrink: 0;
        }

        .terminal-resizer:hover,
        .terminal-resizer.resizing {
            background: #007acc !important;
        }

        .sidebar.collapsed {
            display: none !important;
        }

        .sidebar-header {
            height: 35px;
            box-sizing: border-box;
            padding: 0 14px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .sidebar-header-actions i {
            font-size: 15px;
            color: var(--icon-color);
            padding: 4px 6px;
            border-radius: 4px;
            cursor: pointer;
            transition: color 0.15s, background 0.15s, transform 0.15s;
        }

        .sidebar-header-actions i:hover {
            color: var(--text-active);
            background: var(--item-hover);
            transform: scale(1.12);
        }

        .folder-icon-wrapper {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 14px;
            height: 14px;
        }

        .folder-icon-main {
            color: var(--icon-color);
            font-size: 14px;
            transition: color 0.15s;
        }

        .folder-icon-badge {
            position: absolute;
            bottom: -3px;
            right: -3px;
            font-size: 8px;
            background: var(--bg-sidebar);
            padding: 1px;
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* File rows: a file sheet with the file-type icon stacked as a corner badge */
        .file-icon-stack {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 14px;
            height: 14px;
            flex-shrink: 0;
        }

        .file-icon-base {
            color: var(--text-muted, #94a3b8);
            font-size: 13px;
        }

        .file-icon-badge {
            position: absolute;
            bottom: -3px;
            right: -3px;
            font-size: 8px;
            background: var(--bg-sidebar);
            padding: 1px;
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        .sidebar-search-box {
            padding: 8px 8px 9px;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-sidebar);
        }

        /* Single clean search field — no nested boxes. The inner input is
           deliberately transparent: the global controls.css pill styling
           targets .sidebar-search-box input with !important, so these
           higher-specificity overrides ((0,2,1) vs (0,2,0), and the :focus
           variant (0,3,1) vs (0,2,1)) win the cascade and leave ONE
           visible field — the wrapper. */
        .search-input-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
            height: 28px;
            padding: 0 6px 0 9px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
            transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
        }

        .search-input-wrapper:hover {
            border-color: var(--text-muted);
        }

        .search-input-wrapper:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(0, 122, 204, 0.25), 0 1px 3px rgba(0, 0, 0, 0.12);
        }

        .sidebar-search-box .search-input-wrapper input,
        .sidebar-search-box .search-input-wrapper input:focus {
            flex: 1;
            min-width: 0;
            height: auto !important;
            min-height: 0 !important;
            align-self: stretch !important;
            background: transparent !important;
            border: none !important;
            border-radius: 0 !important;
            box-shadow: none !important;
            outline: none !important;
            color: var(--text-active) !important;
            font-size: 12px !important;
            font-weight: 400 !important;
            line-height: 1 !important;
            padding: 0 !important;
            margin: 0 !important;
            -webkit-appearance: none !important;
            appearance: none !important;
        }

        .search-input-wrapper input::placeholder {
            color: var(--text-muted);
            opacity: 0.9;
        }

        .search-input-wrapper input:-webkit-autofill,
        .search-input-wrapper input:-webkit-autofill:hover,
        .search-input-wrapper input:-webkit-autofill:focus {
            -webkit-box-shadow: 0 0 0 1000px var(--bg-input) inset;
            -webkit-text-fill-color: var(--text-active);
            transition: background-color 9999s ease-out;
        }

        .search-input-icon {
            display: inline-flex;
            flex-shrink: 0;
            color: var(--icon-color);
            font-size: 11px;
        }

        .search-clear-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            width: 18px;
            height: 18px;
            padding: 0;
            border: none;
            border-radius: 50%;
            background: transparent;
            color: var(--text-muted);
            line-height: 1;
            cursor: pointer;
            transition: background 0.12s ease, color 0.12s ease;
        }

        .search-clear-btn:hover {
            background: var(--item-hover);
            color: var(--text-active);
        }

        .search-clear-btn[hidden] {
            display: none;
        }

        /* ══ Sidebar Code Search — VS Code-style find view ══ */
        .ce-search-header {
            height: 32px;
            padding: 0 8px 0 14px;
        }

        .ce-search-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--text-muted);
            font-weight: 700;
        }

        .ce-search-header-actions {
            gap: 2px;
            opacity: 0;
            transition: opacity 0.12s ease;
        }

        .ce-search-header:hover .ce-search-header-actions,
        .ce-search-header-actions:focus-within {
            opacity: 1;
        }

        .ce-search-header-actions i {
            font-size: 15px !important;
            padding: 3px 5px;
            border-radius: 4px;
        }

        .ce-search-form {
            padding: 10px 12px 8px;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-sidebar);
            flex-shrink: 0;
        }

        .ce-search-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 6px;
        }

        .ce-search-row:last-child {
            margin-bottom: 0;
        }

        .ce-search-chev {
            flex-shrink: 0;
            width: 16px;
            height: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-muted);
            border-radius: 3px;
            transition: color 0.12s, background 0.12s;
        }

        .ce-search-chev i {
            font-size: 9px;
            transition: transform 0.18s ease;
        }

        .ce-search-chev:hover {
            color: var(--text-active);
            background: var(--item-hover);
        }

        .ce-search-chev.is-spacer {
            cursor: default;
            pointer-events: none;
        }

        .ce-search-input-box {
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 6px;
            height: 28px;
            padding: 0 4px 0 8px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 5px;
            transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
        }

        .ce-search-input-box.is-idle {
            border-color: var(--border-color);
        }

        .ce-search-input-box:focus-within {
            border-color: var(--primary, #007acc);
            box-shadow: 0 0 0 1px rgba(0, 122, 204, 0.4);
        }

        .ce-search-glass {
            font-size: 10.5px;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .ce-search-input-box input {
            flex: 1;
            min-width: 0;
            background: transparent;
            border: none;
            color: var(--text-active);
            font-size: 12px;
            font-family: inherit;
            padding: 0;
            margin: 0;
            outline: none;
        }

        .ce-search-input-box input::placeholder {
            color: var(--text-muted);
            opacity: 0.85;
        }

        .ce-search-clear {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            font-size: 13px;
            line-height: 1;
            color: var(--text-muted);
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.12s, color 0.12s;
        }

        .ce-search-clear:hover {
            background: var(--item-hover);
            color: var(--text-active);
        }

        .ce-search-clear[hidden] {
            display: none !important;
        }

        .ce-search-options {
            display: flex;
            align-items: center;
            gap: 1px;
            padding-left: 2px;
            flex-shrink: 0;
        }

        .ce-search-toggle {
            cursor: pointer;
            color: var(--text-muted);
            font-size: 10px;
            font-weight: 600;
            font-family: inherit;
            padding: 2px 4px;
            border-radius: 3px;
            border: 1px solid transparent;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            transition: color 0.12s, background 0.12s, border-color 0.12s;
            letter-spacing: 0.2px;
        }

        .ce-search-toggle:hover {
            color: var(--text-active);
            background: var(--item-hover);
        }

        .ce-search-toggle.active {
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.16);
            border-color: rgba(56, 189, 248, 0.45);
        }

        body[data-theme="sfarc-light"] .ce-search-toggle.active {
            color: #0369a1;
            background: rgba(3, 105, 161, 0.12);
            border-color: rgba(3, 105, 161, 0.4);
        }

        .ce-search-replaceall {
            flex-shrink: 0;
            height: 28px;
            padding: 0 12px;
            font-size: 11px;
            font-weight: 600;
            color: #ffffff;
            background: var(--primary, #007acc);
            border: none;
            border-radius: 5px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            transition: background 0.12s;
        }

        .ce-search-replaceall:hover {
            background: #1a8ad4;
        }

        body[data-theme="sfarc-light"] .ce-search-replaceall {
            background: #0b57d0;
        }

        .ce-search-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-top: 2px;
            position: relative;
        }

        .ce-search-hint {
            font-size: 10px;
            color: var(--text-muted);
            opacity: 0.75;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .ce-search-more {
            font-size: 15px;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 4px;
            padding: 2px;
            flex-shrink: 0;
            transition: color 0.12s, background 0.12s;
        }

        .ce-search-more:hover {
            color: var(--text-active);
            background: var(--item-hover);
        }

        .ce-search-menu {
            position: absolute;
            right: 0;
            top: 22px;
            z-index: 60;
            min-width: 205px;
            padding: 5px;
            background: #252526;
            border: 1px solid #3c3c3c;
            border-radius: 6px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
        }

        body[data-theme="sfarc-light"] .ce-search-menu {
            background: #ffffff;
            border-color: #d4d4d4;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.14);
        }

        .ce-search-menu-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 9px;
            font-size: 12px;
            color: var(--text-main);
            border-radius: 4px;
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
        }

        .ce-search-menu-item:hover {
            background: #094771;
            color: #ffffff;
        }

        body[data-theme="sfarc-light"] .ce-search-menu-item:hover {
            background: #e8f0fe;
            color: #0b57d0;
        }

        .ce-search-menu-item .cs-check {
            width: 12px;
            font-size: 11px;
            color: #38bdf8;
            text-align: center;
            visibility: hidden;
            flex-shrink: 0;
        }

        body[data-theme="sfarc-light"] .ce-search-menu-item .cs-check {
            color: #0b57d0;
        }

        .ce-search-menu-item.checked .cs-check {
            visibility: visible;
        }

        .ce-search-menu-sep {
            height: 1px;
            margin: 4px 6px;
            background: #3c3c3c;
        }

        body[data-theme="sfarc-light"] .ce-search-menu-sep {
            background: #e0e0e0;
        }

        .ce-search-summary {
            display: none;
            padding: 6px 14px;
            font-size: 11px;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .ce-search-summary b {
            color: var(--text-active);
            font-weight: 600;
        }

        .ce-search-tree {
            padding: 4px 0;
        }

        .cs-empty,
        .cs-info {
            padding: 16px 14px;
            color: var(--text-muted);
            font-size: 12px;
            font-style: italic;
            text-align: center;
        }

        .cs-info {
            font-style: normal;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .cs-error {
            padding: 14px;
            color: #f48771;
            font-size: 12px;
            font-style: italic;
        }

        .file-tree {
            flex: 1;
            overflow-y: auto;
            padding: 6px 0;
        }

        .outline-section {
            height: 180px;
            min-height: 40px;
            max-height: 600px;
            display: flex;
            flex-direction: column;
            background: var(--bg-sidebar);
            position: relative;
        }

        .outline-resizer {
            height: 7px;
            cursor: ns-resize;
            background: transparent;
            border-top: 1px solid var(--border-color);
            z-index: 10;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            touch-action: none;
        }

        /* Visible grip bar so the divider reads as a draggable handle */
        .outline-resizer::after {
            content: '';
            width: 30px;
            height: 3px;
            border-radius: 2px;
            background: var(--border-color);
            transition: background 0.15s ease;
        }

        .outline-resizer:hover::after,
        .outline-resizer.resizing::after {

        /* ── Circular Spinner Loader ── */
        .sfarc-loader-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: none;
            justify-content: center;
            align-items: center;
            background: rgba(30, 30, 30, 0.85);
            z-index: 50;
            flex-direction: column;
            gap: 16px;
        }

        .sfarc-loader-overlay.active {
            display: flex;
        }

        .sfarc-loader-overlay .loader-text {
            font-size: 12px;
            color: #888;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.3px;
        }

        .sfarc-loader {
            position: relative;
            width: 60px;
            height: 60px;
        }

        .sfarc-loader__item {
            position: absolute;
            width: 12px;
            height: 3px;
            background: transparent;
            border-radius: 1.5px;
        }

        /* 12 items around a circle: radius=16, itemWidth=12, itemHeight=3 */
        /* Pre-calculated: angle = 30° × i, offsetX = cos(angle)*16 - 6, offsetY = sin(angle)*16 - 1.5 */
        .sfarc-loader__item-1 {
            transform: translate(7.86px, 6.50px) rotate(30deg);
            animation: sfarc-blink 0.667s linear 0.0556s infinite;
        }

        .sfarc-loader__item-2 {
            transform: translate(1.86px, 12.36px) rotate(60deg);
            animation: sfarc-blink 0.667s linear 0.1111s infinite;
        }

        .sfarc-loader__item-3 {
            transform: translate(-6.00px, 14.50px) rotate(90deg);
            animation: sfarc-blink 0.667s linear 0.1667s infinite;
        }

        .sfarc-loader__item-4 {
            transform: translate(-13.86px, 12.36px) rotate(120deg);
            animation: sfarc-blink 0.667s linear 0.2222s infinite;
        }

        .sfarc-loader__item-5 {
            transform: translate(-19.86px, 6.50px) rotate(150deg);
            animation: sfarc-blink 0.667s linear 0.2778s infinite;
        }

        .sfarc-loader__item-6 {
            transform: translate(-22.00px, -1.50px) rotate(180deg);
            animation: sfarc-blink 0.667s linear 0.3333s infinite;
        }

        .sfarc-loader__item-7 {
            transform: translate(-19.86px, -9.50px) rotate(210deg);
            animation: sfarc-blink 0.667s linear 0.3889s infinite;
        }

        .sfarc-loader__item-8 {
            transform: translate(-13.86px, -15.36px) rotate(240deg);
            animation: sfarc-blink 0.667s linear 0.4444s infinite;
        }

        .sfarc-loader__item-9 {
            transform: translate(-6.00px, -17.50px) rotate(270deg);
            animation: sfarc-blink 0.667s linear 0.5000s infinite;
        }

        .sfarc-loader__item-10 {
            transform: translate(1.86px, -15.36px) rotate(300deg);
            animation: sfarc-blink 0.667s linear 0.5556s infinite;
        }

        .sfarc-loader__item-11 {
            transform: translate(7.86px, -9.50px) rotate(330deg);
            animation: sfarc-blink 0.667s linear 0.6111s infinite;
        }

        .sfarc-loader__item-12 {
            transform: translate(10.00px, -1.50px) rotate(360deg);
            animation: sfarc-blink 0.667s linear 0.6667s infinite;
        }

        @keyframes sfarc-blink {
            0% {
                background: #555;
            }

            100% {
                background: #1e1e1e;
            }
        }

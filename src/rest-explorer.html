<!DOCTYPE html>
<html lang="en">

<head>
  <script src="theme-manager.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REST Console - Salesforce Comet</title>
    <script src="lib/font-awesome.min.js" defer></script>
    <script src="custom-tooltip.js" defer></script>

    <!-- Using Salesforce Comet Core Styles -->
    <link rel="stylesheet" href="inspector.css">
    <link rel="stylesheet" href="glass-toast.css">

    <style>
        :root {
            --bg-main: #0c1017;
            --bg-panel: #161b22;
            --bg-card: #1c2128;
            --border-color: #30363d;
            --text-main: #f0f6fc;
            --text-sub: #8b949e;
            --accent-blue: var(--sfarc-accent-glow, #38bdf8);
            --accent-green: #34d399;
            --accent-purple: #a855f7;
            --accent-orange: var(--sfarc-accent, #f97316);
            --accent-red: #f87171;
            --sf-orange: var(--sfarc-accent, #f97316);
            --sf-orange-hover: var(--sfarc-accent-dark, #ea580c);
            --sf-blue: var(--sfarc-accent-glow, #38bdf8);
            --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Header */
        .rest-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-panel);
            padding: 12px 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .rest-header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .rest-logo-icon {
            background: var(--sf-orange);
            color: white;
            border-radius: 10px;
            padding: 8px 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            font-family: var(--font-mono);
        }

        .rest-title {
            display: flex;
            flex-direction: column;
            line-height: 1.2;
        }

        .rest-title-sub {
            font-size: 11px;
            color: var(--text-sub);
            text-transform: uppercase;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .rest-title-main {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-main);
        }

        .rest-header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-send {
            background: var(--sfarc-accent, var(--sf-orange));
            color: var(--sfarc-accent-contrast, white);
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            transition: all 0.2s ease;
        }

        .btn-send:hover {
            background: var(--sfarc-accent-dark, var(--sf-orange-hover));
            transform: translateY(-1px);
        }

        .btn-save {
            background: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 500;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s ease;
        }

        .btn-save:hover {
            background: #21262d;
            border-color: #484f58;
        }

        .icon-actions {
            display: flex;
            gap: 4px;
            border-left: 1px solid var(--border-color);
            padding-left: 12px;
        }

        .icon-btn {
            background: transparent;
            color: var(--text-sub);
            border: none;
            padding: 8px 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn:hover {
            background: var(--bg-card);
            color: var(--text-main);
        }

        .icon-btn.sf-font-active {
            background: rgba(251, 146, 60, 0.15);
            color: var(--accent-orange);
        }

        /* ── Light Mode ─────────────────────────────────────────────── */
        body.light-theme {
            --bg-main: #f1f5f9;
            --bg-panel: #ffffff;
            --bg-card: #ffffff;
            --border-color: #e2e8f0;
            --text-main: #0f172a;
            --text-sub: #64748b;
        }

        body.light-theme .rest-header {
            background: rgba(255, 255, 255, 0.92);
            border-bottom-color: var(--border-color);
        }

        body.light-theme .rest-top-tab {
            background: #f8fafc;
            border-color: var(--border-color);
        }

        body.light-theme .rest-top-tab.active {
            background: var(--bg-card);
        }

        body.light-theme .method-dropdown {
            background: #f8fafc;
            border-right-color: var(--border-color);
        }

        body.light-theme .url-input-wrapper {
            background: #ffffff;
        }

        body.light-theme .header-input {
            background: #f8fafc;
            border-color: #d0d5dd;
        }

        body.light-theme .header-input:focus {
            border-color: var(--sf-blue);
        }

        body.light-theme .empty-icon {
            color: #cbd5e1;
        }

        body.light-theme .empty-state {
            background: var(--bg-panel);
        }

        body.light-theme .format-btn {
            background: #f8fafc;
            border-color: #d0d5dd;
            color: #475569;
        }

        body.light-theme .format-btn:hover {
            background: #f1f5f9;
            color: #0f172a;
        }

        body.light-theme .btn-save {
            background: #f8fafc;
            border-color: #d0d5dd;
            color: #334155;
        }

        body.light-theme .btn-save:hover {
            background: #f1f5f9;
            border-color: #cbd5e1;
        }

        /* Top Tabs (New Request) */
        .rest-tabs-bar {
            display: flex;
            align-items: flex-end;
            background: var(--bg-main);
            border-bottom: 1px solid var(--border-color);
            padding: 0 16px;
            padding-top: 10px;
            gap: 4px;
        }

        .rest-top-tab {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-bottom: none;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-radius: 8px 8px 0 0;
            font-size: 12px;
            color: var(--text-sub);
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
        }

        .rest-top-tab:hover:not(.active) {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-main);
        }

        body.light-theme .rest-top-tab:hover:not(.active) {
            background: rgba(0, 0, 0, 0.03);
        }

        .rest-top-tab.active {
            background: var(--bg-card);
            color: var(--text-main);
            border-bottom-color: var(--bg-card);
            font-weight: 500;
        }

        .rest-top-tab .tab-label {
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .rest-top-tab .close-tab {
            color: var(--text-sub);
            font-size: 10px;
            opacity: 0;
            transition: opacity 0.15s, color 0.15s;
            padding: 2px;
            border-radius: 4px;
        }

        .rest-top-tab:hover .close-tab,
        .rest-top-tab.active .close-tab {
            opacity: 0.6;
        }

        .rest-top-tab .close-tab:hover {
            color: var(--accent-red);
            opacity: 1;
            background: rgba(248, 113, 113, 0.15);
        }

        .rest-top-tab.add-tab {
            background: transparent;
            border: none;
            color: var(--text-sub);
            font-size: 14px;
            padding: 8px 10px;
            border-radius: 6px;
        }

        .rest-top-tab.add-tab:hover {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-main);
        }

        body.light-theme .rest-top-tab.add-tab:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        body.light-theme .workspace-container {
            background: #f8fafc;
        }

        body.light-theme .url-container {
            background: #ffffff;
            border-color: #d0d5dd;
        }

        body.light-theme .method-dropdown {
            background: #f8fafc;
            color: #0f172a;
        }

        body.light-theme .url-input {
            color: #0f172a;
        }

        body.light-theme .url-prefix {
            color: #64748b;
        }

        body.light-theme .pane-tabs {
            background: #f8fafc;
            border-color: #e2e8f0;
        }

        body.light-theme .pane-tab {
            color: #64748b;
        }

        body.light-theme .pane-tab.active {
            color: #0f172a;
        }

        body.light-theme .pane-content {
            background: #ffffff;
        }

        body.light-theme .pane {
            border-color: #e2e8f0;
        }

        body.light-theme .btn-add-header {
            color: var(--sfarc-accent, #f97316);
            border-color: var(--sfarc-accent, #f97316);
        }

        body.light-theme .btn-add-header:hover {
            background: rgba(var(--sfarc-accent-rgb, 249, 115, 22), 0.08);
        }

        body.light-theme .header-remove {
            color: #ef4444;
        }

        body.light-theme .loading-overlay {
            background: rgba(255, 255, 255, 0.8);
        }

        body.light-theme .rest-modal-overlay {
            background: rgba(0, 0, 0, 0.4);
        }

        body.light-theme .rest-modal {
            background: #ffffff;
            border-color: #e2e8f0;
            color: #0f172a;
        }

        body.light-theme .rest-modal-header {
            border-color: #e2e8f0;
        }

        body.light-theme .rest-modal-title {
            color: #0f172a;
        }

        body.light-theme .rest-modal-body {
            color: #334155;
        }

        body.light-theme .rest-modal-close {
            color: #64748b;
        }

        body.light-theme .rest-modal-close:hover {
            background: #f1f5f9;
            color: #0f172a;
        }

        body.light-theme .rest-modal-footer {
            border-color: #e2e8f0;
        }

        body.light-theme .rest-drawer {
            background: #ffffff;
            border-color: #e2e8f0;
            color: #0f172a;
        }

        body.light-theme .rest-drawer-header {
            border-color: #e2e8f0;
        }

        body.light-theme .rest-drawer-title {
            color: #0f172a;
        }

        body.light-theme .rest-drawer-actions {
            border-color: #e2e8f0;
        }

        body.light-theme .rest-drawer-body {
            background: #f8fafc;
        }

        body.light-theme .rest-btn-secondary {
            background: #f8fafc;
            border-color: #d0d5dd;
            color: #334155;
        }

        body.light-theme .rest-btn-secondary:hover {
            background: #f1f5f9;
        }

        body.light-theme .rest-method-badge {
            color: #0f172a;
        }

        body.light-theme .rest-history-endpoint {
            color: #475569;
        }

        body.light-theme .rest-history-meta {
            color: #64748b;
        }

        body.light-theme .status-badge.status-success {
            background: rgba(16, 185, 129, 0.12);
            color: #059669;
        }

        body.light-theme .status-badge.status-error {
            background: rgba(239, 68, 68, 0.12);
            color: #dc2626;
        }

        /* Main Workspace Container */
        .workspace-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-panel);
            padding: 16px;
            gap: 12px;
            overflow: hidden;
        }

        /* URL Bar Container */
        .url-container {
            display: flex;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: var(--bg-card);
            overflow: hidden;
        }

        body .url-container .method-dropdown,
        body .method-dropdown,
        body .url-container .sfarc-custom-dropdown-trigger,
        body .sfarc-custom-dropdown-trigger {
            background: var(--bg-panel) !important;
            border: none !important;
            border-right: 1px solid var(--border-color) !important;
            padding: 0 12px !important;
            font-weight: 500;
            color: var(--text-main) !important;
            outline: none !important;
            cursor: pointer;
            font-size: 12px !important;
            min-width: 80px !important;
            height: 36px !important;
            max-height: 36px !important;
            min-height: 36px !important;
            box-sizing: border-box !important;
            line-height: 36px !important;
            appearance: auto !important;
            -webkit-appearance: auto !important;
            -moz-appearance: auto !important;
            background-image: none !important;
            background-repeat: unset !important;
            background-position: unset !important;
            background-size: unset !important;
            padding-right: 12px !important;
            border-radius: 0 !important;
            margin: 0 !important;
            box-shadow: none !important;
            background: var(--bg-panel) !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
        }

        .url-input-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            padding: 0 12px;
            background: var(--bg-card);
            height: 36px;
            box-sizing: border-box;
        }

        .url-prefix {
            color: var(--text-sub);
            font-size: 13px;
            user-select: none;
        }

        .url-input {
            flex: 1;
            border: none;
            background: transparent;
            color: var(--text-main);
            padding: 0 4px;
            font-size: 12px;
            font-family: var(--font-mono);
            outline: none;
            height: 36px;
            box-sizing: border-box;
        }

        /* Split Panes (Request / Response) */
        .split-pane {
            display: flex;
            flex-direction: column;
            flex: 1;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            background: var(--bg-panel);
        }

        .pane-tabs {
            display: flex;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-panel);
        }

        .pane-tab {
            padding: 10px 16px;
            font-size: 13px;
            color: var(--text-sub);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            font-weight: 500;
            transition: all 0.15s ease;
        }

        .pane-tab:hover {
            color: var(--text-main);
        }

        .pane-tab.active {
            color: var(--text-main);
            border-bottom-color: var(--sfarc-accent, var(--sf-orange));
        }

        .pane-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .pane-section {
            display: none;
            flex: 1;
            flex-direction: column;
            height: 100%;
        }

        .pane-section.active {
            display: flex;
        }

        /* Monaco Overrides */
        .monaco-editor-container {
            flex: 1;
            height: 100%;
            width: 100%;
            position: relative;
        }

        /* Empty State */
        .empty-state {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg-panel);
            color: var(--text-sub);
            text-align: center;
            gap: 16px;
            z-index: 10;
        }

        .empty-icon {
            font-size: 80px;
            color: #30363d;
            opacity: 0.6;
        }

        .empty-text {
            font-size: 14px;
        }

        .empty-text kbd {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 2px 6px;
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text-main);
        }

        /* Header Key-Value Grid */
        .headers-grid {
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 8px;
            overflow-y: auto;
        }

        .header-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .header-input {
            flex: 1;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            outline: none;
            font-family: var(--font-mono);
            transition: border-color 0.15s ease;
        }

        .header-input:focus {
            border-color: var(--sf-blue);
        }

        .header-input::placeholder {
            color: var(--text-sub);
        }

        .header-remove {
            background: transparent;
            border: none;
            color: var(--text-sub);
            cursor: pointer;
            padding: 8px;
            border-radius: 6px;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-remove:hover {
            color: var(--accent-red);
            background: rgba(248, 113, 113, 0.1);
        }

        .btn-add-header {
            align-self: flex-start;
            background: transparent;
            color: var(--sfarc-accent, var(--sf-blue));
            border: 1px dashed var(--sfarc-accent, var(--sf-blue));
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            margin-top: 10px;
            transition: all 0.15s ease;
        }

        .btn-add-header:hover {
            background: rgba(var(--sfarc-accent-rgb, 249, 115, 22), 0.15);
        }

        /* Status & Format Buttons */
        .response-meta {
            position: absolute;
            top: 8px;
            right: 16px;
            display: flex;
            gap: 12px;
            align-items: center;
            z-index: 20;
        }

        .status-badge {
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 500;
            color: white;
            background: #484f58;
        }

        .status-success {
            background: var(--accent-green);
            color: #0c1017;
        }

        .status-error {
            background: var(--accent-red);
            color: #0c1017;
        }

        .format-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-sub);
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.15s ease;
        }

        .format-btn:hover {
            background: #21262d;
            color: var(--text-main);
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.3);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        /* Overlay is always dark in both themes — accent ring uses the light shade */
        .loading-overlay .comet-loader {
            --sfarc-loader-ring: var(--sfarc-accent-light, var(--sfarc-accent, #5eb4ff));
        }

        /* ── Modal ───────────────────────────────────────────────────── */
        .rest-modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .rest-modal {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            width: 380px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        .rest-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
        }
        .rest-modal-title {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-main);
        }
        .rest-modal-close {
            background: transparent;
            border: none;
            color: var(--text-sub);
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 4px;
            font-size: 12px;
        }
        .rest-modal-close:hover { background: rgba(255,255,255,0.06); color: var(--text-main); }
        .rest-modal-body {
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .rest-form-label {
            font-size: 11px;
            color: var(--text-sub);
            font-weight: 500;
        }
        .rest-form-input, .rest-form-select {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 6px 10px;
            color: var(--text-main);
            font-size: 12px;
            outline: none;
        }
        .rest-form-input:focus, .rest-form-select:focus {
            border-color: var(--sf-orange);
        }
        .rest-save-preview {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            background: var(--bg-card);
            border-radius: 6px;
            margin-top: 4px;
        }
        .rest-method-badge {
            font-size: 10px;
            font-weight: 500;
            padding: 2px 6px;
            border-radius: 4px;
            background: rgba(var(--sfarc-accent-rgb, 249, 115, 22), 0.15);
            color: var(--sfarc-accent, var(--sf-orange));
        }
        .rest-endpoint-preview {
            font-size: 11px;
            color: var(--text-sub);
            font-family: var(--font-mono);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .rest-modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            padding: 10px 16px;
            border-top: 1px solid var(--border-color);
        }
        .rest-btn {
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.15s;
        }
        .rest-btn-primary { background: var(--sf-orange); color: #fff; }
        .rest-btn-primary:hover { background: var(--sf-orange-hover); }
        .rest-btn-secondary { background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border-color); }
        .rest-btn-secondary:hover { background: #21262d; }
        .rest-btn-danger { background: rgba(248,113,113,0.12); color: var(--accent-red); }
        .rest-btn-danger:hover { background: rgba(248,113,113,0.2); }
        .rest-btn-sm { padding: 4px 10px; font-size: 11px; }

        /* ── Drawer ──────────────────────────────────────────────────── */
        .rest-drawer-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.35);
            z-index: 999;
        }
        .rest-drawer {
            position: fixed;
            top: 0; right: 0;
            width: 340px;
            height: 100vh;
            background: var(--bg-panel);
            border-left: 1px solid var(--border-color);
            box-shadow: -4px 0 24px rgba(0,0,0,0.2);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            animation: restDrawerIn 0.2s ease-out;
        }
        @keyframes restDrawerIn {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }
        .rest-drawer-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
        }
        .rest-drawer-title {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-main);
        }
        .rest-drawer-actions {
            padding: 8px 16px;
            border-bottom: 1px solid var(--border-color);
        }
        .rest-drawer-body {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }
        .rest-collection-item {
            padding: 8px 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.1s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .rest-collection-item:hover { background: rgba(255,255,255,0.04); }
        .rest-collection-name {
            font-size: 12px;
            color: var(--text-main);
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .rest-collection-count {
            font-size: 10px;
            color: var(--text-sub);
            background: var(--bg-card);
            padding: 1px 6px;
            border-radius: 8px;
        }
        .rest-collection-actions {
            display: flex;
            gap: 2px;
            opacity: 0;
            transition: opacity 0.1s;
        }
        .rest-collection-item:hover .rest-collection-actions { opacity: 1; }
        .rest-coll-action-btn {
            background: transparent;
            border: none;
            color: var(--text-sub);
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 3px;
            font-size: 10px;
        }
        .rest-coll-action-btn:hover { color: var(--text-main); background: rgba(255,255,255,0.06); }
        .rest-coll-action-btn.delete:hover { color: var(--accent-red); }
        .rest-history-item {
            padding: 8px 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.1s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .rest-history-item:hover { background: rgba(255,255,255,0.04); }
        .rest-history-meta {
            display: flex;
            flex-direction: column;
            gap: 2px;
            flex: 1;
            min-width: 0;
        }
        .rest-history-endpoint {
            font-size: 11px;
            color: var(--text-main);
            font-family: var(--font-mono);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .rest-history-time {
            font-size: 10px;
            color: var(--text-sub);
        }
        .rest-history-delete {
            background: transparent;
            border: none;
            color: var(--text-sub);
            cursor: pointer;
            padding: 2px 4px;
            font-size: 10px;
            border-radius: 3px;
            opacity: 0;
        }
        .rest-history-item:hover .rest-history-delete { opacity: 1; }
        .rest-history-delete:hover { color: var(--accent-red); }
        .rest-drawer-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            color: var(--text-sub);
            font-size: 12px;
            gap: 8px;
        }
        .rest-drawer-empty i { font-size: 24px; opacity: 0.4; }

        /* Saved request sub-item */
        .rest-saved-item {
            padding: 6px 10px 6px 28px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.1s;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
        }
        .rest-saved-item:hover { background: rgba(255,255,255,0.04); }
        .rest-saved-item .rest-method-badge { font-size: 9px; padding: 1px 4px; }
        .rest-saved-item-name {
            color: var(--text-main);
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .rest-saved-item-delete {
            background: transparent;
            border: none;
            color: var(--text-sub);
            cursor: pointer;
            padding: 2px 4px;
            font-size: 10px;
            border-radius: 3px;
            opacity: 0;
        }
        .rest-saved-item:hover .rest-saved-item-delete { opacity: 1; }
        .rest-saved-item-delete:hover { color: var(--accent-red); }

        /* Light mode overrides */
        body.light-theme .rest-modal,
        body.light-theme .rest-drawer {
            background: #ffffff;
        }
        body.light-theme .rest-modal-overlay,
        body.light-theme .rest-drawer-overlay {
            background: rgba(0,0,0,0.25);
        }
        body.light-theme .rest-collection-item:hover,
        body.light-theme .rest-history-item:hover,
        body.light-theme .rest-saved-item:hover {
            background: rgba(0,0,0,0.04);
        }
        body.light-theme .rest-collection-actions { opacity: 0; }
        body.light-theme .rest-collection-item:hover .rest-collection-actions { opacity: 1; }
    </style>
    <link rel="icon" href="../icons/icon-48.png" type="image/png">
    <link rel="stylesheet" href="custom-dropdown.css">
    <link rel="stylesheet" href="controls.css">

        <script src="favicon-glyphs.js"></script>
    <script src="colored-favicon.js" defer></script>
</head>

<body class="sfarc-dark-theme">

    <div class="rest-header">
        <div class="rest-header-left">
            <div class="rest-logo-icon">{ }</div>
            <div class="rest-title">
                <span class="rest-title-sub">Salesforce Comet</span>
                <span class="rest-title-main">REST Console</span>
            </div>
        </div>
        <div class="rest-header-right">
            <button class="icon-btn" id="btn-font-toggle" title="Toggle Editor Font (Mono / Helvetica)" style="font-weight: 500;">Aa</button>
            <button class="btn-send" id="btn-send">Send <i class="fa-solid fa-paper-plane"></i></button>
            <button class="btn-save" id="btn-save">Save</button>
            <div class="icon-actions">
                <button class="icon-btn" id="btn-history" title="History"><i class="fa-solid fa-history"></i></button>
                <button class="icon-btn" id="btn-collections" title="Collections"><i class="fa-solid fa-folder"></i></button>
            </div>
        </div>
    </div>

    <div class="rest-tabs-bar" id="rest-tabs-bar">
        <div class="rest-top-tab active" data-tab-id="1">
            <span class="tab-label">New Request 1</span>
            <i class="fa-solid fa-xmark close-tab" data-close-tab="1"></i>
        </div>
        <button class="rest-top-tab add-tab" id="btn-add-tab" title="New Tab"><i class="fa-solid fa-plus"></i></button>
    </div>

    <div class="workspace-container">

        <!-- URL Bar -->
        <div class="url-container">
            <select id="method-select" class="method-dropdown">
                <option value="GET">GET</option>
                <option value="POST">POST</option>
                <option value="PATCH">PATCH</option>
                <option value="PUT">PUT</option>
                <option value="DELETE">DELETE</option>
            </select>
            <div class="url-input-wrapper">
                <span class="url-prefix" id="instance-url-prefix">https://instance.salesforce.com</span>
                <input type="text" id="endpoint-input" class="url-input" placeholder="/services/data/v60.0/"
                    value="/services/data/v60.0/">
            </div>
        </div>

        <!-- Request Split Pane -->
        <div class="split-pane" style="flex: 0.6;">
            <div class="pane-tabs">
                <div class="pane-tab active" data-target="req-headers">Request Headers</div>
                <div class="pane-tab" data-target="req-body">Request Body</div>
            </div>
            <div class="pane-content">

                <div id="req-headers" class="pane-section active">
                    <div class="headers-grid" id="req-headers-grid">
                        <div class="header-row">
                            <input type="text" class="header-input header-key" value="Content-Type" placeholder="Key">
                            <input type="text" class="header-input header-val" value="application/json"
                                placeholder="Value">
                            <button class="header-remove"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                    <button class="btn-add-header" id="btn-add-header" style="margin-left: 16px;"><i
                            class="fa-solid fa-plus"></i> Add Header</button>
                </div>

                <div id="req-body" class="pane-section">
                    <div class="response-meta">
                        <button class="format-btn" id="format-req-btn" title="Format JSON"><i
                                class="fa-solid fa-indent"></i> Format</button>
                    </div>
                    <div id="req-body-editor" class="monaco-editor-container"></div>
                </div>

            </div>
        </div>

        <!-- Response Split Pane -->
        <div class="split-pane" style="flex: 1;">
            <div class="pane-tabs">
                <div class="pane-tab active" data-target="res-body">Response Body</div>
                <div class="pane-tab" data-target="res-headers">Response Headers</div>
            </div>
            <div class="pane-content">

                <!-- Empty State overlay (hides when response comes) -->
                <div class="empty-state" id="empty-state">
                    <!-- Simple SVG Illustration matching screenshot vibe -->
                    <svg class="empty-icon" width="120" height="120" viewBox="0 0 100 100" fill="none"
                        stroke="currentColor" stroke-width="2">
                        <circle cx="50" cy="50" r="40" stroke-dasharray="4 4" opacity="0.3"></circle>
                        <path d="M40 70 V30 M40 50 H25 V40 M40 60 H55 V50" opacity="0.8"></path>
                        <circle cx="70" cy="30" r="8" fill="transparent" stroke="currentColor"></circle>
                        <circle cx="70" cy="30" r="12" fill="transparent" stroke="currentColor" opacity="0.5"></circle>
                        <path d="M20 70 L40 60 L60 70 L80 60 L100 70" opacity="0.3"></path>
                    </svg>
                    <div class="empty-text">
                        Click Send or use <kbd>CMD/CTRL</kbd> + <kbd>Enter</kbd> to send request
                    </div>
                </div>

                <div id="res-body" class="pane-section active">
                    <div class="response-meta" id="res-meta" style="display: none;">
                        <span id="res-status" class="status-badge"></span>
                        <button class="format-btn" id="copy-res-btn" title="Copy"><i
                                class="fa-solid fa-copy"></i></button>
                    </div>
                    <div id="res-body-editor" class="monaco-editor-container"></div>
                </div>

                <div id="res-headers" class="pane-section">
                    <div class="headers-grid" id="res-headers-grid">
                        <!-- Populated by JS -->
                        <div style="color: var(--text-muted); font-size: 13px; font-style: italic;">Headers will appear
                            here...</div>
                    </div>
                </div>

            </div>
        </div>

    </div>

    <div id="loading" class="loading-overlay">
        <div class="comet-loader"></div>
    </div>

    <!-- Monaco Loader -->
    <!-- Save Modal -->
    <div class="rest-modal-overlay" id="save-modal-overlay" style="display:none">
        <div class="rest-modal" id="save-modal">
            <div class="rest-modal-header">
                <span class="rest-modal-title">Save Request</span>
                <button class="rest-modal-close" id="save-modal-close"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="rest-modal-body">
                <label class="rest-form-label">Request Name</label>
                <input type="text" class="rest-form-input" id="save-name-input" placeholder="e.g. Get Accounts">
                <label class="rest-form-label">Collection (optional)</label>
                <select class="rest-form-select" id="save-collection-select">
                    <option value="">No Collection</option>
                </select>
                <div class="rest-save-preview">
                    <span class="rest-method-badge" id="save-preview-method">GET</span>
                    <span class="rest-endpoint-preview" id="save-preview-endpoint">/services/data/v60.0/</span>
                </div>
            </div>
            <div class="rest-modal-footer">
                <button class="rest-btn rest-btn-secondary" id="save-modal-cancel">Cancel</button>
                <button class="rest-btn rest-btn-primary" id="save-modal-confirm">Save</button>
            </div>
        </div>
    </div>

    <!-- Collections Drawer -->
    <div class="rest-drawer-overlay" id="collections-overlay" style="display:none"></div>
    <div class="rest-drawer" id="collections-drawer" style="display:none">
        <div class="rest-drawer-header">
            <span class="rest-drawer-title"><i class="fa-solid fa-folder-open" style="margin-right:6px"></i>Collections</span>
            <button class="rest-modal-close" id="collections-close"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="rest-drawer-actions">
            <button class="rest-btn rest-btn-sm rest-btn-primary" id="new-collection-btn"><i class="fa-solid fa-plus"></i> New Collection</button>
        </div>
        <div class="rest-drawer-body" id="collections-list"></div>
    </div>

    <!-- History Drawer -->
    <div class="rest-drawer-overlay" id="history-overlay" style="display:none"></div>
    <div class="rest-drawer" id="history-drawer" style="display:none">
        <div class="rest-drawer-header">
            <span class="rest-drawer-title"><i class="fa-solid fa-clock-rotate-left" style="margin-right:6px"></i>History</span>
            <button class="rest-modal-close" id="history-close"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="rest-drawer-actions">
            <button class="rest-btn rest-btn-sm rest-btn-danger" id="clear-history-btn"><i class="fa-solid fa-trash"></i> Clear All</button>
        </div>
        <div class="rest-drawer-body" id="history-list"></div>
    </div>

    <script src="../lib/monaco-editor/min/vs/loader.js"></script>

    <script src="api.js"></script>
    <script src="glass-toast.js"></script>
    <script src="rest-explorer.js"></script>
    <script src="rest-tabs.js"></script>
    <script src="rest-save-collections.js"></script>
    <script src="custom-dropdown.js"></script>
</body>

</html>

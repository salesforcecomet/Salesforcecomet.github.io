<!DOCTYPE html>
<html lang="en">

<head>
  <script src="theme-manager.js"></script>
  <script src="nav-slide.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Org Limits - Salesforce Comet</title>
    <script src="lib/font-awesome.min.js" defer></script>
    <link rel="stylesheet" href="styles/slds/slds.css">
    <link rel="stylesheet" href="styles/sfir.css">
    <link rel="stylesheet" href="inspector.css">
    <link rel="stylesheet" href="glass-toast.css">
    <style>
        :root {
            /* Light Theme Variables (Default) */
            --ol-bg-main: #f8fafc;
            --ol-bg-card: #ffffff;
            --ol-bg-toolbar: #ffffff;
            --ol-border: #e2e8f0;
            --ol-border-toolbar: #cbd5e1;
            --ol-text: #334155;
            --ol-text-sec: #64748b;
            --ol-progress-bg: #e2e8f0;
            --ol-search-bg: #f8fafc;
            --ol-search-border: #cbd5e1;
            --ol-search-shadow: rgba(0, 0, 0, 0.05);
            --ol-hover-shadow: rgba(0, 0, 0, 0.1);
            --ol-card-shadow: rgba(0, 0, 0, 0.05);
            --ol-loader-bg: rgba(255, 255, 255, 0.85);
            --accent: var(--sfarc-accent, #2196f3);
        }

        body.sfarc-dark-theme {
            /* Dark Theme Variables */
            --ol-bg-main: #09090b;
            --ol-bg-card: #18181b;
            --ol-bg-toolbar: #121214;
            --ol-border: #27272a;
            --ol-border-toolbar: #27272a;
            --ol-text: #f4f4f5;
            --ol-text-sec: #a1a1aa;
            --ol-progress-bg: #27272a;
            --ol-search-bg: rgba(255, 255, 255, 0.08);
            --ol-search-border: rgba(255, 255, 255, 0.14);
            --ol-search-shadow: rgba(0, 0, 0, 0.2);
            --ol-hover-shadow: rgba(0, 0, 0, 0.4);
            --ol-card-shadow: rgba(0, 0, 0, 0.2);
            --ol-loader-bg: rgba(9, 9, 11, 0.85);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: var(--ol-bg-main) !important;
            color: var(--ol-text) !important;
            height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.2s, color 0.2s;
        }

        .content-container {
            flex: 1;
            overflow-y: auto;
            padding: 5px;
            background: var(--ol-bg-main) !important;
            transition: background-color 0.2s;
        }

        .limits-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 5px;
        }

        .limit-card {
            background: var(--ol-bg-card) !important;
            border-radius: 10px !important;
            border: 1px solid var(--ol-border) !important;
            padding: 14px !important;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s, border-color 0.2s;
            box-shadow: 0 2px 8px var(--ol-card-shadow);
        }

        .limit-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px var(--ol-hover-shadow);
            border-color: var(--accent) !important;
        }

        .limit-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .limit-name {
            font-weight: 500;
            font-size: 13px;
            color: var(--ol-text) !important;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 200px;
        }

        .progress-container {
            height: 6px;
            background: var(--ol-progress-bg) !important;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s ease-out;
        }

        .limit-stats {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--ol-text-sec) !important;
        }

        .stat-value {
            color: var(--ol-text) !important;
            font-weight: 500;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--ol-loader-bg);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        /* The overlay is always dark in both themes — the accent ring loader
           uses the light accent shade there (no color-distorting invert). */
        .loading-overlay .comet-loader {
            --sfarc-loader-ring: var(--sfarc-accent-light, var(--sfarc-accent, #5eb4ff));
        }

        #limits-search,
        .sfarc-search-input {
            background-color: var(--ol-search-bg) !important;
            background-image: none !important;
            border: 1px solid var(--ol-search-border) !important;
            color: var(--ol-text) !important;
            border-radius: 6px !important;
            font-size: 12.5px !important;
            height: 24px !important;
            outline: none !important;
            box-shadow: 0 2px 6px var(--ol-search-shadow) !important;
            transition: all 0.15s ease;
        }

        #limits-search::placeholder,
        .sfarc-search-input::placeholder {
            color: var(--ol-text-sec) !important;
            opacity: 1 !important;
        }

        #limits-search:focus,
        .sfarc-search-input:focus {
            border-color: var(--accent) !important;
            box-shadow: 0 0 0 3px rgba(var(--sfarc-accent-rgb, 33, 150, 243), 0.25) !important;
            background-color: var(--ol-bg-card) !important;
        }

        .sfir-limits-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            background: var(--ol-bg-toolbar) !important;
            border-bottom: 1px solid var(--ol-border-toolbar) !important;
            gap: 16px;
            flex-shrink: 0;
            margin-top: calc(48px + 5px);
            transition: background-color 0.2s, border-color 0.2s;
        }

        /* Refresh button icon spin while loading */
        @keyframes limits-refresh-spin {
            to {
                transform: rotate(360deg);
            }
        }

        #refresh-btn .fa-rotate.rotating {
            animation: limits-refresh-spin 0.8s linear infinite;
        }

        #refresh-btn .fa-rotate.rotating svg {
            animation: limits-refresh-spin 0.8s linear infinite;
        }
    </style>
        <script src="favicon-glyphs.js"></script>
  <script src="colored-favicon.js" defer></script>
  <link rel="icon" href="../icons/icon-48.png" type="image/png">
    <link rel="stylesheet" href="custom-dropdown.css">
    <link rel="stylesheet" href="controls.css">
    <link rel="stylesheet" href="sfir-embed.css">
</head>

<body>
    <!-- Shared Header Bar matching Export/Import pages exactly
         (hidden in embed mode via sfir-embed.css; theme-manager adds the
         sfir-embedded class — inline scripts are blocked by MV3 CSP) -->
    <div class="slds-builder-header_container">
      <header class="slds-builder-header sfir-header-override">
        <!-- Nav pills -->
        <nav class="slds-builder-header__item slds-builder-header__nav sfir-border-none">
          <ul class="slds-builder-header__nav-list">
            <li class="slds-builder-header__nav-item">
              <a class="slds-builder-header__item-action" data-page="export">
                <svg class="sfir-nav-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
                <span class="sfir-nav-label">Export</span>
              </a>
            </li>
            <li class="slds-builder-header__nav-item">
              <a class="slds-builder-header__item-action" data-page="import">
                <svg class="sfir-nav-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 8l5-5 5 5"/><path d="M12 3v12"/></svg>
                <span class="sfir-nav-label">Import</span>
              </a>
            </li>
            <li class="slds-builder-header__nav-item">
              <a class="slds-builder-header__item-action sfir-nav-active" data-page="limits">
                <svg class="sfir-nav-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
                <span class="sfir-nav-label">Limits</span>
              </a>
            </li>
            <li class="slds-builder-header__nav-item">
              <a class="slds-builder-header__item-action" data-page="metadata">
                <svg class="sfir-nav-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
                <span class="sfir-nav-label">Metadata</span>
              </a>
            </li>
          </ul>
        </nav>
        <!-- Left: Placeholder (global top-progress pill mounts here) -->
        <div id="sfir-header-utility-slot" class="slds-builder-header__item"></div>
        <!-- Center: Logo + Title -->
        <div class="sfir-header-center-title-container">
          <img id="sfarc-comet-logo" class="sfir-header-title-logo" alt="Comet Logo" src="../icons/icon-48.png">
          <span class="sfir-header-title-text">Salesforce Comet </span>
        </div>
        <!-- Right side: Refresh utility & Org Badge -->
        <div class="slds-builder-header__item slds-builder-header__utilities sfir-border-none">
          <button id="refresh-btn" class="slds-button slds-button_neutral" style="border-radius: 9999px; padding: 4px 14px; font-size: 12px; display: inline-flex; align-items: center; gap: 6px; margin-right: 8px;">
            <i class="fa-solid fa-rotate"></i> Refresh
          </button>
          <!-- Org Badge -->
          <div class="slds-builder-header__utilities-item sfir-border-none">
            <a id="sfarc-home-link" href="#" title="Home">
              <span class="slds-badge slds-badge_lightest">
                <span class="slds-badge__icon slds-badge__icon_left">
                  <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px; flex-shrink: 0;">
                    <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                  </svg>
                </span>
                <span class="sfir-org-badge-text" id="sfarc-nav-org"></span>
              </span>
            </a>
          </div>
        </div>
      </header>
    </div>


    <!-- Limits Control Bar (shared fixed header renders 48px tall; start below it with a 5px gap) -->
    <div class="sfir-limits-toolbar" style="display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; background: #121214; border-bottom: 1px solid #27272a; gap: 16px; flex-shrink: 0; margin-top: calc(48px + 5px);">
        <div style="display: flex; align-items: center; gap: 12px;">
            <div style="position: relative; width: 300px; display: flex; align-items: center;">
                <input type="text" id="limits-search" class="sfarc-search-input" placeholder="Search Org Limits..." style="width: 100%; height: 24px; padding: 0 12px; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.14); border-radius: 6px; color: #f1f5f9; font-size: 12.5px; outline: none; transition: all 0.15s ease; box-shadow: 0 2px 6px rgba(0,0,0,0.15);">
            </div>
            <span id="limits-total-count" style="font-size: 12px; font-weight: 500; color: var(--sfarc-accent-glow, var(--sfarc-accent-glow, #38bdf8)); background: rgba(var(--sfarc-accent-glow-rgb, 56, 189, 248), 0.1); padding: 3px 10px; border-radius: 6px; border: 1px solid rgba(var(--sfarc-accent-glow-rgb, 56, 189, 248), 0.2); line-height: 16px;">Total Limits: —</span>
        </div>
        <div style="display: flex; align-items: center; gap: 14px; font-size: 12px; color: var(--ol-text-sec); font-weight: 500;">
            <span style="display: flex; align-items: center; gap: 6px;"><span style="width: 8px; height: 8px; border-radius: 50%; background: var(--sfarc-accent); box-shadow: 0 0 6px var(--sfarc-accent);"></span> Normal</span>
            <span style="display: flex; align-items: center; gap: 6px;"><span style="width: 8px; height: 8px; border-radius: 50%; background: #ffc107; box-shadow: 0 0 6px rgba(255, 193, 7, 0.4);"></span> &gt;70%</span>
            <span style="display: flex; align-items: center; gap: 6px;"><span style="width: 8px; height: 8px; border-radius: 50%; background: #f44336; box-shadow: 0 0 6px rgba(244, 67, 54, 0.4);"></span> &gt;90%</span>
        </div>
    </div>

    <div class="content-container">
        <div id="limits-grid" class="limits-grid">
            <!-- Limit cards will be injected here -->
        </div>
    </div>

    <div id="loading" class="loading-overlay">
        <div class="comet-loader"></div>
    </div>

    <script src="api.js"></script>
    <script src="user-permissions.js"></script>
    <script src="glass-toast.js"></script>
    <script src="org-limits.js"></script>
    <script src="custom-dropdown.js"></script>
</body>

</html>

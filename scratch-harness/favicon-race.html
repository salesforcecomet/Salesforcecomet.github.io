<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Favicon race — theme-manager vs colored-favicon</title>
<style>
  body { background: #1e1e1e; color: #ccc; font-family: monospace; padding: 20px; }
  #fav { width: 64px; height: 64px; background: #26262b; border-radius: 10px; display: flex; align-items: center; justify-content: center; margin: 12px 0; }
  #fav img { width: 44px; height: 44px; }
  #log { white-space: pre-wrap; font-size: 12px; line-height: 1.5; color: #9ade80; }
</style>
</head>
<body>
<h3>Event Monitor favicon — final state after theme-manager + colored-favicon race</h3>
<div id="fav"></div>
<div id="log"></div>
<script>

  window.chrome = window.chrome || {};
  window.chrome.storage = window.chrome.storage || {};
  window.chrome.storage.sync = {
    get: (keys, cb) => { cb({ sfiSettings: { theme: 'dark', accentColor: null } }); },
    onChanged: { addListener: () => {} }
  };

</script>
<script>
(function() {
    if (window.__sfarcThemeManagerLoaded) return;
    window.__sfarcThemeManagerLoaded = true;

    // Build stamp: lets you verify the loaded extension is the latest build.
    // Read it from any page console: window.__SFARC_BUILD. If this value is
    // older than the one in src/theme-manager.js, Chrome is serving a stale
    // copy — reload the extension at chrome://extensions and hard-refresh.
    try {
        window.__SFARC_BUILD = '2026-08-17 10:52 (src)';
        if (document.documentElement) document.documentElement.dataset.sfarcBuild = window.__SFARC_BUILD;
    } catch (e) {}

    const isDarkOnlyPage = window.location.pathname.includes('org-limits.html') ||
                           window.location.pathname.includes('metadata-exporter.html') ||
                           window.location.pathname.includes('graphql-explorer.html') ||
                           window.location.pathname.includes('diff-checker.html') ||
                           window.location.pathname.includes('rest-explorer.html');

    function getPrefix() {
        const path = location.pathname;
        if (/\/src\/[^\/]+\.html?$/.test(path)) {
            return '../icons/';
        }
        if (/\/dist\/src\/[^\/]+\.html?$/.test(path)) {
            return '../../icons/';
        }
        return 'icons/';
    }

    // Dark-only pages (org-limits, metadata-exporter, graphql-explorer, etc.)
    // hard-code a dark body background and MUST never lose their dark theme
    // class, even if the user's saved theme resolves to light — otherwise the
    // header nav + components fall back to light styling on a dark page.
    function updateIconsAndFavicon(isDark) {
        // 1. Update body / document element class for theme
        if (isDark || isDarkOnlyPage) {
            document.documentElement.classList.add('sfarc-dark-theme');
            if (document.body) {
                document.body.classList.add('sfarc-dark-theme');
                document.body.classList.remove('light-theme');
            }
        } else {
            document.documentElement.classList.remove('sfarc-dark-theme');
            if (document.body) {
                document.body.classList.remove('sfarc-dark-theme');
                document.body.classList.add('light-theme');
            }
        }

        // 2. Update Favicon
        const favicon = document.querySelector("link[rel*='icon']");
        const expectedFavicon = 'icon-48.png';
        const prefix = getPrefix();
        const expectedHref = prefix + expectedFavicon;

        if (favicon) {
            const currentHref = favicon.getAttribute('href') || '';
            // Leave comet-managed favicons alone (id-based, since their href is a
            // base64 data URI): colored-favicon.js owns those and re-asserts them.
            const isCometFavicon = favicon.id === 'sfarc-colored-favicon' ||
                                   favicon.id === 'sfarc-custom-favicon' ||
                                   currentHref.includes('sfarc-colored-favicon');
            if (currentHref !== expectedHref && !isCometFavicon) {
                favicon.setAttribute('href', expectedHref);
            }
        } else {
            const link = document.createElement('link');
            link.rel = 'icon';
            link.type = 'image/png';
            link.href = expectedHref;
            document.head.appendChild(link);
        }

        // 3. Update inner <img> logos if needed
        const images = document.querySelectorAll('img');
        images.forEach(img => {
            const src = img.getAttribute('src');
            if (src && /icon-(black|white|color)?-?(\d+)\.png/i.test(src)) {
                const newSrc = src.replace(/icon-(black|white|color)?-?(\d+)\.png/i, (match, type, size) => `icon-${size}.png`);
                if (img.getAttribute('src') !== newSrc) {
                    img.setAttribute('src', newSrc);
                }
            }
        });
    }

    function hexToRgb(hex) {
        if (!hex) return '33, 150, 243';
        hex = hex.replace(/^#/, '');
        if (hex.length === 3) {
            hex = hex.split('').map(c => c + c).join('');
        }
        const num = parseInt(hex, 16);
        return isNaN(num) ? '33, 150, 243' : `${(num >> 16) & 255}, ${(num >> 8) & 255}, ${num & 255}`;
    }

    function hexToRgbArr(hex) {
        const str = hexToRgb(hex);
        return str.split(',').map(s => parseInt(s, 10));
    }

    function mixHex(hex, other, weight) {
        // weight = fraction of `other` to mix in (0..1)
        const a = hexToRgbArr(hex);
        const b = hexToRgbArr(other);
        const c = a.map((v, i) => Math.round(v + (b[i] - v) * weight));
        return '#' + c.map(v => v.toString(16).padStart(2, '0')).join('');
    }

    function deriveAccentShades(color) {
        // Build the full accent family from a single base color:
        //   light = tint for text/icons on dark backgrounds (was #5eb4ff/#38bdf8)
        //   dark  = shade for solid fills that carry white text (was #1976d2)
        //   glow  = brighter partner for gradients/glows (was #38bdf8 in gradients)
        const light = mixHex(color, '#ffffff', 0.45);
        const dark = mixHex(color, '#000000', 0.35);
        const glow = mixHex(color, '#ffffff', 0.22);
        const soft = mixHex(color, '#ffffff', 0.9);
        return { light, dark, glow, soft };
    }

    function applyAccentColor(color) {
        if (!color) color = '#2196f3';
        const rgb = hexToRgb(color);
        const shades = deriveAccentShades(color);
        const root = document.documentElement;

        root.style.setProperty('--primary', color);
        root.style.setProperty('--primary-color', color);
        root.style.setProperty('--primary-dark', color);
        root.style.setProperty('--primary-light', `rgba(${rgb}, 0.15)`);
        root.style.setProperty('--primary-color-rgb', rgb);
        root.style.setProperty('--primary-light-bg', `rgba(${rgb}, 0.12)`);
        root.style.setProperty('--sfarc-primary', color);
        root.style.setProperty('--sfarc-accent', color);
        root.style.setProperty('--sfarc-accent-rgb', rgb);
        root.style.setProperty('--sfarc-accent-light', shades.light);
        root.style.setProperty('--sfarc-accent-dark', shades.dark);
        root.style.setProperty('--sfarc-accent-glow', shades.glow);
        root.style.setProperty('--sfarc-accent-glow-rgb', hexToRgb(shades.glow));
        root.style.setProperty('--sfarc-accent-light-rgb', hexToRgb(shades.light));
        root.style.setProperty('--sfarc-accent-soft', shades.soft);
        root.style.setProperty('--mac-active-blue', color);
        root.style.setProperty('--clone-brand', color);
        root.style.setProperty('--sfir-btn-border-active', color);
        root.style.setProperty('--sfarc-input-focus-border', color);
    }
    window.applyAccentColor = applyAccentColor;

    function injectScrollbarStyles() {
        if (document.getElementById('sfarc-global-scrollbars')) return;
        const style = document.createElement('style');
        style.id = 'sfarc-global-scrollbars';
        style.textContent = `
            ::-webkit-scrollbar {
                width: 6px !important;
                height: 6px !important;
                background: transparent !important;
            }
            ::-webkit-scrollbar-track {
                background: transparent !important;
            }
            ::-webkit-scrollbar-thumb {
                background: transparent !important;
                border-radius: 6px !important;
            }
            *:hover::-webkit-scrollbar-thumb {
                background: rgba(150, 150, 150, 0.35) !important;
            }
            *:hover::-webkit-scrollbar-thumb:hover {
                background: rgba(150, 150, 150, 0.6) !important;
            }
        `;
        if (document.head) document.head.appendChild(style);
    }

    function initThemeSync() {
        chrome.storage.sync.get(['sfiSettings'], (result) => {
            const settings = result.sfiSettings || {};
            const theme = settings.theme || 'system';
            const isDark = isDarkOnlyPage || theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
            updateIconsAndFavicon(isDark);
            applyAccentColor(settings.accentColor);
            injectScrollbarStyles();
        });
    }

    // Run immediately and on DOMContentLoaded
    initThemeSync();
    injectScrollbarStyles();
    
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => {
            initThemeSync();
            injectScrollbarStyles();
        });
    } else {
        // Also do a quick run if DOM is already loaded
        setTimeout(initThemeSync, 0);
    }

    // Set up MutationObserver to handle dynamically added images or attributes
    const observer = new MutationObserver(() => {
        chrome.storage.sync.get(['sfiSettings'], (result) => {
            const settings = result.sfiSettings || {};
            const theme = settings.theme || 'system';
            const isDark = isDarkOnlyPage || theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
            updateIconsAndFavicon(isDark);
        });
    });
    observer.observe(document.documentElement, { childList: true, subtree: true, attributes: true, attributeFilter: ['src', 'href'] });

    // Listen for storage changes
    chrome.storage.onChanged.addListener((changes, area) => {
        if (area === 'sync' && changes.sfiSettings) {
            const settings = changes.sfiSettings.newValue || {};
            const theme = settings.theme || 'system';
            const isDark = isDarkOnlyPage || theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
            updateIconsAndFavicon(isDark);
            applyAccentColor(settings.accentColor);
        }
    });

    // Listen for system preference changes
    try {
        const mql = window.matchMedia('(prefers-color-scheme: dark)');
        const handler = () => {
            chrome.storage.sync.get(['sfiSettings'], (result) => {
                const settings = result.sfiSettings || {};
                const theme = settings.theme || 'system';
                const isDark = isDarkOnlyPage || theme === 'dark' || (theme === 'system' && mql.matches);
                updateIconsAndFavicon(isDark);
            });
        };
        if (mql.addEventListener) {
            mql.addEventListener('change', handler);
        } else if (mql.addListener) {
            mql.addListener(handler);
        }
    } catch (e) {}

    // ── Sliding header-nav indicator ─────────────────────────────────────────
    // The blue active pill physically slides between tabs instead of popping in
    // place. Each page renders the same nav, so on mousedown we remember the tab
    // being left (sessionStorage) and the next page's pill slides in from that
    // position — a continuous slide across the page navigation.
    // React pages (Export/Import) render `.sfir-nav-slider` themselves via
    // PageHeader; static pages (Limits/Metadata) get it injected here.
    function navTabItems(listEl) {
        return Array.prototype.slice.call(listEl.querySelectorAll(':scope > li')).filter(li => !li.classList.contains('sfir-nav-slider'));
    }

    function navActiveIndex(listEl) {
        const items = navTabItems(listEl);
        for (let i = 0; i < items.length; i++) {
            const a = items[i].querySelector('a, button');
            if (a && (a.classList.contains('sfir-nav-active') || a.classList.contains('active') || a.getAttribute('aria-current') === 'page')) {
                return i;
            }
        }
        return -1;
    }

    function navSliderEl(listEl) {
        let slider = listEl.querySelector(':scope > .sfir-nav-slider');
        if (!slider) {
        slider = document.createElement('li');
        slider.className = 'sfir-nav-slider sfir-nav-slider-init';
            slider.setAttribute('aria-hidden', 'true');
            listEl.insertBefore(slider, listEl.firstChild);
        }
        return slider;
    }

    function placeNavSlider(listEl, slider, index) {
        const items = navTabItems(listEl);
        const item = items[index];
        if (!item) return;
        slider.style.width = item.getBoundingClientRect().width + 'px';
        slider.style.transform = 'translateX(' + navTranslateX(listEl, item) + 'px) scaleX(1)';
    }

    // Compute the pill's translateX for a given tab index.
    function navTranslateX(listEl, item) {
        const lr = listEl.getBoundingClientRect();
        const ir = item.getBoundingClientRect();
        const borderLeft = parseFloat(getComputedStyle(listEl).borderLeftWidth) || 0;
        return ir.left - lr.left - borderLeft - 3;
    }

    // Position the pill under the active tab. When `fromIndex` is the tab being
    // left, the pill slides in from there via a keyframe animation (driven by
    // CSS custom properties) — this plays even when transition toggling is
    // unreliable, and the resting inline style is always the final position.
    // Position the pill under the active tab. When `fromIndex` is the tab being
    // left, the pill slides in from there via a keyframe animation. Everything
    // animates through `transform` only (translateX + scaleX for the width
    // change) — no width/layout animation — so the motion stays on the
    // compositor and is smooth. The resting inline style is always the final
    // position.
    function positionNavSlider(listEl, fromIndex) {
        const items = navTabItems(listEl);
        const active = navActiveIndex(listEl);
        if (active < 0 || active >= items.length) return;
        const slider = navSliderEl(listEl);
        const canSlide = typeof fromIndex === 'number' && fromIndex >= 0 && fromIndex < items.length && fromIndex !== active;
        const target = items[active];
        const targetX = navTranslateX(listEl, target);
        const targetW = target.getBoundingClientRect().width;
        slider.style.width = targetW + 'px';
        slider.style.transform = 'translateX(' + targetX + 'px) scaleX(1)';
        // Fresh sliders (just created by React / injected here) sit at the CSS
        // default (left edge, zero width) and the transform transition would
        // animate from there on the very first position — the jitter seen when
        // clicking the current tab reloads the page. Commit the resting
        // transform with transitions suppressed, force a synchronous reflow so
        // the new value is committed, then re-enable transitions.
        if (slider.classList.contains('sfir-nav-slider-init')) {
            void slider.offsetWidth;
            slider.classList.remove('sfir-nav-slider-init');
        }
        if (canSlide) {
            const from = items[fromIndex];
            const fromX = navTranslateX(listEl, from);
            const fromW = from.getBoundingClientRect().width;
            slider.style.setProperty('--sfir-nav-from-x', fromX + 'px');
            slider.style.setProperty('--sfir-nav-to-x', targetX + 'px');
            slider.style.setProperty('--sfir-nav-from-s', (fromW / targetW).toFixed(4));
            slider.style.animation = 'sfirNavSlideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards';
            let cleared = false;
            const clear = () => {
                if (cleared) return;
                cleared = true;
                slider.style.animation = '';
                slider.removeEventListener('animationend', clear);
            };
            slider.addEventListener('animationend', clear);
            setTimeout(clear, 450); // safety in case animationend is swallowed (hidden tab)
        } else {
            slider.style.animation = '';
        }
    }

    function bindNavSlider(listEl) {
        if (listEl.__sfarcNavSliderBound) return;
        listEl.__sfarcNavSliderBound = true;
        // Remember the tab being left so the destination page's pill can slide
        // in from that position. No preview morph here: the page navigates almost
        // immediately, so a mousedown preview gets cut off mid-transition and the
        // next page then replays the slide from the origin — the pill appears to
        // jump back and slide twice (jitter). The destination page plays exactly
        // one clean slide from the origin tab to the newly active one.
        listEl.addEventListener('mousedown', (e) => {
            const a = e.target && e.target.closest ? e.target.closest('.slds-builder-header__item-action') : null;
            if (!a || !listEl.contains(a)) return;
            const items = navTabItems(listEl);
            const idx = items.findIndex(li => li.contains(a));
            if (idx < 0) return;
            const origin = navActiveIndex(listEl);
            try {
                if (origin >= 0) sessionStorage.setItem('sfirNavPrevIndex', String(origin));
            } catch (err) {}
        }, true);
    }

    function initHeaderNavSliders() {
        let prev = -1;
        try {
            const v = sessionStorage.getItem('sfirNavPrevIndex');
            if (v !== null) prev = parseInt(v, 10);
            sessionStorage.removeItem('sfirNavPrevIndex');
        } catch (err) {}
        document.querySelectorAll('.slds-builder-header__nav-list').forEach(listEl => {
            // React pages (Export/Import) render and position their own slider
            // in PageHeader before DOMContentLoaded; only inject/position for
            // the static pages (Limits/Metadata) here.
            if (!listEl.querySelector(':scope > .sfir-nav-slider')) {
                navSliderEl(listEl);
                positionNavSlider(listEl, prev);
            }
            bindNavSlider(listEl);
        });
    }

    window.__sfarcNavSlide = {
        position: positionNavSlider,
        bind: bindNavSlider
    };

    // ── Global top progress bar ──────────────────────────────────────────────
    // Any page can publish an operation's progress (import/export) to
    // chrome.storage.local; every page renders the same slim bar under the
    // header, so the user can switch tabs freely and still watch the operation.
    // If the publishing page was closed, the payload goes stale and the pill
    // flips to a "paused" state (click it to jump back to the running page).
    const TOP_PROGRESS_KEY = 'sfirTopProgress';
    const TOP_PROGRESS_STALE_MS = 8000;
    let topProgressTimer = null;

    function topProgressBarEl() {
        let bar = document.getElementById('sfir-top-progress');
        if (!bar) {
            bar = document.createElement('div');
            bar.id = 'sfir-top-progress';
            bar.className = 'sfir-top-progress';
            bar.innerHTML =
                '<div class="sfir-top-progress-fill"></div>' +
                '<div class="sfir-top-progress-pill" role="button" aria-label="Import progress">' +
                '<div class="sfir-island-rest">' +
                '<span class="sfir-top-progress-dot"></span>' +
                '<span class="sfir-top-progress-percent"></span>' +
                '</div>' +
                '<div class="sfir-island-body">' +
                '<div class="sfir-island-hero">' +
                '<span class="sfir-island-thumb"></span>' +
                '<span class="sfir-island-titles">' +
                '<span class="sfir-top-progress-label"></span>' +
                '<span class="sfir-island-subtitle"></span>' +
                '</span>' +
                '<span class="sfir-island-wave"><i></i><i></i><i></i><i></i><i></i></span>' +
                '</div>' +
                '<div class="sfir-island-track">' +
                '<span class="sfir-island-time-l"></span>' +
                '<span class="sfir-island-bar"><span class="sfir-island-bar-fill"></span></span>' +
                '<span class="sfir-island-time-r"></span>' +
                '</div>' +
                '<div class="sfir-island-controls">' +
                '<span class="sfir-top-progress-counts"></span>' +
                '</div>' +
                '</div>' +
                '</div>' +
                '<div class="sfir-top-progress-ring"></div>';
            bar.querySelector('.sfir-top-progress-pill').addEventListener('click', () => {
                const payload = bar.__sfirTopPayload;
                if (!payload || !payload.page) return;
                const host = new URLSearchParams(location.search).get('host') || '';
                try {
                    location.href = payload.page + '.html?host=' + encodeURIComponent(host);
                } catch (e) {}
            });
        }
        // Keep the pill inside the shared header's utility slot whenever one
        // exists (React pages render their header after theme-manager init, so
        // re-check on every render — this moves it in as soon as the slot is
        // in the DOM). Pages without that header fall back to the old fixed
        // top-right overlay so the pill still appears everywhere.
        const slot = document.getElementById('sfir-header-utility-slot');
        if (slot && bar.parentNode !== slot) {
            slot.appendChild(bar);
            bar.classList.add('in-header');
        } else if (!slot && bar.parentNode !== document.body) {
            document.body.appendChild(bar);
            bar.classList.remove('in-header');
        }
        return bar;
    }

    // Operation → thumbnail icon + accent tint, so the island reads the actual
    // action (Insert / Update / Upsert / Delete / Undelete / Finished) instead
    // of always showing the same upload glyph.
    const ISLAND_ACTIONS = {
        insert: { accent: 'linear-gradient(135deg, #2196f3, #38bdf8)', wave: '#38bdf8', svg: '' },
        update: { accent: 'linear-gradient(135deg, #d97706, #f59e0b)', wave: '#fbbf24', svg: '<path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>' },
        upsert: { accent: 'linear-gradient(135deg, #7c3aed, #a78bfa)', wave: '#a78bfa', svg: '<path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/>' },
        delete: { accent: 'linear-gradient(135deg, #dc2626, #f87171)', wave: '#f87171', svg: '<path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/>' },
        undelete: { accent: 'linear-gradient(135deg, #059669, #34d399)', wave: '#34d399', svg: '<path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>' },
        done: { accent: 'linear-gradient(135deg, #16a34a, #4ade80)', wave: '#4ade80', svg: '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/>' },
        default: { accent: 'linear-gradient(135deg, #2196f3, #38bdf8)', wave: '#38bdf8', svg: '' }
    };

    function renderTopProgress(payload) {
        const bar = topProgressBarEl();
        bar.__sfirTopPayload = payload || null;
        const fill = bar.querySelector('.sfir-top-progress-fill');
        const pill = bar.querySelector('.sfir-top-progress-pill');
        const ring = bar.querySelector('.sfir-top-progress-ring');
        const labelEl = bar.querySelector('.sfir-top-progress-label');
        const percentEl = bar.querySelector('.sfir-top-progress-percent');
        const countsEl = bar.querySelector('.sfir-top-progress-counts');
        if (!payload || !payload.running) {
            bar.classList.remove('active', 'paused', 'running-zero');
            pill.classList.remove('show');
            fill.style.width = '0%';
            if (ring) ring.style.setProperty('--sfir-ring-pct', '0');
            return;
        }
        // Swap the thumbnail icon + tint to match the running operation.
        const actMeta = ISLAND_ACTIONS[payload.action] || ISLAND_ACTIONS.default;
        const thumb = bar.querySelector('.sfir-island-thumb');
        if (thumb) {
            thumb.style.background = actMeta.accent;
            thumb.innerHTML = actMeta.svg
                ? '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' + actMeta.svg + '</svg>'
                : '';
        }
        // Tint the wave bars to match the running operation.
        const wave = bar.querySelector('.sfir-island-wave');
        if (wave) {
            wave.querySelectorAll('i').forEach(function (el) {
                el.style.setProperty('background', actMeta.wave || '#38bdf8', 'important');
            });
        }
        const stale = payload.paused === true || (Date.now() - (payload.updatedAt || 0)) > TOP_PROGRESS_STALE_MS;
        const runningZero = !stale && (payload.percent || 0) <= 0;
        bar.classList.add('active');
        bar.classList.toggle('paused', stale);
        bar.classList.toggle('running-zero', runningZero);
        pill.classList.add('show');
        const pct = Math.max(2, Math.min(100, payload.percent || 0));
        fill.style.width = pct + '%';
        percentEl.textContent = (payload.percent != null ? Math.round(payload.percent) : 0) + '%';
        let labelText = payload.label || 'Working…';
        if (stale) {
            labelText = (labelText || '').replace(/…$/, '') + ' — paused, click to resume';
        }
        labelEl.textContent = labelText;
        const counts = payload.counts;
        if (counts && typeof counts === 'object') {
            const parts = [];
            if (counts.done != null && counts.total != null) parts.push('<span class="sfir-top-progress-count done"><i></i>' + counts.done + ' / ' + counts.total + '</span>');
            if (counts.Queued != null && counts.Queued > 0) parts.push('<span class="sfir-top-progress-count queued"><i></i>' + counts.Queued + ' queued</span>');
            if (counts.Processing != null && counts.Processing > 0) parts.push('<span class="sfir-top-progress-count processing"><i></i>' + counts.Processing + ' processing</span>');
            if (counts.Succeeded != null) parts.push('<span class="sfir-top-progress-count ok"><i></i>' + counts.Succeeded + ' ok</span>');
            if (counts.Failed != null && counts.Failed > 0) parts.push('<span class="sfir-top-progress-count failed"><i></i>' + counts.Failed + ' failed</span>');
            countsEl.innerHTML = parts.length ? parts.join('') : '';
        } else {
            countsEl.innerHTML = '<span class="sfir-top-progress-count waiting"><i></i>Waiting for first batch…</span>';
        }
        const subtitleEl = bar.querySelector('.sfir-island-subtitle');
        const timeLEl = bar.querySelector('.sfir-island-time-l');
        const timeREl = bar.querySelector('.sfir-island-time-r');
        const barFill = bar.querySelector('.sfir-island-bar-fill');
        const pctRound = Math.round(payload.percent || 0);
        if (barFill) barFill.style.width = Math.max(2, Math.min(100, pctRound)) + '%';
        if (ring) ring.style.setProperty('--sfir-ring-pct', Math.max(0, Math.min(100, pctRound)));
        if (subtitleEl) {
            let sub = pct + '%';
            if (counts && counts.Succeeded != null) sub += ' · ' + counts.Succeeded + ' ok';
            if (counts && counts.Failed != null && counts.Failed > 0) sub += ' · ' + counts.Failed + ' failed';
            subtitleEl.textContent = sub;
        }
        if (timeLEl) {
            if (counts && counts.done != null && counts.total != null) {
                timeLEl.textContent = counts.done + ' / ' + counts.total;
            } else if (counts) {
                const total = (counts.Queued || 0) + (counts.Processing || 0) + (counts.Succeeded || 0) + (counts.Failed || 0);
                timeLEl.textContent = (counts.Succeeded || 0) + ' of ' + total + ' records';
            } else {
                timeLEl.textContent = '';
            }
        }
        if (timeREl) timeREl.textContent = pct + '%';
    }

    function publishTopProgress(payload) {
        if (!payload || !payload.running) {
            chrome.storage.local.remove(TOP_PROGRESS_KEY, () => {});
            return;
        }
        payload.updatedAt = Date.now();
        try {
            chrome.storage.local.set({ [TOP_PROGRESS_KEY]: payload }, () => {});
        } catch (e) {}
    }

    function initTopProgress() {
        // Inject the (hidden) bar so the pill is ready; render current state.
        topProgressBarEl();
        chrome.storage.onChanged.addListener((changes, area) => {
            if (area === 'local' && changes[TOP_PROGRESS_KEY]) {
                renderTopProgress(changes[TOP_PROGRESS_KEY].newValue);
            }
        });
        chrome.storage.local.get(TOP_PROGRESS_KEY, (result) => {
            const v = result && result[TOP_PROGRESS_KEY];
            if (v) renderTopProgress(v);
        });
        // Staleness ticker: flips the pill to "paused" if the publisher stopped
        // updating (e.g. its page was closed) without needing a new write. If the
        // publisher stays silent well past the stale threshold, the run (or the
        // "finished" confirmation) is dead — remove the pill entirely instead of
        // leaving it pinned on every page forever.
        if (topProgressTimer) clearInterval(topProgressTimer);
        topProgressTimer = setInterval(() => {
            chrome.storage.local.get(TOP_PROGRESS_KEY, (result) => {
                const v = result && result[TOP_PROGRESS_KEY];
                if (!v || !v.running) return;
                if ((Date.now() - (v.updatedAt || 0)) > TOP_PROGRESS_STALE_MS * 4) {
                    chrome.storage.local.remove(TOP_PROGRESS_KEY, () => {});
                    const bar = document.querySelector('.sfir-top-progress-bar');
                    if (bar) bar.classList.remove('active', 'paused', 'running-zero');
                    return;
                }
                renderTopProgress(v);
            });
        }, 3000);
    }

    window.__sfirTopProgress = {
        set: publishTopProgress,
        render: renderTopProgress
    };

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initHeaderNavSliders);
        document.addEventListener('DOMContentLoaded', initTopProgress);
    } else {
        setTimeout(initHeaderNavSliders, 0);
        setTimeout(initTopProgress, 0);
    }
})();

</script>

window.__sfarcFaviconFill = ["M192 32c0-17.7 14.3-32 32-32C383.1 0 512 128.9 512 288c0 17.7-14.3 32-32 32s-32-14.3-32-32C448 164.3 347.7 64 224 64c-17.7 0-32-14.3-32-32zM60.6 220.6L164.7 324.7l28.4-28.4c-.7-2.6-1.1-5.4-1.1-8.3c0-17.7 14.3-32 32-32s32 14.3 32 32s-14.3 32-32 32c-2.9 0-5.6-.4-8.3-1.1l-28.4 28.4L291.4 451.4c14.5 14.5 11.8 38.8-7.3 46.3C260.5 506.9 234.9 512 208 512C93.1 512 0 418.9 0 304c0-26.9 5.1-52.5 14.4-76.1c7.5-19 31.8-21.8 46.3-7.3zM224 96c106 0 192 86 192 192c0 17.7-14.3 32-32 32s-32-14.3-32-32c0-70.7-57.3-128-128-128c-17.7 0-32-14.3-32-32s14.3-32 32-32z"];

<script defer>
(function () {
    if (window.__sfarcColoredFaviconLoaded) return;
    window.__sfarcColoredFaviconLoaded = true;

    // DJB2 Hash Algorithm for high-entropy hashing
    function djb2Hash(str) {
        let hash = 5381;
        for (let i = 0; i < str.length; i++) {
            hash = ((hash << 5) + hash) + str.charCodeAt(i);
        }
        return Math.abs(hash);
    }

    let cachedSubdomain = null;

    // Extract unique org subdomain prefix
    function getOrgSubdomain() {
        if (cachedSubdomain) return cachedSubdomain;
        const host = window.location.hostname.toLowerCase();
        if (host && (host.includes('salesforce') || host.includes('force.com'))) {
            const parts = host.split('.');
            let sub = parts[0] || 'salesforce';
            cachedSubdomain = sub.replace(/--c$/, '');
            return cachedSubdomain;
        }

        try {
            const params = new URLSearchParams(window.location.search);
            const hostParam = params.get('host');
            if (hostParam) {
                const parts = hostParam.split('.');
                cachedSubdomain = parts[0].replace(/--c$/, '');
                return cachedSubdomain;
            }
        } catch (e) { }

        try {
            const raw = localStorage.getItem('sfarc_logged_in_user');
            if (raw) {
                const parsed = JSON.parse(raw);
                if (parsed && parsed.username && parsed.username.includes('@')) {
                    const domainPart = parsed.username.split('@')[1];
                    if (domainPart) {
                        cachedSubdomain = domainPart.split('.')[0];
                        return cachedSubdomain;
                    }
                }
            }
        } catch (e) { }

        return 'salesforce';
    }

    function detectDarkScheme() {
        try {
            return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        } catch (e) {
            return false;
        }
    }

    function hslToRgb(h, s, l) {
        s /= 100; l /= 100;
        const k = n => (n + h / 30) % 12;
        const a = s * Math.min(l, 1 - l);
        const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
        return { r: Math.round(255 * f(0)), g: Math.round(255 * f(8)), b: Math.round(255 * f(4)) };
    }

    function getLuminance({ r, g, b }) {
        const toLin = c => {
            const s = c / 255;
            return s <= 0.03928 ? s / 12.92 : Math.pow((s + 0.055) / 1.055, 2.4);
        };
        return 0.2126 * toLin(r) + 0.7152 * toLin(g) + 0.0722 * toLin(b);
    }

    function contrastRatio(l1, l2) {
        const L1 = Math.max(l1, l2);
        const L2 = Math.min(l1, l2);
        return (L1 + 0.05) / (L2 + 0.05);
    }

    function getOrgColor() {
        const sub = getOrgSubdomain();
        const hue = djb2Hash(sub) % 360;

        const isDarkBg = detectDarkScheme();

        let sat = 80;
        let light = isDarkBg ? 62 : 48;

        let attempts = 0;
        while (attempts++ < 20) {
            const bgRgb = hslToRgb(hue, sat, light);
            const bgLum = getLuminance(bgRgb);
            const fgRgb = isDarkBg ? { r: 0, g: 0, b: 0 } : { r: 255, g: 255, b: 255 };
            const fgLum = getLuminance(fgRgb);
            const chromeTabRgb = isDarkBg ? { r: 41, g: 42, b: 47 } : { r: 230, g: 232, b: 234 };
            const chromeLum = getLuminance(chromeTabRgb);

            const vsChrome = contrastRatio(bgLum, chromeLum);
            const vsFg = contrastRatio(bgLum, fgLum);

            if (vsChrome >= 1.6 && vsFg >= 3.2) {
                break;
            }

            if (vsChrome < 1.6) {
                light = isDarkBg ? Math.min(85, light + 3) : Math.max(15, light - 3);
            }
            if (vsFg < 3.2) {
                sat = Math.max(40, sat - 2);
                light = isDarkBg ? Math.min(85, light + 2) : Math.max(15, light - 2);
            }
        }

        return `hsl(${hue}, ${sat}%, ${light}%)`;
    }

    // The official Salesforce cloud mark (the cloud-only logo, no wordmark),
    // traced verbatim from Salesforce's published cloud SVG. It's the classic
    // wide cloud with a two-lobe top — filled with the org color, transparent
    // background. No text anywhere: just the cloud + the comet sparkle below.
    const COMET_CLOUD_PATH =
        'M416.224 76.763c32.219-33.57 77.074-54.391 126.682-54.391 65.946 0 123.48 36.772 154.12 91.361 26.626-11.896 56.098-18.514 87.106-18.514 118.94 0 215.368 97.268 215.368 217.247 0 119.993-96.428 217.261-215.368 217.261a213.735 213.735 0 0 1-42.422-4.227c-26.981 48.128-78.397 80.646-137.412 80.646-24.705 0-48.072-5.706-68.877-15.853-27.352 64.337-91.077 109.448-165.348 109.448-77.344 0-143.261-48.939-168.563-117.574-11.057 2.348-22.513 3.572-34.268 3.572C75.155 585.74.5 510.317.5 417.262c0-62.359 33.542-116.807 83.378-145.937-10.26-23.608-15.967-49.665-15.967-77.06C67.911 87.25 154.79.5 261.948.5c62.914 0 118.827 29.913 154.276 76.263';

    // Salesforce Comet favicon as an SVG data URI: no background, just the
    // official cloud mark filled with the org color. No text, no sparkle, no
    // white dots — the cloud alone, like the reference logo.
    // A page can opt into a different glyph by setting
    // window.__sfarcFaviconPaths (array of SVG path d strings, stroked in the
    // org color) before this script runs — e.g. Data Export shows a download
    // arrow, the Code Editor shows its code-brackets mark. Each new-tab tool
    // page gets its own matching glyph, still org-colored.
    function createColoredFaviconDataUrl(color, withGreenDot) {
        const dot = withGreenDot
            ? '<circle cx="819.6" cy="603.2" r="70" fill="#ffffff"/><circle cx="819.6" cy="603.2" r="50" fill="#22c55e"/>'
            : '';
        let custom = window.__sfarcFaviconPaths;
        if (!custom && window.__sfarcFaviconStrokePath) {
            custom = [window.__sfarcFaviconStrokePath];
        }
        // Font Awesome glyph: exact same icon the launcher popup shows for this
        // tool, filled with the org color. Paths are the FA solid 512x512 path
        // data (extracted from the bundled FA library), so the browser-tab
        // favicon is pixel-identical to the popup row icon.
        const fillPaths = window.__sfarcFaviconFill;
        let svg;
        if (fillPaths && fillPaths.length) {
            const paths = fillPaths.map(d => `<path d="${d}" fill="${color}"/>`).join('');
            svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="32" height="32">${paths}</svg>`;
        } else if (custom && custom.length) {
            const paths = custom.map(d =>
                `<path d="${d}" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`
            ).join('');
            svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32">${paths}</svg>`;
        } else {
            svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 999.5 699.74" width="32" height="32"><path d="${COMET_CLOUD_PATH}" fill="${color}"/>${dot}</svg>`;
        }
        return 'data:image/svg+xml;base64,' + btoa(svg);
    }

    let isApplying = false;
    let panelIndicatorActive = false;

    function applyFavicon() {
        if (isApplying) return;
        isApplying = true;

        try {
            const color = getOrgColor();
            // Expose the org color so in-page icons (e.g. the Comet header's
            // Code Editor icon) can match the favicon tint.
            try {
                document.documentElement.style.setProperty('--sfarc-org-color', color);
            } catch (e) { }
            const dataUrl = createColoredFaviconDataUrl(color, panelIndicatorActive);

            const head = document.head || document.getElementsByTagName('head')[0];
            if (!head) return;

            let favicons = head.querySelectorAll("link[rel*='icon']");
            let targetLink = document.getElementById('sfarc-colored-favicon');

            if (!targetLink) {
                targetLink = document.createElement('link');
                targetLink.id = 'sfarc-colored-favicon';
                targetLink.rel = 'shortcut icon';
                targetLink.type = 'image/svg+xml';
                head.appendChild(targetLink);
            } else {
                targetLink.type = 'image/svg+xml';
            }

            targetLink.href = dataUrl;

            // Remove standard default favicons so ours takes priority
            favicons.forEach(link => {
                if (link !== targetLink && link.id !== 'sfarc-colored-favicon' && link.id !== 'sfarc-custom-favicon') {
                    link.remove();
                }
            });
        } catch (e) {
            console.error('[salesforce comet] Colored Favicon error:', e);
        } finally {
            isApplying = false;
        }
    }

    // Exposed globally so main.js can toggle the green dot on panel open/close
    window.__sfarcSetPanelIndicator = function (show) {
        const newState = !!show;
        if (panelIndicatorActive === newState) return;
        panelIndicatorActive = newState;
        applyFavicon();
    };

    function initColoredFavicon() {
        const host = window.location.hostname.toLowerCase();
        if (host === 'login.salesforce.com' || host === 'test.salesforce.com') return;

        applyFavicon();

        if (window.chrome && chrome.storage && chrome.storage.local) {
            chrome.storage.local.get(['sfarcLoggedInUser'], (res) => {
                if (res && res.sfarcLoggedInUser && res.sfarcLoggedInUser.username) {
                    const domainPart = res.sfarcLoggedInUser.username.split('@')[1];
                    if (domainPart) {
                        cachedSubdomain = domainPart.split('.')[0];
                        applyFavicon();
                    }
                }
            });
        }

        try {
            const mql = window.matchMedia('(prefers-color-scheme: dark)');
            const handler = () => applyFavicon();
            if (mql.addEventListener) {
                mql.addEventListener('change', handler);
            } else if (mql.addListener) {
                mql.addListener(handler);
            }
        } catch (e) { }

        // Observe document.head to re-apply if Salesforce Lightning SPA overwrites
        // favicon, or if another extension (e.g. Salesforce Inspector) injects or
        // replaces a favicon link AFTER us. Re-assert ours whenever our link is
        // missing OR any foreign favicon link exists.
        const targetHead = document.head || document.getElementsByTagName('head')[0];
        if (targetHead) {
            const observer = new MutationObserver(() => {
                const ourLink = document.getElementById('sfarc-colored-favicon');
                const foreign = Array.from(document.querySelectorAll("link[rel*='icon']")).filter(l =>
                    l !== ourLink && l.id !== 'sfarc-colored-favicon' && l.id !== 'sfarc-custom-favicon' && document.head.contains(l));
                if (!ourLink || !document.head.contains(ourLink) || foreign.length) {
                    applyFavicon();
                }
            });

            observer.observe(targetHead, { childList: true, subtree: true });
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initColoredFavicon);
    } else {
        initColoredFavicon();
    }
})();

</script>

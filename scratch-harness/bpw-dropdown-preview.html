<style>

/* custom-dropdown.css */

/* NUKE native styles from wrapper container, beating inspector.css specificity */
html body .sfarc-custom-dropdown-container,
body.sfarc-dark-theme .sfarc-custom-dropdown-container.sfarc-custom-dropdown-container,

html body #sfarc-panel:not(.sfarc-dark-theme) .sfarc-custom-dropdown-container:hover,
html body #sfarc-panel.sfarc-dark-theme .sfarc-custom-dropdown-container:hover,
html body #sfarc-panel .sfarc-custom-dropdown-container:focus,
html body #sfarc-panel:not(.sfarc-dark-theme) .sfarc-custom-dropdown-container:focus,
html body #sfarc-panel.sfarc-dark-theme .sfarc-custom-dropdown-container:focus {
    position: relative;
    display: inline-block;
    box-sizing: border-box;
    font-family: inherit;
    /* Reset all native select styles that leaked in via copied classes.
       The container must stay an invisible layout box even when the copied
       select classes (e.g. .sfir-header-select) bring themed backgrounds
       and borders — otherwise a sharp square outline renders behind the
       rounded trigger. body.sfarc-dark-theme html body … raises the
       specificity above every theme rule that matches those copied classes. */
    background: transparent !important;
    background-color: transparent !important;
    background-image: none !important;
    border: none !important;
    border-color: transparent !important;
    padding: 0 !important;
    border-radius: 0 !important;
    height: auto !important;
    box-shadow: none !important;
    min-height: 0 !important;
}

/* Hide the original native select but keep it in DOM for events/forms */
select.sfarc-custom-dropdown-hidden-select,
body select.sfarc-custom-dropdown-hidden-select,
html body select.sfarc-custom-dropdown-hidden-select {
    display: none !important;
    opacity: 0 !important;
    pointer-events: none !important;
    position: absolute !important;
    width: 0 !important;
    height: 0 !important;
}

.sfarc-custom-dropdown-trigger {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    height: 32px;
    min-height: 32px;
    padding: 0 12px;
    background: rgba(255, 255, 255, 0.72) !important;
    backdrop-filter: blur(12px) saturate(180%) !important;
    -webkit-backdrop-filter: blur(12px) saturate(180%) !important;
    border: 1px solid rgba(0, 0, 0, 0.12) !important;
    border-radius: 10px;
    color: #1e293b;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    /* Flat control: uniform boundary on all four sides, no resting drop
       shadow (the Asset Type / API Version pickers and other triggers must

    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    user-select: none;
    box-sizing: border-box;
}

.sfarc-custom-dropdown-trigger:hover {
    background: rgba(255, 255, 255, 0.88) !important;
    border-color: rgba(0, 0, 0, 0.2) !important;
}

.sfarc-custom-dropdown-trigger[data-disabled="true"] {
    opacity: 0.6;
    cursor: not-allowed;
    background: rgba(244, 244, 245, 0.5) !important;
}

.sfarc-custom-dropdown-value {

    overflow: hidden;
    text-overflow: ellipsis;
    margin-right: 8px;
}

.sfarc-custom-dropdown-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    color: #64748b;
    transition: transform 0.2s ease;
}

.sfarc-custom-dropdown-container.sfarc-open .sfarc-custom-dropdown-icon {
    transform: rotate(180deg);
}

.sfarc-custom-dropdown-container.sfarc-open {
    z-index: 10000000 !important;
}

/* Glassmorphism Floating Menu Card */
.sfarc-custom-dropdown-menu.sfarc-custom-dropdown-menu-wide {
    min-width: 480px;
}

.sfarc-custom-dropdown-menu {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    min-width: 220px;
    width: max-content;
    max-width: 320px;
    max-height: 420px;
    overflow-y: auto;
    /* True frosted glass — mostly transparent so the page behind shows
       through the heavy blur. Neutral white, no blue tint. */
    background: rgba(255, 255, 255, 0.6) !important;
    backdrop-filter: blur(28px) saturate(160%) !important;
    -webkit-backdrop-filter: blur(28px) saturate(160%) !important;
    /* Border matches the trigger so the open menu reads as one surface. */
    border: 1px solid rgba(0, 0, 0, 0.12) !important;
    border-radius: 14px !important;
    box-shadow: 0 16px 40px rgba(15, 23, 42, 0.16), 0 4px 12px rgba(15, 23, 42, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.5) !important;
    z-index: 10000000;
    opacity: 0;
    visibility: hidden;
    /* Liquid open: starts small + tucked under the trigger, then springs out
       with a soft overshoot and settles into the resting shape. The transform
       uses a springy curve while opacity/visibility stay quick, so the motion
       reads as a smooth fluid release rather than a fade-in. */
    transform: translateY(-8px) scaleY(0.92) scaleX(0.98);
    transform-origin: top center;
    transition: opacity 0.16s cubic-bezier(0.16, 1, 0.3, 1), transform 0.32s cubic-bezier(0.34, 1.56, 0.64, 1), border-radius 0.32s cubic-bezier(0.34, 1.56, 0.64, 1), visibility 0.16s;
    padding: 8px;
    box-sizing: border-box;
}

.sfarc-custom-dropdown-menu.sfarc-menu-open,
.sfarc-custom-dropdown-container.sfarc-open .sfarc-custom-dropdown-menu {
    opacity: 1 !important;
    visibility: visible !important;
    pointer-events: all !important;
    transform: translateY(0) scale(1) !important;
    border-radius: 12px !important;
    display: flex !important;
    flex-direction: column !important;
    z-index: 2147483647 !important;
}

.sfarc-custom-dropdown-option {
    display: flex !important;
    align-items: center !important;
    padding: 5px 10px 5px 28px !important;
    min-height: 26px !important;
    border-radius: 8px !important;
    cursor: pointer !important;
    color: #1e293b !important;
    font-size: 12.5px !important;
    font-weight: 500 !important;
    margin-bottom: 1px !important;
    transition: background 0.15s ease, color 0.15s ease, transform 0.15s ease !important;
    position: relative !important;
    user-select: none !important;
    white-space: nowrap !important;
    box-sizing: border-box !important;
}

.sfarc-custom-dropdown-option:hover {

    color: #ffffff !important;
}

.sfarc-custom-dropdown-option.sfarc-selected {
    background: rgba(var(--sfarc-accent-rgb, 33, 150, 243), 0.12) !important;
    color: var(--sfarc-accent, #2196f3) !important;
    font-weight: 600 !important;
}

/* The checkmark for selected options */
.sfarc-custom-dropdown-checkmark {

    width: 13px !important;

}

.sfarc-custom-dropdown-option.sfarc-selected .sfarc-custom-dropdown-checkmark {

}

/* ── Search box at the top of the menu ─────────────────────────────────── */
.sfarc-custom-dropdown-search {
    position: relative !important;
    display: flex !important;
    align-items: center !important;
    margin-bottom: 4px !important;
    padding-bottom: 6px !important;
    border-bottom: 1px solid rgba(0, 0, 0, 0.06) !important;
}

.sfarc-custom-dropdown-search-icon {
    position: absolute !important;
    left: 10px !important;

    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    color: #94a3b8 !important;
    pointer-events: none !important;

.sfarc-custom-dropdown-search-input,
input.sfarc-custom-dropdown-search-input,
html body .sfarc-custom-dropdown-search-input {
    width: 100% !important;
    height: 30px !important;
    min-height: 30px !important;
    padding: 0 10px 0 32px !important;
    padding-left: 32px !important;
    border: 1px solid rgba(0, 0, 0, 0.1) !important;
    border-radius: 10px !important;
    background: rgba(255, 255, 255, 0.65) !important;
    backdrop-filter: blur(10px) !important;
    -webkit-backdrop-filter: blur(10px) !important;
    color: #1e293b !important;
    font-size: 12.5px !important;
    font-weight: 400 !important;
    outline: none !important;
    box-shadow: none !important;
    box-sizing: border-box !important;
    transition: border-color 0.15s ease, box-shadow 0.15s ease !important;
}

.sfarc-custom-dropdown-search-input:focus {
    border-color: var(--sfarc-accent, #2196f3) !important;
    box-shadow: 0 0 0 2.5px rgba(2, 132, 199, 0.16) !important;
}

.sfarc-custom-dropdown-search-input::placeholder {
    color: #94a3b8 !important;
}

.sfarc-custom-dropdown-options {
    max-height: 360px;
    overflow-y: auto;
}

.sfarc-custom-dropdown-empty {

    color: #71717a;
    font-size: 12px;
    text-align: center;
}

/* Dark Mode Glassmorphism Overrides — each selector also matches the

.sfarc-dark-theme .sfarc-custom-dropdown-search-icon,

.sfarc-dark-theme .sfarc-custom-dropdown-search-input,
.sfarc-custom-dropdown-menu.sfarc-dark-theme .sfarc-custom-dropdown-search-input {

}

.sfarc-dark-theme .sfarc-custom-dropdown-search-input:focus,

.sfarc-dark-theme .sfarc-custom-dropdown-search-input::placeholder,
.sfarc-custom-dropdown-menu.sfarc-dark-theme .sfarc-custom-dropdown-search-input::placeholder {

}

.sfarc-dark-theme .sfarc-custom-dropdown-empty,
.sfarc-custom-dropdown-menu.sfarc-dark-theme .sfarc-custom-dropdown-empty {
    color: #8b949e !important;
}

.sfarc-dark-theme .sfarc-custom-dropdown-trigger {

    backdrop-filter: blur(14px) saturate(150%) !important;
    -webkit-backdrop-filter: blur(14px) saturate(150%) !important;
    border: 1px solid rgba(255, 255, 255, 0.16) !important;
    color: #f1f5f9 !important;
    box-shadow: none !important;
}

.sfarc-dark-theme .sfarc-custom-dropdown-trigger:hover,
.sfarc-dark-theme .sfarc-custom-dropdown-container.sfarc-open .sfarc-custom-dropdown-trigger {

.sfarc-dark-theme .sfarc-custom-dropdown-trigger[data-disabled="true"] {

.sfarc-dark-theme .sfarc-custom-dropdown-menu,
.sfarc-custom-dropdown-menu.sfarc-dark-theme {
    /* Neutral charcoal glass — no slate/navy blue cast. Low opacity + heavy

    backdrop-filter: blur(28px) saturate(150%) !important;
    -webkit-backdrop-filter: blur(28px) saturate(150%) !important;
    border: 1px solid rgba(255, 255, 255, 0.14) !important;
    box-shadow: 0 20px 48px rgba(0, 0, 0, 0.55), 0 4px 16px rgba(0, 0, 0, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.06) !important;
}

.sfarc-dark-theme .sfarc-custom-dropdown-option,
.sfarc-custom-dropdown-menu.sfarc-dark-theme .sfarc-custom-dropdown-option {
    color: #cbd5e1 !important;
}

.sfarc-dark-theme .sfarc-custom-dropdown-option:hover,
.sfarc-custom-dropdown-menu.sfarc-dark-theme .sfarc-custom-dropdown-option:hover {
    background: var(--sfarc-accent, var(--sfarc-accent, #2196f3)) !important;
    color: #ffffff !important;
    box-shadow: 0 2px 8px rgba(var(--sfarc-accent-rgb, 33, 150, 243), 0.35) !important;

.sfarc-dark-theme .sfarc-custom-dropdown-option.sfarc-selected,
.sfarc-custom-dropdown-menu.sfarc-dark-theme .sfarc-custom-dropdown-option.sfarc-selected {
    /* Tint with the ORG accent (not a hardcoded sky blue) so a lime org

    background: rgba(var(--sfarc-accent-rgb, 56, 189, 248), 0.16) !important;
    color: var(--sfarc-accent-glow, #38bdf8) !important;
}

.sfarc-dark-theme .sfarc-custom-dropdown-option.sfarc-selected:hover,
.sfarc-custom-dropdown-menu.sfarc-dark-theme .sfarc-custom-dropdown-option.sfarc-selected:hover {

    box-shadow: 0 2px 8px rgba(var(--sfarc-accent-rgb, 33, 150, 243), 0.35) !important;
}

.sfarc-dark-theme .sfarc-custom-dropdown-checkmark,

}

/* ==========================================================================
   Bulk Permission Wizard — standalone page (opened in its own browser tab)
   Light theme is the default; dark overrides live under body.sfarc-dark-theme
   (theme-manager.js toggles that class, matching every other standalone page).
   ========================================================================== */

/* ---------- Page shell ---------- */
html,
body {
  height: 100%;
  margin: 0;
}

body {
  background: #eef1f5;
  color: #1e293b;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 13px;
  overflow: hidden;
}

#bpw-root {
  height: 100%;
}

.bpw-root {
  height: 100%;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  padding: 14px 18px 16px;
  gap: 12px;
  background: linear-gradient(180deg, #eef1f5 0%, #e7ebf0 100%);
}

/* ---------- Header ---------- */
.bpw-header {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}

.bpw-header-title {
  display: flex;
  align-items: center;
  gap: 12px;
}

.bpw-header-title > i {
  font-size: 18px;
  color: var(--sfarc-accent, #2196f3);
  background: rgba(var(--sfarc-accent-rgb, 33, 150, 243), 0.1);
  border: 1px solid rgba(var(--sfarc-accent-rgb, 33, 150, 243), 0.26);
  border-radius: 9px;
  padding: 8px;
  width: 38px;
  height: 38px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-sizing: border-box;
  flex-shrink: 0;
}

.bpw-header-text h2 {
  margin: 0;
  font-size: 16px;
  font-weight: 700;
  color: #0f172a;
  letter-spacing: -0.01em;
}

.bpw-header-text p {
  margin: 2px 0 0;
  font-size: 12px;
  color: #64748b;
}

.bpw-header-right {
  display: flex;
  align-items: center;
  gap: 8px;
}

/* ---------- Stepper ---------- */
.bpw-stepper {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
  padding: 10px 14px;
  background: #ffffff;
  border: 1px solid #d8dde6;
  border-radius: 10px;
  box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
}

.bpw-step {
  display: flex;
  align-items: center;
  gap: 8px;
  color: #94a3b8;
  white-space: nowrap;
}

.bpw-step-circle {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: #eef2f7;
  border: 1px solid #d8dde6;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
  color: #64748b;
  flex-shrink: 0;
  transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
}

.bpw-step.active .bpw-step-circle {
  background: var(--sfarc-accent, #2196f3);
  border-color: var(--sfarc-accent, #2196f3);
  color: #ffffff;
  box-shadow: 0 0 0 3px rgba(var(--sfarc-accent-rgb, 33, 150, 243), 0.16);
}

.bpw-step.active .bpw-step-label {
  color: var(--sfarc-accent, #2196f3);
  font-weight: 600;
}

.bpw-step-label {
  font-size: 12px;
  font-weight: 500;
}

.bpw-step-line {
  flex: 1;
  height: 2px;
  min-width: 22px;
  background: #d8dde6;
  border-radius: 2px;
  transition: background-color 0.25s ease;
}

.bpw-step-line.active {
  background: var(--sfarc-accent, #2196f3);
}

/* ---------- Body / panels ---------- */
.bpw-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.bpw-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-height: 0;
  animation: bpwPanelIn 0.22s cubic-bezier(0.4, 0, 0.2, 1) both;
}

@keyframes bpwPanelIn {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* ---------- Controls row ---------- */
.bpw-controls {
  display: flex;
  gap: 12px;
  align-items: flex-end;
  flex-shrink: 0;
  flex-wrap: wrap;
}

.bpw-control-group {
  display: flex;
  flex-direction: column;
  gap: 5px;
  min-width: 0;
}

.bpw-control-group .bpw-permset {
  width: 280px;
}

.bpw-control-group.bpw-target-search {
  flex: 1;
  min-width: 220px;
}

.bpw-control-group.bpw-object-search {
  flex: 1;
  min-width: 240px;
}

/* ---------- Tool controls (label / input / select / button) ---------- */
.tool-label {
  font-size: 10.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: #64748b;
}

.tool-input,
.tool-select {
  background: #ffffff;
  border: 1px solid #cdd4dd;
  border-radius: 8px;
  color: #1e293b;
  font-size: 12.5px;
  padding: 0 12px;
  outline: none;
  transition: border-color 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
  width: 100%;
  box-sizing: border-box;
  height: 30px;
  min-height: 30px;
  line-height: 1;
}

.tool-input::placeholder {
  color: #94a3b8;
}

.tool-input:hover:not(:focus),
.tool-select:hover:not(:focus) {
  border-color: #b6bfca;
}

.tool-input:focus,
.tool-select:focus {
  border-color: var(--sfarc-accent, #2196f3);
  box-shadow: 0 0 0 3px rgba(var(--sfarc-accent-rgb, 33, 150, 243), 0.14);
  background: #ffffff;
}

.tool-select {
  appearance: none;
  -webkit-appearance: none;
  /* The chevron is a positioned icon (.bpw-select-chevron), not a background
     image — a background chevron could tile/repeat if another stylesheet's
     `background` shorthand leaks in and resets background-repeat. */
  padding-right: 30px; /* keep option text clear of the chevron icon */
  cursor: pointer;
  font-family: inherit;
}

.tool-select option {
  background: #ffffff;
  color: #1e293b;
}

/* ---------- Search bars (Target Name + Select Objects) ---------- */
/* The icon is a plain inline <svg class="bpw-search-icon"> — unlike
   <i class="fa-solid">, Font Awesome's JS never rewrites it, so the DOM and
   this positioning are identical in every environment. */
.bpw-search-wrap {
  position: relative;
  display: flex;
  align-items: center;
}

.bpw-select-wrap {
  position: relative;
  display: flex;
  align-items: center;
}

.bpw-select-wrap > .bpw-select-chevron {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  width: 13px;
  height: 13px;
  color: #64748b;
  pointer-events: none;
  z-index: 1;
  transition: color 0.15s ease;
}

.bpw-select-wrap:focus-within > .bpw-select-chevron {
  color: var(--sfarc-accent, #2196f3);
}

/* When the Permission Set select is enhanced into the custom searchable
   dropdown (custom-dropdown.js), the native chevron is replaced by the
   dropdown's own trigger chevron — hide this one to avoid a double arrow. */
.bpw-select-wrap:has(.sfarc-custom-processed) > .bpw-select-chevron {
  display: none;
}

.bpw-search-wrap > .bpw-search-icon {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  width: 13px;
  height: 13px;
  color: #94a3b8;
  pointer-events: none;
  z-index: 1;
  transition: color 0.15s ease;
}

.bpw-search-wrap:focus-within > .bpw-search-icon {
  color: var(--sfarc-accent, #2196f3);
}

.bpw-search-wrap .tool-input {
  padding-left: 30px;
  padding-right: 30px;
  font-family: inherit;
  font-size: 12.5px;
}

.bpw-search-clear {
  position: absolute;
  right: 6px;
  width: 18px;
  height: 18px;
  border: none;
  border-radius: 50%;
  background: transparent;
  color: #94a3b8;
  display: none;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  padding: 0;
  font-size: 11px;
  line-height: 1;
  transition: background-color 0.12s ease, color 0.12s ease;
}

.bpw-search-clear:hover {
  background: rgba(100, 116, 139, 0.16);
  color: #334155;
}

.bpw-search-wrap.has-text .bpw-search-clear {
  display: flex;
}

/* ---------- List box ---------- */
.bpw-list-box {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
  background: #ffffff;
  border: 1px solid #d8dde6;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
}

.bpw-list-toolbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 12px;
  border-bottom: 1px solid #d8dde6;
  background: #f8fafc;
  flex-shrink: 0;
  flex-wrap: wrap;
}

.bpw-select-all {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-size: 12px;
  font-weight: 600;
  color: #1e293b;
  cursor: pointer;
  white-space: nowrap;
}

.bpw-select-all input[type="checkbox"],
.bpw-object-check input[type="checkbox"],
.bpw-rt-row input[type="checkbox"],
.bpw-field-toggle input[type="checkbox"] {
  accent-color: var(--sfarc-accent, #2196f3);
  width: 13px;
  height: 13px;
  cursor: pointer;
}

.bpw-count-badge {
  display: inline-flex;
  align-items: center;
  padding: 2px 10px;
  border-radius: 12px;
  background: rgba(var(--sfarc-accent-rgb, 33, 150, 243), 0.08);
  border: 1px solid rgba(var(--sfarc-accent-rgb, 33, 150, 243), 0.24);
  color: var(--sfarc-accent, #2196f3);
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
}

.bpw-list-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 12px;
  border-bottom: 1px solid #d8dde6;
  font-size: 10.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: #64748b;
  background: #f1f5f9;
  flex-shrink: 0;
}

.bpw-list-check {
  width: 22px;
  flex-shrink: 0;
}

.bpw-list-name {
  flex: 1.2;
  min-width: 0;
}

.bpw-list-desc {
  flex: 1;
  min-width: 0;
}

.bpw-list-scroll {
  flex: 1;
  overflow-y: auto;
  min-height: 0;
}

.bpw-object-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 12px;
  border-bottom: 1px solid #eef2f7;
  cursor: pointer;
  transition: background-color 0.12s ease;
}

.bpw-object-row:hover {
  background: #f8fafc;
}

.bpw-object-row.selected {
  background: rgba(var(--sfarc-accent-rgb, 33, 150, 243), 0.06);
}

.bpw-object-row.selected .bpw-object-name {
  color: var(--sfarc-accent, #2196f3);
  font-weight: 600;
}

.bpw-object-check {
  width: 22px;
  display: flex;
  align-items: center;
  flex-shrink: 0;
  cursor: pointer;
}

.bpw-object-name {
  flex: 1.2;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 12.5px;
  color: #1e293b;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.bpw-object-desc {
  flex: 1;
  font-size: 12px;
  color: #64748b;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.bpw-empty {
  padding: 26px 14px;
  text-align: center;
  color: #64748b;
  font-size: 12.5px;
}

/* ---------- Footer / buttons ---------- */
.bpw-footer {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  padding: 4px 2px 2px;
  flex-shrink: 0;
}

.tool-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 0 14px;
  height: 30px;
  background: #ffffff;
  border: 1px solid #cdd4dd;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 500;
  color: #1e293b;
  cursor: pointer;
  transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  font-family: inherit;
  white-space: nowrap;
}

.tool-btn:hover {
  background: #f1f5f9;
  border-color: #b6bfca;
}

.tool-btn.primary {
  background: var(--sfarc-accent, #2196f3);
  color: #ffffff;
  border-color: var(--sfarc-accent, #2196f3);
  font-weight: 600;
  box-shadow: 0 1px 3px rgba(var(--sfarc-accent-rgb, 33, 150, 243), 0.3);
}

.tool-btn.primary:hover {
  background: #0266b8;
  border-color: #0266b8;
  color: #ffffff;
}

.tool-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.bpw-back {
  background: transparent;
  border-color: #cdd4dd;
}

/* ---------- Record types ---------- */
.bpw-rt-title {
  font-size: 12.5px;
  font-weight: 600;
  color: #1e293b;
  flex: 1;
}

.bpw-rt-group {
  padding: 8px 12px;
  border-bottom: 1px solid #eef2f7;
}

.bpw-rt-object {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 12px;
  font-weight: 600;
  color: var(--sfarc-accent, #2196f3);
  margin-bottom: 5px;
}

.bpw-rt-items {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.bpw-rt-row {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 9px;
  border-radius: 12px;
  background: #f8fafc;
  border: 1px solid #d8dde6;
  font-size: 11.5px;
  color: #334155;
  cursor: pointer;
  transition: border-color 0.12s ease, background-color 0.12s ease;
}

.bpw-rt-row:hover {
  border-color: rgba(var(--sfarc-accent-rgb, 33, 150, 243), 0.4);
}

/* ---------- Fields ---------- */
.bpw-field-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 5px 12px;
  border-bottom: 1px solid #eef2f7;
}

.bpw-field-name {
  flex: 1.4;
  min-width: 0;
  font-size: 12.5px;
  color: #1e293b;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.bpw-field-api {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 10.5px;
  color: #64748b;
  margin-left: 6px;
}

.bpw-field-type {
  flex: 0.6;
  font-size: 11px;
  color: #64748b;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

.bpw-field-toggle {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  color: #64748b;
  cursor: pointer;
  white-space: nowrap;
  transition: color 0.12s ease;
}

.bpw-field-toggle:has(input:checked) {
  color: var(--sfarc-accent, #2196f3);
}

/* ---------- Verify ---------- */
.bpw-verify-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 14px;
  border-bottom: 1px solid #eef2f7;
  font-size: 12.5px;
  color: #64748b;
}

.bpw-verify-row strong {
  color: #1e293b;
  font-weight: 600;
}

.bpw-verify-object {
  padding: 8px 14px;
  border-bottom: 1px solid #eef2f7;
}

.bpw-verify-objhead {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12.5px;
  color: #1e293b;
}

.bpw-verify-objhead span {
  color: #64748b;
  font-size: 11.5px;
}

.bpw-verify-sub {
  font-size: 11px;
  color: #64748b;
  margin-top: 3px;
}

.bpw-verify-body {
  flex: 1;
  overflow-y: auto;
  min-height: 0;
}

.bpw-verify-result {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  border-bottom: 1px solid #eef2f7;
}

.bpw-verify-result.ok {
  color: #059669;
}

.bpw-verify-result.err {
  color: #dc2626;
}

.bpw-verify-result > i {
  font-size: 20px;
}

.bpw-verify-result div {
  display: flex;
  flex-direction: column;
}

.bpw-verify-result strong {
  font-size: 13px;
  font-weight: 600;
}

.bpw-verify-result span {
  font-size: 11.5px;
  color: #64748b;
}

.bpw-verify-fail {
  padding: 6px 14px;
  font-size: 11.5px;
  color: #dc2626;
  border-bottom: 1px solid #eef2f7;
}

<script>
// custom-dropdown.js

(function() {
    // Prevent multiple injections
    if (window.sfarcCustomDropdownsInitialized) return;
    window.sfarcCustomDropdownsInitialized = true;

    const CHECKMARK_SVG = `<svg class="sfarc-custom-dropdown-checkmark" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
    const CHEVRON_SVG = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>`;
    const SEARCH_SVG = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>`;

    function closeAllDropdowns() {
        document.querySelectorAll('.sfarc-custom-dropdown-container.sfarc-open').forEach(el => {
            el.classList.remove('sfarc-open');
        });
        document.querySelectorAll('.sfarc-custom-dropdown-menu.sfarc-menu-open').forEach(m => {
            m.classList.remove('sfarc-menu-open');
            m.style.opacity = '0';
            // Let the liquid shrink-back transition play before hiding the node.
            setTimeout(() => {
                if (!m.classList.contains('sfarc-menu-open')) {
                    m.style.display = 'none';
                    m.style.visibility = 'hidden';
                    m.style.pointerEvents = 'none';
                }
            }, 200);
        });
    }

    // Close all open dropdowns when clicking outside
    document.addEventListener('click', (e) => {
        if (!e.target.closest('.sfarc-custom-dropdown-container') && !e.target.closest('.sfarc-custom-dropdown-menu')) {
            closeAllDropdowns();
        }
    });

    // Dropdown menus are teleported to document.body to escape overflow
    // clipping, which detaches them from the host page's theme scope (e.g.
    // #sfarc-panel.sfarc-dark-theme). Copy the dark-theme class onto the menu
    // itself so the .sfarc-dark-theme overrides in custom-dropdown.css keep
    // menus dark in dark mode regardless of where the menu lives in the DOM.
    function syncMenuTheme(menu, hostEl) {
        const themedAncestor = hostEl.closest ? hostEl.closest('.sfarc-dark-theme') : null;
        menu.classList.toggle('sfarc-dark-theme', !!themedAncestor);
    }

    function enhanceSelect(selectEl) {
        if (selectEl.hasAttribute('multiple')) return; // Skip multi-select for now
        // Opt-out: hosts that already style the native select mark it with data-custom-dropdown="off"
        if (selectEl.dataset.customDropdown === 'off') return;

        // If already processed and custom dropdown container is present right next to it, skip
        if (selectEl.classList.contains('sfarc-custom-processed') &&
            selectEl.nextElementSibling &&
            selectEl.nextElementSibling.classList.contains('sfarc-custom-dropdown-container')) {
            return;
        }

        // Remove any orphaned or existing custom dropdown containers in the same field wrapper
        if (selectEl.parentNode) {
            Array.from(selectEl.parentNode.children).forEach(child => {
                if (child.classList.contains('sfarc-custom-dropdown-container')) {
                    child.remove();
                }
            });
        }

        selectEl.classList.add('sfarc-custom-processed');
        selectEl.classList.add('sfarc-custom-dropdown-hidden-select');

        // Create Container
        const container = document.createElement('div');
        container.className = 'sfarc-custom-dropdown-container';
        
        // Inherit inline styles that affect layout
        if (selectEl.style.width) container.style.width = selectEl.style.width;
        if (selectEl.style.flex) container.style.flex = selectEl.style.flex;
        if (selectEl.style.flexShrink) container.style.flexShrink = selectEl.style.flexShrink;
        if (selectEl.style.flexGrow) container.style.flexGrow = selectEl.style.flexGrow;
        if (selectEl.style.minWidth) container.style.minWidth = selectEl.style.minWidth;
        if (selectEl.style.maxWidth) container.style.maxWidth = selectEl.style.maxWidth;

        // Copy classes from the select (except the hidden one) to the container to inherit positioning/margin
        Array.from(selectEl.classList).forEach(cls => {
            if (cls !== 'sfarc-custom-processed' && cls !== 'sfarc-custom-dropdown-hidden-select') {
                container.classList.add(cls);
            }
        });

        // Trigger Button
        const trigger = document.createElement('div');
        trigger.className = 'sfarc-custom-dropdown-trigger';
        if (selectEl.disabled) trigger.setAttribute('data-disabled', 'true');
        
        // Inherit height/padding if explicitly set
        if (selectEl.style.height) trigger.style.height = selectEl.style.height;
        if (selectEl.style.padding) trigger.style.padding = selectEl.style.padding;
        if (selectEl.style.fontSize) trigger.style.fontSize = selectEl.style.fontSize;

        const valueSpan = document.createElement('span');
        valueSpan.className = 'sfarc-custom-dropdown-value';
        
        const iconSpan = document.createElement('span');
        iconSpan.className = 'sfarc-custom-dropdown-icon';
        iconSpan.innerHTML = CHEVRON_SVG;

        trigger.appendChild(valueSpan);
        trigger.appendChild(iconSpan);

        // Menu
        const menu = document.createElement('div');
        menu.className = 'sfarc-custom-dropdown-menu';
        // Keep the menu's theme in sync with the host select's themed scope.
        syncMenuTheme(menu, selectEl);
        // Wide menus (e.g. data-export Templates) get a marker class so the
        // teleported menu keeps its widened size after it moves to <body>.
        if (selectEl.classList.contains('sfir-header-select')) {
            menu.classList.add('sfarc-custom-dropdown-menu-wide');
        }

        container.appendChild(trigger);

        // Insert container right after the select in the DOM
        selectEl.parentNode.insertBefore(container, selectEl.nextSibling);

        let searchInput = null;

        function updateMenuPosition() {
            if (!container.classList.contains('sfarc-open')) return;

            const rect = trigger.getBoundingClientRect();
            const viewportHeight = window.innerHeight || document.documentElement.clientHeight;

            // Teleport menu to document.body to guarantee no parent overflow:hidden clips it
            if (menu.parentNode !== document.body) {
                document.body.appendChild(menu);
            }

            // Re-sync the theme class every open — the menu lives at <body>
            // level, so it must carry the page's dark-theme scope itself.
            syncMenuTheme(menu, selectEl);

            menu.style.position = 'fixed';
            menu.style.zIndex = '2147483647';
            const isWide = menu.classList.contains('sfarc-custom-dropdown-menu-wide');
            const viewportWidth = window.innerWidth || document.documentElement.clientWidth;
            let menuWidth = Math.max(rect.width, isWide ? 480 : 220);
            if (isWide) {
                // Size the menu to fit the widest option so long queries (e.g.
                // the data-export Templates list) don't need a horizontal
                // scrollbar. Text is measured with the option's real font so the
                // result is accurate even if the menu hasn't laid out yet.
                // Clamp to the viewport so it never overflows the screen.
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                let widest = 0;
                menu.querySelectorAll('.sfarc-custom-dropdown-option').forEach(opt => {
                    const cs = getComputedStyle(opt);
                    ctx.font = cs.font || `${cs.fontSize} ${cs.fontFamily}`;
                    const textEl = opt.querySelector('span');
                    const text = (textEl ? textEl.textContent : opt.textContent) || '';
                    // 13px checkmark + 28px left padding + 10px right padding + 6px breathing room
                    const w = ctx.measureText(text).width + 13 + 28 + 10 + 6;
                    if (w > widest) widest = w;
                });
                if (widest > 0) {
                    menuWidth = Math.max(menuWidth, widest + 16); // + menu padding (8px each side)
                }
                menuWidth = Math.min(menuWidth, viewportWidth - 16);
            }
            menu.style.left = `${Math.max(8, Math.min(rect.left, viewportWidth - menuWidth - 8))}px`;
            menu.style.width = `${menuWidth}px`;

            // Render the menu (kept invisible) so its REAL height can be
            // measured. scrollHeight is 0 while the menu is display:none, and
            // the old `|| 340` fallback over-estimated short menus — a 6-option
            // menu (~205px) was treated as 340px, so the pop-above check fired
            // too eagerly and the menu floated far up the viewport instead of
            // hugging the trigger. The hidden state is never painted (the open
            // class is applied after a forced reflow by the caller), so the
            // liquid-open transition still starts from the closed state.
            menu.style.display = 'flex';
            menu.style.flexDirection = 'column';
            menu.style.visibility = 'hidden';
            menu.style.opacity = '0';
            menu.style.pointerEvents = 'none';
            const menuHeight = Math.min(420, menu.scrollHeight || 340);

            // Check if popping down exceeds bottom of viewport
            if (rect.bottom + menuHeight + 8 > viewportHeight && rect.top > menuHeight + 8) {
                // Pop UP above the trigger — the liquid grows down from the trigger edge
                menu.style.top = `${Math.max(8, rect.top - menuHeight - 4)}px`;
                menu.style.transformOrigin = 'bottom center';
            } else {
                // Pop DOWN below the trigger — the liquid grows up from the trigger edge
                menu.style.top = `${rect.bottom + 4}px`;
                menu.style.transformOrigin = 'top center';
            }

            // Reveal the menu (same frame — the open transition is driven by
            // the .sfarc-menu-open class added right after this call).
            menu.style.opacity = '1';
            menu.style.visibility = 'visible';
            menu.style.pointerEvents = 'all';
        }

        function closeThisMenu() {
            container.classList.remove('sfarc-open');
            menu.classList.remove('sfarc-menu-open');
            menu.style.opacity = '0';
            // Let the liquid shrink-back transition play before hiding the node.
            setTimeout(() => {
                if (!container.classList.contains('sfarc-open')) {
                    menu.style.display = 'none';
                    menu.style.visibility = 'hidden';
                    menu.style.pointerEvents = 'none';
                }
            }, 200);
        }

        // Function to rebuild options
        const rebuildMenu = () => {
            menu.innerHTML = '';
            
            const isSearchable = selectEl.dataset.searchable === 'true' || selectEl.options.length > 8;
            
            if (isSearchable) {
                const searchWrap = document.createElement('div');
                searchWrap.className = 'sfarc-custom-dropdown-search';
                
                const searchIcon = document.createElement('span');
                searchIcon.className = 'sfarc-custom-dropdown-search-icon';
                searchIcon.innerHTML = SEARCH_SVG;
                
                searchInput = document.createElement('input');
                searchInput.type = 'text';
                searchInput.className = 'sfarc-custom-dropdown-search-input';
                searchInput.placeholder = selectEl.dataset.searchPlaceholder || 'Search...';
                
                searchWrap.appendChild(searchIcon);
                searchWrap.appendChild(searchInput);
                menu.appendChild(searchWrap);

                searchInput.addEventListener('input', (e) => {
                    renderOptions(e.target.value.toLowerCase());
                    updateMenuPosition();
                });
                
                searchInput.addEventListener('click', (e) => e.stopPropagation());
            } else {
                searchInput = null;
            }

            const optionsContainer = document.createElement('div');
            optionsContainer.className = 'sfarc-custom-dropdown-options';
            menu.appendChild(optionsContainer);

            const renderOptions = (filterText = '') => {
                optionsContainer.innerHTML = '';
                let selectedText = '';
                let shown = 0;

                Array.from(selectEl.options).forEach((opt) => {
                    const text = opt.text;
                    const val = opt.value;
                    const isSelected = opt.selected;

                    if (isSelected) {
                        selectedText = text;
                    }

                    if (filterText && !text.toLowerCase().includes(filterText) && !val.toLowerCase().includes(filterText)) {
                        return;
                    }

                    shown++;
                    const optDiv = document.createElement('div');
                    optDiv.className = 'sfarc-custom-dropdown-option';
                    if (isSelected) optDiv.classList.add('sfarc-selected');

                    optDiv.innerHTML = `${CHECKMARK_SVG}<span>${text}</span>`;

                    optDiv.addEventListener('click', (e) => {
                        e.stopPropagation();
                        selectEl.value = val;
                        
                        // Dispatch native events
                        selectEl.dispatchEvent(new Event('change', { bubbles: true }));
                        selectEl.dispatchEvent(new Event('input', { bubbles: true }));

                        closeThisMenu();

                        // Update UI
                        rebuildMenu();
                    });
                    
                    optionsContainer.appendChild(optDiv);
                });

                if (shown === 0) {
                    const empty = document.createElement('div');
                    empty.className = 'sfarc-custom-dropdown-empty';
                    empty.textContent = 'No matches found';
                    optionsContainer.appendChild(empty);
                }

                // Update trigger text
                valueSpan.textContent = selectedText || (selectEl.options[0] ? selectEl.options[0].text : '');
            };

            renderOptions('');
            
            // Sync disabled state
            if (selectEl.disabled) {
                trigger.setAttribute('data-disabled', 'true');
            } else {
                trigger.removeAttribute('data-disabled');
            }
        };

        rebuildMenu();

        // Trigger Click Event
        trigger.addEventListener('click', (e) => {
            e.stopPropagation();
            if (selectEl.disabled) return;
            
            const wasOpen = container.classList.contains('sfarc-open');
            closeAllDropdowns();

            if (!wasOpen) {
                container.classList.add('sfarc-open');
                updateMenuPosition();
                // Show the menu (display:flex) and force a reflow so the closed
                // liquid state is committed BEFORE the open class flips on —
                // otherwise the transition can start while the menu is still
                // display:none and the liquid motion is skipped.
                void menu.offsetHeight;
                menu.classList.add('sfarc-menu-open');
                if (searchInput) {
                    setTimeout(() => searchInput.focus(), 0);
                }
            }
        });

        // Reposition on scroll/resize
        window.addEventListener('scroll', () => {
            if (container.classList.contains('sfarc-open')) {
                updateMenuPosition();
            }
        }, true);

        window.addEventListener('resize', () => {
            if (container.classList.contains('sfarc-open')) {
                updateMenuPosition();
            }
        });

        // Watch for changes to the original select (e.g., options injected dynamically or value changed via JS)
        const observer = new MutationObserver((mutations) => {
            let needsRebuild = false;
            mutations.forEach(m => {
                if (m.type === 'childList' || (m.type === 'attributes' && (m.attributeName === 'disabled' || m.attributeName === 'value'))) {
                    needsRebuild = true;
                }
            });
            if (needsRebuild) rebuildMenu();
        });

        observer.observe(selectEl, { childList: true, attributes: true, subtree: true });
        
        // Also listen to 'change' event on original select in case it's changed by code without attributes mutating
        selectEl.addEventListener('change', () => {
            rebuildMenu();
        });
    }

    // Initialize all existing selects
    function initAll() {
        document.querySelectorAll('select').forEach(enhanceSelect);
    }

    // Watch for new selects added to the DOM dynamically
    const domObserver = new MutationObserver((mutations) => {
        let hasNewNodes = false;
        mutations.forEach(m => {
            if (m.addedNodes.length > 0) hasNewNodes = true;
        });
        
        if (hasNewNodes) {
            document.querySelectorAll('select:not(.sfarc-custom-processed)').forEach(enhanceSelect);
        }
    });

    // Start observing DOM when ready
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => {
            initAll();
            domObserver.observe(document.body, { childList: true, subtree: true });
        });
    } else {
        initAll();
        domObserver.observe(document.body, { childList: true, subtree: true });
    }

    // Public API for hosts that inject selects after startup (e.g. the panel
    // injected by main.js). Idempotent — already-processed selects are skipped.
    window.sfarcEnhanceAllSelects = initAll;
    window.sfarcEnhanceSelect = enhanceSelect;

})();

  const container = document.querySelector('.sfarc-custom-dropdown-container');
  const trigger = document.querySelector('.sfarc-custom-dropdown-trigger');
  const search = document.querySelector('.sfarc-custom-dropdown-search-input');
  const chevron = document.querySelector('.bpw-select-chevron');
  return {
    selectHidden: getComputedStyle(select).display === 'none',
    containerExists: !!container,
    triggerText: trigger ? trigger.querySelector('.sfarc-custom-dropdown-value').textContent.slice(0, 40) : null,
    searchExists: !!search,
    searchPlaceholder: search ? search.placeholder : null,
    nativeChevronHidden: chevron ? getComputedStyle(chevron).display === 'none' : null,
    optionCount: document.querySelectorAll('.sfarc-custom-dropdown-option').length
  };
}
window.__bpwProbe = () => JSON.stringify(probe(), null, 1);
// Verify filtering + selection programmatically (the search input listener
// calls renderOptions + updateMenuPosition; drive it directly).
window.__bpwFilter = (text) => {
  const search = document.querySelector('.sfarc-custom-dropdown-search-input');
  const setter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value').set;
  setter.call(search, text);
  search.dispatchEvent(new Event('input', { bubbles: true }));
  return document.querySelectorAll('.sfarc-custom-dropdown-option').length;
};
window.__bpwClickFirst = () => {
  const first = document.querySelector('.sfarc-custom-dropdown-option');
  first.click();
  const select = document.getElementById('bpw-permset');
  return { value: select.value, label: select.options[select.selectedIndex].text };
};
document.getElementById('report').textContent = window.__bpwProbe();
</script>

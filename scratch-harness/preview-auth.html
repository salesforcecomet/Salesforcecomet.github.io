<!DOCTYPE html><html><head><meta charset="utf-8"><style>
body { font-family: -apple-system, Segoe UI, sans-serif; background: #eef1f5; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.sfarc-modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(8, 10, 14, 0.55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
    box-sizing: border-box;
    animation: sfarcOverlayIn 0.18s ease-out;
}

@keyframes sfarcOverlayIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

.sfarc-modal-card {
    background: var(--clone-card-bg) !important;
    border: 1px solid var(--clone-card-border) !important;
    border-radius: var(--clone-radius-lg) !important;
    box-shadow: var(--clone-shadow-lg) !important;
    width: 100%;
    max-width: 640px;
    max-height: 86vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    animation: sfarcModalIn 0.22s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes sfarcModalIn {
    from { opacity: 0; transform: translateY(12px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

.sfarc-auth-tiles-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 18px;
}

@media (max-width: 520px) {
    .sfarc-auth-tiles-grid { grid-template-columns: 1fr; }
}

.sfarc-auth-tile {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: var(--clone-inset);
    border: 1px solid var(--clone-card-border);
    border-radius: var(--clone-radius-md);
    padding: 12px 14px;
    cursor: pointer;
    transition: all 0.16s ease;
}

.sfarc-auth-tile:hover {
    border-color: var(--clone-accent-border);
    background: var(--clone-card-bg);
    box-shadow: var(--clone-shadow-md);
    transform: translateY(-1px);
}

.sfarc-auth-tile-left {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
}

.sfarc-auth-tile-icon {
    width: 30px;
    height: 30px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
}

.sfarc-auth-tile-icon.prod {
    background: rgba(22, 163, 74, 0.14);
    color: var(--clone-success);
}

.sfarc-auth-tile-icon.sandbox {
    background: rgba(180, 83, 9, 0.14);
    color: var(--clone-warning);
}

.sfarc-auth-tile-title {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--clone-text-primary);
}

.sfarc-auth-tile-sub {
    font-size: 11px;
    color: var(--clone-text-secondary);
    margin-top: 1px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.sfarc-auth-tile-arrow {
    color: var(--clone-text-muted);
    font-size: 13px;
    flex-shrink: 0;
    transition: transform 0.16s ease;
}

.sfarc-auth-tile:hover .sfarc-auth-tile-arrow {
    color: var(--clone-accent);
    transform: translateX(3px);
}

.sfarc-divider-badge {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 16px 0;
    color: var(--clone-text-muted);
}

.sfarc-divider-badge::before,
.sfarc-divider-badge::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--clone-card-border);
}

.sfarc-divider-text {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    white-space: nowrap;
}

.sfarc-input-with-icon {
    position: relative;
    display: flex;
    align-items: center;
}

.sfarc-input-with-icon .sfarc-input {
    padding-left: 34px !important;
}

.sfarc-input-icon {
    position: absolute;
    left: 11px;
    font-size: 13px;
    pointer-events: none;
    color: var(--clone-text-muted);
    z-index: 1;
}

    position: relative;
    display: flex;
    align-items: center;
}

.sfarc-input-with-icon .sfarc-input {

}

    position: absolute;
    left: 11px;

}
.sfarc-modal-close-btn {
    background: transparent;
    border: none;
    color: var(--clone-text-muted);
    font-size: 15px;
    cursor: pointer;
    padding: 4px;
    border-radius: 6px;
    line-height: 1;
    transition: all 0.13s ease;
}

.sfarc-modal-close-btn:hover {
    color: var(--clone-text-primary);
    background: var(--clone-inset);
}

.sfarc-modal-body {
    padding: 18px 20px;
    overflow-y: auto;
    flex: 1;
}

.sfarc-modal-footer {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 10px;
    padding: 12px 20px;
    border-top: 1px solid var(--clone-card-border);
    background: var(--clone-card-2);
    flex-shrink: 0;
}

/* Progress modal */
.sfarc-progress-bar-container {
    width: 100%;
    height: 6px;
    border-radius: 9999px;
    background: var(--clone-inset);
    overflow: hidden;
    margin: 10px 0 14px 0;
}

.sfarc-progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--clone-accent), var(--clone-accent-strong));
    border-radius: 9999px;
    transition: width 0.3s ease;
}

.sfarc-console-output {
    background: var(--clone-card-2);
    border: 1px solid var(--clone-card-border);
    border-radius: var(--clone-radius-md);
    padding: 10px 12px;
    font-family: var(--clone-mono);
    font-size: 11px;
    line-height: 1.7;
    color: var(--clone-text-secondary);
    white-space: pre-wrap;
    max-height: 180px;
    overflow-y: auto;
}

/* Created records list */
.sfarc-created-records-section { margin-top: 16px; }

.sfarc-created-records-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
    flex-wrap: wrap;
}

.sfarc-created-records-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--clone-success);
}

.sfarc-created-records-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 220px;
    overflow-y: auto;
}

.sfarc-created-record-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: var(--clone-inset);
    border: 1px solid var(--clone-card-border);
    border-radius: var(--clone-radius-sm);
    padding: 8px 12px;
}

.sfarc-created-record-item.parent-rec {
    background: var(--clone-accent-soft);
    border-color: var(--clone-accent-border);
}

.sfarc-record-info-group {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
}

.sfarc-sobject-badge {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    background: var(--clone-card-2);
    border: 1px solid var(--clone-card-border);
    color: var(--clone-text-secondary);
    border-radius: 6px;
    padding: 3px 8px;
    white-space: nowrap;
    flex-shrink: 0;
}

.sfarc-sobject-badge.parent {
    background: var(--clone-accent);
    border-color: var(--clone-accent);
    color: #ffffff;
}

.sfarc-record-name-link {
    font-size: 12.5px;

.sfarc-form-label {

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Asset Type Dropdown — No Drop Shadow</title>
<style>
  /* Real custom-dropdown.css */
/* custom-dropdown.css */

/* NUKE native styles from wrapper container, beating inspector.css specificity */
html body .sfarc-custom-dropdown-container,
body.sfarc-dark-theme .sfarc-custom-dropdown-container.sfarc-custom-dropdown-container,
html body #sfarc-panel .sfarc-custom-dropdown-container,
html body #sfarc-panel:not(.sfarc-dark-theme) .sfarc-custom-dropdown-container,
html body #sfarc-panel.sfarc-dark-theme .sfarc-custom-dropdown-container,
html body #sfarc-panel .sfarc-custom-dropdown-container:hover,
html body #sfarc-panel:not(.sfarc-dark-theme) .sfarc-custom-dropdown-container:hover,
html body #sfarc-panel.sfarc-dark-theme .sfarc-custom-dropdown-container:hover,
html body #sfarc-panel .sfarc-custom-dropdown-container:focus,
html body #sfarc-panel:not(.sfarc-dark-theme) .sfarc-custom-dropdown-container:focus,
html body #sfarc-panel.sfarc-dark-theme .sfarc-custom-dropdown-container:focus {
    position: relative;
    display: inline-block;
    box-sizing: border-box;
    font-family: inherit;
    /* Reset all native select styles that leaked in via copied classes.
       The container must stay an invisible layout box even when the copied
       select classes (e.g. .sfir-header-select) bring themed backgrounds
       and borders — otherwise a sharp square outline renders behind the
       rounded trigger. body.sfarc-dark-theme html body … raises the
       specificity above every theme rule that matches those copied classes. */
    background: transparent !important;
    background-color: transparent !important;
    background-image: none !important;
    border: none !important;
    border-color: transparent !important;
    padding: 0 !important;
    border-radius: 0 !important;
    height: auto !important;
    box-shadow: none !important;
    min-height: 0 !important;
}

/* Hide the original native select but keep it in DOM for events/forms */
select.sfarc-custom-dropdown-hidden-select,
body select.sfarc-custom-dropdown-hidden-select,
html body select.sfarc-custom-dropdown-hidden-select {
    display: none !important;
    opacity: 0 !important;
    pointer-events: none !important;
    position: absolute !important;
    width: 0 !important;
    height: 0 !important;
}

.sfarc-custom-dropdown-trigger {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    height: 32px;
    min-height: 32px;
    padding: 0 12px;
    background: rgba(255, 255, 255, 0.72) !important;
    backdrop-filter: blur(12px) saturate(180%) !important;
    -webkit-backdrop-filter: blur(12px) saturate(180%) !important;
    border: 1px solid rgba(0, 0, 0, 0.12) !important;
    border-radius: 10px;
    color: #1e293b;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    /* Flat control: uniform boundary on all four sides, no resting drop
       shadow (the Asset Type / API Version pickers and other triggers must
       read as plain inputs, not raised buttons). */
    box-shadow: none !important;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    user-select: none;
    box-sizing: border-box;
}

.sfarc-custom-dropdown-trigger:hover {
    background: rgba(255, 255, 255, 0.88) !important;
    border-color: rgba(0, 0, 0, 0.2) !important;
}

.sfarc-custom-dropdown-trigger[data-disabled="true"] {
    opacity: 0.6;
    cursor: not-allowed;
    background: rgba(244, 244, 245, 0.5) !important;
}

.sfarc-custom-dropdown-value {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-right: 8px;
}

.sfarc-custom-dropdown-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    color: #64748b;
    transition: transform 0.2s ease;
}

.sfarc-custom-dropdown-container.sfarc-open .sfarc-custom-dropdown-icon {
    transform: rotate(180deg);
}

.sfarc-custom-dropdown-container.sfarc-open {
    z-index: 10000000 !important;
}

/* Glassmorphism Floating Menu Card */
.sfarc-custom-dropdown-menu.sfarc-custom-dropdown-menu-wide {
    min-width: 480px;
}

.sfarc-custom-dropdown-menu {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    min-width: 220px;
    width: max-content;
    max-width: 320px;
    max-height: 420px;
    overflow-y: auto;
    background: rgba(255, 255, 255, 0.82) !important;
    backdrop-filter: blur(20px) saturate(190%) !important;
    -webkit-backdrop-filter: blur(20px) saturate(190%) !important;
    /* Border matches the trigger so the open menu reads as one surface. */
    border: 1px solid rgba(0, 0, 0, 0.12) !important;
    border-radius: 14px !important;
    box-shadow: 0 16px 40px rgba(15, 23, 42, 0.16), 0 4px 12px rgba(15, 23, 42, 0.08) !important;
    z-index: 10000000;
    opacity: 0;
    visibility: hidden;
    /* Liquid open: starts small + tucked under the trigger, then springs out
       with a soft overshoot and settles into the resting shape. The transform
       uses a springy curve while opacity/visibility stay quick, so the motion
       reads as a smooth fluid release rather than a fade-in. */
    transform: translateY(-8px) scaleY(0.92) scaleX(0.98);
    transform-origin: top center;
    transition: opacity 0.16s cubic-bezier(0.16, 1, 0.3, 1), transform 0.32s cubic-bezier(0.34, 1.56, 0.64, 1), border-radius 0.32s cubic-bezier(0.34, 1.56, 0.64, 1), visibility 0.16s;
    padding: 8px;
    box-sizing: border-box;
}

.sfarc-custom-dropdown-menu.sfarc-menu-open,
.sfarc-custom-dropdown-container.sfarc-open .sfarc-custom-dropdown-menu {
    opacity: 1 !important;
    visibility: visible !important;
    pointer-events: all !important;
    transform: translateY(0) scale(1) !important;
    border-radius: 12px !important;
    display: flex !important;
    flex-direction: column !important;
    z-index: 2147483647 !important;
}

.sfarc-custom-dropdown-option {
    display: flex !important;
    align-items: center !important;
    padding: 5px 10px 5px 28px !important;
    min-height: 26px !important;
    border-radius: 8px !important;
    cursor: pointer !important;
    color: #1e293b !important;
    font-size: 12.5px !important;
    font-weight: 500 !important;
    margin-bottom: 1px !important;
    transition: background 0.15s ease, color 0.15s ease, transform 0.15s ease !important;
    position: relative !important;
    user-select: none !important;
    white-space: nowrap !important;
    box-sizing: border-box !important;
}

.sfarc-custom-dropdown-option:hover {
    background: var(--sfarc-accent, var(--sfarc-accent, #2196f3)) !important;
    color: #ffffff !important;
}

.sfarc-custom-dropdown-option.sfarc-selected {
    background: rgba(var(--sfarc-accent-rgb, 33, 150, 243), 0.12) !important;
    color: var(--sfarc-accent, #2196f3) !important;
    font-weight: 600 !important;
}

/* The checkmark for selected options */
.sfarc-custom-dropdown-checkmark {
    position: absolute !important;
    left: 8px !important;
    display: none;
    color: var(--sfarc-accent, #2196f3) !important;
    width: 13px !important;
    height: 13px !important;
}

.sfarc-custom-dropdown-option.sfarc-selected .sfarc-custom-dropdown-checkmark {
    display: flex !important;
}

/* ── Search box at the top of the menu ─────────────────────────────────── */
.sfarc-custom-dropdown-search {
    position: relative !important;
    display: flex !important;
    align-items: center !important;
    margin-bottom: 4px !important;
    padding-bottom: 6px !important;
    border-bottom: 1px solid rgba(0, 0, 0, 0.06) !important;
}

.sfarc-custom-dropdown-search-icon {
    position: absolute !important;
    left: 10px !important;
    top: 38% !important;
    transform: translateY(-50%) !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    color: #94a3b8 !important;
    pointer-events: none !important;
    z-index: 2 !important;
}

.sfarc-custom-dropdown-search-input,
input.sfarc-custom-dropdown-search-input,
html body .sfarc-custom-dropdown-search-input {
    width: 100% !important;
    height: 30px !important;
    min-height: 30px !important;
    padding: 0 10px 0 32px !important;
    padding-left: 32px !important;
    border: 1px solid rgba(0, 0, 0, 0.1) !important;
    border-radius: 10px !important;
    background: rgba(255, 255, 255, 0.65) !important;
    backdrop-filter: blur(10px) !important;
    -webkit-backdrop-filter: blur(10px) !important;
    color: #1e293b !important;
    font-size: 12.5px !important;
    font-weight: 400 !important;
    outline: none !important;
    box-shadow: none !important;
    box-sizing: border-box !important;
    transition: border-color 0.15s ease, box-shadow 0.15s ease !important;
}

.sfarc-custom-dropdown-search-input:focus {
    border-color: var(--sfarc-accent, #2196f3) !important;
    box-shadow: 0 0 0 2.5px rgba(2, 132, 199, 0.16) !important;
}

.sfarc-custom-dropdown-search-input::placeholder {
    color: #94a3b8 !important;
}

.sfarc-custom-dropdown-options {
    max-height: 360px;
    overflow-y: auto;
}

.sfarc-custom-dropdown-empty {
    padding: 10px 12px;
    color: #71717a;
    font-size: 12px;
    text-align: center;
}

/* Dark Mode Glassmorphism Overrides — each selector also matches the
   teleported menu carrying the .sfarc-dark-theme class on itself, because
   menus are appended to <body> (outside the themed panel scope). */
.sfarc-dark-theme .sfarc-custom-dropdown-search,
.sfarc-custom-dropdown-menu.sfarc-dark-theme .sfarc-custom-dropdown-search {
    border-bottom-color: rgba(255, 255, 255, 0.1) !important;
}

.sfarc-dark-theme .sfarc-custom-dropdown-search-icon,
.sfarc-custom-dropdown-menu.sfarc-dark-theme .sfarc-custom-dropdown-search-icon {
    color: #9ca3af !important;
}

.sfarc-dark-theme .sfarc-custom-dropdown-search-input,
.sfarc-custom-dropdown-menu.sfarc-dark-theme .sfarc-custom-dropdown-search-input {
    background: rgba(255, 255, 255, 0.08) !important;
    backdrop-filter: blur(10px) !important;
    -webkit-backdrop-filter: blur(10px) !important;
    border-color: rgba(255, 255, 255, 0.14) !important;
    color: #e5e7eb !important;
}

.sfarc-dark-theme .sfarc-custom-dropdown-search-input:focus,
.sfarc-custom-dropdown-menu.sfarc-dark-theme .sfarc-custom-dropdown-search-input:focus {
    border-color: var(--sfarc-accent-glow, #38bdf8) !important;
    box-shadow: 0 0 0 2px rgba(var(--sfarc-accent-glow-rgb, 56, 189, 248), 0.2) !important;
}

.sfarc-dark-theme .sfarc-custom-dropdown-search-input::placeholder,
.sfarc-custom-dropdown-menu.sfarc-dark-theme .sfarc-custom-dropdown-search-input::placeholder {
    color: #8b949e !important;
}

.sfarc-dark-theme .sfarc-custom-dropdown-empty,
.sfarc-custom-dropdown-menu.sfarc-dark-theme .sfarc-custom-dropdown-empty {
    color: #8b949e !important;
}

.sfarc-dark-theme .sfarc-custom-dropdown-trigger {
    background: rgba(30, 41, 59, 0.75) !important;
    backdrop-filter: blur(12px) saturate(180%) !important;
    -webkit-backdrop-filter: blur(12px) saturate(180%) !important;
    border: 1px solid rgba(255, 255, 255, 0.16) !important;
    color: #f1f5f9 !important;
    box-shadow: none !important;
}

.sfarc-dark-theme .sfarc-custom-dropdown-trigger:hover,
.sfarc-dark-theme .sfarc-custom-dropdown-container.sfarc-open .sfarc-custom-dropdown-trigger {
    background: rgba(47, 63, 86, 0.85) !important;
    border-color: var(--sfarc-accent-glow, #38bdf8) !important;
}

.sfarc-dark-theme .sfarc-custom-dropdown-trigger[data-disabled="true"] {
    background: rgba(24, 24, 27, 0.5) !important;
    color: #71717a !important;
}

.sfarc-dark-theme .sfarc-custom-dropdown-menu,
.sfarc-custom-dropdown-menu.sfarc-dark-theme {
    background: rgba(15, 23, 42, 0.84) !important;
    backdrop-filter: blur(20px) saturate(190%) !important;
    -webkit-backdrop-filter: blur(20px) saturate(190%) !important;
    border: 1px solid rgba(255, 255, 255, 0.16) !important;
    box-shadow: 0 20px 48px rgba(0, 0, 0, 0.6), 0 4px 16px rgba(0, 0, 0, 0.3) !important;
}

.sfarc-dark-theme .sfarc-custom-dropdown-option,
.sfarc-custom-dropdown-menu.sfarc-dark-theme .sfarc-custom-dropdown-option {
    color: #cbd5e1 !important;
}

.sfarc-dark-theme .sfarc-custom-dropdown-option:hover,
.sfarc-custom-dropdown-menu.sfarc-dark-theme .sfarc-custom-dropdown-option:hover {
    background: var(--sfarc-accent, var(--sfarc-accent, #2196f3)) !important;
    color: #ffffff !important;
    box-shadow: 0 2px 8px rgba(var(--sfarc-accent-rgb, 33, 150, 243), 0.35) !important;
}

.sfarc-dark-theme .sfarc-custom-dropdown-option.sfarc-selected,
.sfarc-custom-dropdown-menu.sfarc-dark-theme .sfarc-custom-dropdown-option.sfarc-selected {
    background: rgba(14, 165, 233, 0.25) !important;
    color: var(--sfarc-accent-glow, #38bdf8) !important;
}

.sfarc-dark-theme .sfarc-custom-dropdown-option.sfarc-selected:hover,
.sfarc-custom-dropdown-menu.sfarc-dark-theme .sfarc-custom-dropdown-option.sfarc-selected:hover {
    background: var(--sfarc-accent, var(--sfarc-accent, #2196f3)) !important;
    color: #ffffff !important;
    box-shadow: 0 2px 8px rgba(var(--sfarc-accent-rgb, 33, 150, 243), 0.35) !important;
}

.sfarc-dark-theme .sfarc-custom-dropdown-checkmark,
.sfarc-custom-dropdown-menu.sfarc-dark-theme .sfarc-custom-dropdown-checkmark {
    color: var(--sfarc-accent-glow, #38bdf8) !important;
}

  /* Real code-editor trigger overrides */
.sfarc-custom-dropdown-container.form-control .sfarc-custom-dropdown-trigger {
            background: #27272a !important;
            border: 1px solid #3f3f46 !important;
            color: #f4f4f5 !important;
            padding: 5px 8px !important;
            border-radius: 5px !important;
            font-size: 12px !important;
            height: 30px !important;
        }

        body[data-theme="sfarc-light"] .sfarc-custom-dropdown-container.form-control .sfarc-custom-dropdown-trigger {
            background: #ffffff !important;
            border-color: #d8dde6 !important;
            color: #1e293b !important;
        }

        body[data-theme="sfarc-dark"] .sfarc-custom-dropdown-trigger,
        body[data-theme="sfarc-amoled"] .sfarc-custom-dropdown-trigger,
        body[data-theme="dark"] .sfarc-custom-dropdown-trigger {
            background: #161b22 !important;
            background-color: #161b22 !important;
            border-color: #30363d !important;
            color: #f0f6fc !important;
            height: 32px !important;
            min-height: 32px !important;
            border-radius: 8px !important;
        }

        body[data-theme="sfarc-dark"] .sfarc-custom-dropdown-trigger:hover,
        body[data-theme="sfarc-amoled"] .sfarc-custom-dropdown-trigger:hover,
        body[data-theme="dark"] .sfarc-custom-dropdown-trigger:hover,
        body[data-theme="sfarc-dark"] .sfarc-custom-dropdown-container.sfarc-open .sfarc-custom-dropdown-trigger,
        body[data-theme="sfarc-amoled"] .sfarc-custom-dropdown-container.sfarc-open .sfarc-custom-dropdown-trigger,
        body[data-theme="dark"] .sfarc-custom-dropdown-container.sfarc-open .sfarc-custom-dropdown-trigger {
            background: #1c2530 !important;
            border-color: var(--sfarc-accent-glow, #38bdf8) !important;
        }

        
  /* Harness scaffolding */
  body { margin: 0; padding: 28px; font-family: 'Inter', sans-serif; background: #f1f5f9; }
  .card {
    width: 420px; background: #ffffff; border: 1px solid #e2e4e8; border-radius: 12px;
    padding: 18px; box-shadow: 0 24px 60px rgba(15, 23, 42, 0.18);
  }
  .card.dark { background: #1e1e1e; border-color: #3f3f46; }
  .create-field-label {
    display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.4px;
    color: #3f3f46; margin-bottom: 6px; text-transform: uppercase;
  }
  .card.dark .create-field-label { color: #c9c9c9; }
  .row { display: flex; gap: 12px; margin-bottom: 22px; }
  .row .form-group { flex: 1; }
  .measure {
    position: fixed; bottom: 8px; left: 8px; z-index: 999;
    background: rgba(0,0,0,0.8); color: #7ee787; font: 11px/1.6 ui-monospace, monospace;
    padding: 8px 10px; border-radius: 8px; white-space: pre;
  }
  #toggle-dark { margin-bottom: 12px; cursor: pointer; }
</style>
</head>
<body>
  <button id="toggle-dark">Toggle dark theme (data-theme)</button>
  <div class="card" id="card">
    <div class="row">
      <div class="form-group">
        <label class="create-field-label" for="aa">Asset Type</label>
        <div class="sfarc-custom-dropdown-container form-control" id="wrap">
          <div class="sfarc-custom-dropdown-trigger" tabindex="0" role="listbox">
            <span class="sfarc-custom-dropdown-value">Lightning Web Component (LWC)</span>
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </div>
        </div>
      </div>
      <div class="form-group">
        <label class="create-field-label" for="an">Asset Name</label>
        <input type="text" class="form-control" id="an" placeholder="e.g. myAccountViewer" style="height:32px;box-sizing:border-box;border-radius:6px;">
      </div>
    </div>
  </div>
  <div class="measure" id="measure"></div>
<script>
  function measure() {
    const t = document.querySelector('.sfarc-custom-dropdown-trigger');
    const cs = getComputedStyle(t);
    const el = document.getElementById('measure');
    const dark = document.body.getAttribute('data-theme') === 'sfarc-dark';
    el.textContent =
      'trigger box-shadow: ' + cs.boxShadow + '\n' +
      'theme: ' + (dark ? 'DARK' : 'LIGHT') +
      '   background: ' + cs.backgroundColor;
  }
  document.getElementById('toggle-dark').addEventListener('click', () => {
    document.body.setAttribute('data-theme',
      document.body.getAttribute('data-theme') === 'sfarc-dark' ? 'sfarc-light' : 'sfarc-dark');
    measure();
  });
  document.body.setAttribute('data-theme', 'sfarc-light');
  measure();
</script>
</body>
</html>

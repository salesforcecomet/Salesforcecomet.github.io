#sfarc-panel #sfarc-bulk-updater-container .sfarc-bw-abort:hover {
    background: rgba(220, 38, 38, 0.2) !important;
}

#sfarc-panel #sfarc-bulk-updater-container .sfarc-bw-rollback {
    background: rgba(245, 158, 11, 0.12) !important;
    color: #f59e0b !important;
    border: 1px solid rgba(245, 158, 11, 0.4) !important;
    border-radius: 8px !important;
}

#sfarc-panel #sfarc-bulk-updater-container .sfarc-bw-rollback:hover {
    background: rgba(245, 158, 11, 0.2) !important;
}

/* ── Step 2: object permissions ────────────────────────── */
#sfarc-panel #sfarc-bulk-updater-container .sfarc-bw-perms-card {
    overflow-y: auto !important;
    padding: 10px;
    box-sizing: border-box;
}

#sfarc-panel #sfarc-bulk-updater-container .sfarc-bw-section-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--bw-text);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-shrink: 0;
}

#sfarc-panel #sfarc-bulk-updater-container .sfarc-bw-section-title-nowrap {
    white-space: nowrap;
    margin-bottom: 0;
}

#sfarc-panel #sfarc-bulk-updater-container .sfarc-bw-master-panel {
    margin-bottom: 12px;
    padding: 10px 12px;
    border: 1.5px solid var(--bw-accent);
    border-radius: 10px;
    background: rgba(1, 118, 211, 0.07);
}

#sfarc-panel #sfarc-bulk-updater-container .sfarc-bw-master-panel-title {
    font-weight: 700;
    font-size: 12px;
    color: var(--bw-text);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
}

#sfarc-panel #sfarc-bulk-updater-container .sfarc-bw-master-panel-title i {
    color: var(--bw-accent);
    font-size: 11px;
}

#sfarc-panel #sfarc-bulk-updater-container .sfarc-bw-perm-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 16px;
    font-size: 12.5px;
    color: var(--bw-text);
}

#sfarc-panel #sfarc-bulk-updater-container .sfarc-bw-perm-grid label,
#sfarc-panel #sfarc-bulk-updater-container .sfarc-bw-fld-row label,
#sfarc-panel #sfarc-bulk-updater-container .sfarc-bw-rt-row label,
#sfarc-panel #sfarc-bulk-updater-container .sfarc-bw-perm-actions label {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    cursor: pointer;
}

#sfarc-panel #sfarc-bulk-updater-container .sfarc-bw-perm-card {
    margin-bottom: 8px;
    padding: 10px 12px;
    border: 1px solid var(--bw-border);
    border-radius: 9px;
    background: var(--bw-surface);
}

#sfarc-panel #sfarc-bulk-updater-container .sfarc-bw-perm-card-title {
    font-weight: 700;
    font-size: 12.5px;
    font-family: 'Fira Code', 'Consolas', monospace !important;
    color: var(--bw-text);
    margin-bottom: 7px;
}

#sfarc-panel #sfarc-bulk-updater-container .sfarc-bw-rt-head {
    margin-top: 14px;
}

#sfarc-panel #sfarc-bulk-updater-container .sfarc-bw-rt-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 7px 8px;
    border-bottom: 1px solid var(--bw-border);
    transition: background 0.12s ease;
}

#sfarc-panel #sfarc-bulk-updater-container .sfarc-bw-rt-row:last-child {
    border-bottom: none;
}

#sfarc-panel #sfarc-bulk-updater-container .sfarc-bw-rt-row:hover {
    background: var(--bw-hover);
    border-radius: 6px;
}

#sfarc-panel #sfarc-bulk-updater-container .sfarc-bw-rt-name {
    font-weight: 600;
    font-size: 12px;
    color: var(--bw-text);
}

#sfarc-panel #sfarc-bulk-updater-container .sfarc-bw-rt-type {
    font-size: 10.5px;
    font-weight: 400;
    color: var(--bw-muted);
}

/* ── Step 3: fields ────────────────────────────────────── */
#sfarc-panel #sfarc-bulk-updater-container .sfarc-bw-chk {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12.5px;
    color: var(--bw-text);
    cursor: pointer;
    white-space: nowrap;
}

#sfarc-panel #sfarc-bulk-updater-container .sfarc-bw-perm-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

#sfarc-panel #sfarc-bulk-updater-container select.sfarc-bw-action-mode,
#sfarc-panel #sfarc-bulk-updater-container .sfarc-bw-action-mode.sfarc-custom-dropdown-container,
#sfarc-panel #sfarc-bulk-updater-container .sfarc-bw-action-mode.sfarc-custom-dropdown-container .sfarc-custom-dropdown-trigger {
    height: 28px !important;
    min-height: 28px !important;
    border-radius: 7px !important;
    font-size: 12px !important;
    font-weight: 600 !important;
    color: var(--bw-text) !important;
    background-color: var(--bw-field-bg) !important;
    border: 1px solid var(--bw-border) !important;
    padding: 0 24px 0 8px !important;
    cursor: pointer !important;
}

#sfarc-panel #sfarc-bulk-updater-container .sfarc-bw-fld-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 6px 8px;
    border-bottom: 1px solid var(--bw-border);
    border-radius: 6px;
    transition: background 0.12s ease;
}

#sfarc-panel #sfarc-bulk-updater-container .sfarc-bw-fld-row:hover {
    background: var(--bw-hover);
}

#sfarc-panel #sfarc-bulk-updater-container .sfarc-bw-fld-row:last-child {
    border-bottom: none;
}

#sfarc-panel #sfarc-bulk-updater-container .sfarc-bw-fld-name {
    font-weight: 600;
    font-size: 12px;
    font-family: 'Fira Code', 'Consolas', monospace !important;
    color: var(--bw-text);
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

#sfarc-panel #sfarc-bulk-updater-container .sfarc-bw-fld-label {
    font-size: 11px;
    font-weight: 400;
    color: var(--bw-muted);
}

#sfarc-panel #sfarc-bulk-updater-container .sfarc-bw-fld-perms {
    display: flex;
    gap: 12px;
    flex-shrink: 0;
}

/* ── Step 4: verify & execute ──────────────────────────── */
#sfarc-panel #sfarc-bulk-updater-container .sfarc-bw-step-verify {
    align-items: stretch;
}

#sfarc-panel #sfarc-bulk-updater-container .sfarc-bw-verify {
    text-align: center;
    margin: 20px 0 14px;
    padding: 20px;
    border: 1px solid var(--bw-border);
    border-radius: 12px;
    background: var(--bw-card);
    flex-shrink: 0;
}

#sfarc-panel #sfarc-bulk-updater-container .sfarc-bw-verify-icon {
    width: 46px;
    height: 46px;
    margin: 0 auto 10px;
    border-radius: 50%;
    background: rgba(1, 118, 211, 0.12);
    color: var(--bw-accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 19px;
}

#sfarc-panel #sfarc-bulk-updater-container .sfarc-bw-verify-title {
    margin: 0;
    font-size: 16px;
    font-weight: 700;
    color: var(--bw-text);
}

#sfarc-panel #sfarc-bulk-updater-container .sfarc-bw-verify-sub {
    color: var(--bw-muted);
    margin: 8px 0 0;
    font-size: 12px;
    line-height: 1.6;
}

#sfarc-panel #sfarc-bulk-updater-container .sfarc-bw-progress {
    margin: 0 0 14px;
    flex-shrink: 0;
}

#sfarc-panel #sfarc-bulk-updater-container .sfarc-bw-progress-head {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    font-weight: 600;
    color: var(--bw-muted);
    margin-bottom: 5px;
}

#sfarc-panel #sfarc-bulk-updater-container .sfarc-bw-progress-track {
    height: 8px;
    background: var(--bw-surface);
    border: 1px solid var(--bw-border);
    border-radius: 999px;
    overflow: hidden;
}

#sfarc-panel #sfarc-bulk-updater-container .sfarc-bw-progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #0176d3, #38bdf8);
    border-radius: 999px;
    transition: width 0.3s var(--sfarc-ease-out, ease);
}

#sfarc-panel #sfarc-bulk-updater-container .sfarc-bw-results {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    font-size: 11.5px;
    border: 1px solid var(--bw-border);
    border-radius: 10px;
    padding: 10px;
    background: var(--bw-card);
    color: var(--bw-text);
}

/* ─────────────────────────────────────────────────────────
   Apex Code Explorer — coverage bars, line chips, type pills
   ───────────────────────────────────────────────────────── */
.sfarc-cov {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    width: 108px;
}

.sfarc-cov-track {
    flex: 1;
    height: 5px;
    border-radius: 3px;
    background: rgba(100, 116, 139, 0.18);
    overflow: hidden;
}

.sfarc-cov-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.3s ease;
}

.sfarc-cov-fill.high { background: #2e844a; }
.sfarc-dark-theme .sfarc-cov-fill.high { background: #4bca81; }
.sfarc-cov-fill.medium { background: #dd7a01; }
.sfarc-dark-theme .sfarc-cov-fill.medium { background: #ffb75d; }
.sfarc-cov-fill.low { background: #c23934; }
.sfarc-dark-theme .sfarc-cov-fill.low { background: #ff5353; }

.sfarc-cov-pct {
    min-width: 36px;
    text-align: right;
    font-size: 11px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
}

.sfarc-cov-pct.high { color: #2e844a; }
.sfarc-dark-theme .sfarc-cov-pct.high { color: #4bca81; }
.sfarc-cov-pct.medium { color: #dd7a01; }
.sfarc-dark-theme .sfarc-cov-pct.medium { color: #ffb75d; }
.sfarc-cov-pct.low { color: #c23934; }
.sfarc-dark-theme .sfarc-cov-pct.low { color: #ff5353; }

.sfarc-lines-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 1px 8px;
    border-radius: 999px;
    background: rgba(100, 116, 139, 0.12);
    color: var(--sfarc-secondary-text, #64748b);
    font-size: 10.5px;
    font-weight: 600;
    white-space: nowrap;
}

.sfarc-type-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 1px 8px;
    border-radius: 999px;
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.04em;
    white-space: nowrap;
}

.sfarc-type-pill.class {
    background: rgba(2, 132, 199, 0.1);
    color: #0369a1;
    border: 1px solid rgba(2, 132, 199, 0.28);
}

.sfarc-dark-theme .sfarc-type-pill.class {
    background: rgba(56, 189, 248, 0.14);
    color: #38bdf8;
    border: 1px solid rgba(56, 189, 248, 0.3);
}

.sfarc-type-pill.trigger {
    background: rgba(217, 119, 6, 0.1);
    color: #b45309;
    border: 1px solid rgba(217, 119, 6, 0.3);
}

.sfarc-dark-theme .sfarc-type-pill.trigger {
    background: rgba(251, 191, 36, 0.14);
    color: #fbbf24;
    border: 1px solid rgba(251, 191, 36, 0.3);
}

/* LWC explorer — cell text + empty-author placeholder */
.sfarc-cell-text {
    color: var(--sfarc-secondary-text, #64748b);
    white-space: nowrap;
}

.sfarc-cell-muted {
    color: var(--sfarc-secondary-text, #64748b);
    opacity: 0.55;
}

/* ─────────────────────────────────────────────────────────
   Org Info + Org Limits — themed surfaces, tabs, controls
   ───────────────────────────────────────────────────────── */

:root {
    --sfarc-input-bg: #ffffff;
    --sfarc-progress-track: rgba(100, 116, 139, 0.18);
    --sfarc-hover: rgba(100, 116, 139, 0.1);
}

.sfarc-dark-theme,
#sfarc-panel.sfarc-dark-theme {
    --sfarc-input-bg: #22252b !important;
    --sfarc-progress-track: rgba(255, 255, 255, 0.1) !important;
    --sfarc-hover: rgba(148, 163, 184, 0.12) !important;
}

/* Replace the harsh AMOLED-black card surfaces with a proper dark palette */
.sfarc-dark-theme .sfarc-org-header,
.sfarc-dark-theme .sfarc-org-limits-section {
    background: #14171d !important;
    background-color: #14171d !important;
    border-color: #2a303a !important;
}

.sfarc-dark-theme .sfarc-org-item,
.sfarc-dark-theme .sfarc-limit-card {
    background: #1a1e26 !important;
    background-color: #1a1e26 !important;
    border-color: #2a303a !important;
}

/* Info cards */
#sfarc-panel .sfarc-org-item {
    background: var(--sfarc-card-bg, #ffffff);
    border: 1px solid var(--sfarc-border, rgba(0, 0, 0, 0.08));
    border-radius: 8px;
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
    transition: border-color 0.15s ease;
}

#sfarc-panel .sfarc-org-item:hover {
    border-color: var(--primary-color, #0176d3);
}

#sfarc-panel .sfarc-org-label {
    font-size: 9.5px;
    color: var(--sfarc-secondary-text, #8e8e93);
    text-transform: uppercase;
    font-weight: 600;
    letter-spacing: 0.4px;
}

#sfarc-panel .sfarc-org-value {
    font-size: 12px;
    font-weight: 600;
    color: var(--sfarc-text, #1c1c1e);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

#sfarc-panel .sfarc-org-value.mono {
    font-family: 'Fira Code', 'Consolas', monospace !important;
    font-size: 11px;
    letter-spacing: -0.2px;
    background: rgba(100, 116, 139, 0.12);
    padding: 1px 5px;
    border-radius: 4px;
    width: fit-content;
    max-width: 100%;
}

/* Status pill (green dot + label) */
#sfarc-panel .sfarc-status-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 1px 10px;
    border-radius: 999px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    width: fit-content;
    white-space: nowrap;
    background: rgba(100, 116, 139, 0.12);
    color: var(--sfarc-secondary-text, #8e8e93);
    border: 1px solid rgba(100, 116, 139, 0.3);
}

#sfarc-panel .sfarc-status-pill::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
    flex-shrink: 0;
}

#sfarc-panel .sfarc-status-pill.active {
    background: rgba(16, 185, 129, 0.12);
    color: #059669;
    border: 1px solid rgba(16, 185, 129, 0.35);
}

#sfarc-panel.sfarc-dark-theme .sfarc-status-pill.active {
    background: rgba(34, 197, 94, 0.14);
    color: #4ade80;
    border-color: rgba(74, 222, 128, 0.35);
}

#sfarc-panel .sfarc-status-pill.trial {
    background: rgba(245, 158, 11, 0.12);
    color: #d97706;
    border: 1px solid rgba(245, 158, 11, 0.35);
}

#sfarc-panel.sfarc-dark-theme .sfarc-status-pill.trial {
    background: rgba(245, 158, 11, 0.14);
    color: #fbbf24;
    border-color: rgba(251, 191, 36, 0.35);
}

#sfarc-panel .sfarc-status-pill.inactive,
#sfarc-panel .sfarc-status-pill.expired {
    background: rgba(100, 116, 139, 0.12);
    color: var(--sfarc-secondary-text, #8e8e93);
    border: 1px solid rgba(100, 116, 139, 0.3);
}

/* Setup tabs (Company Info / Security Health / System Overview) */
#sfarc-panel .sfarc-org-tabs {
    margin-top: 10px;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
}

#sfarc-panel .sfarc-org-tab {
    padding: 5px 12px;
    border-radius: 6px;
    font-size: 11.5px;
    font-weight: 500;
    color: var(--sfarc-secondary-text, #8e8e93) !important;
    background: transparent;
    border: 1px solid var(--sfarc-border, rgba(0, 0, 0, 0.08));
    text-decoration: none;
    cursor: pointer;
    transition: all 0.15s ease;
    white-space: nowrap;
}

#sfarc-panel .sfarc-org-tab:hover {
    color: var(--sfarc-text, #1c1c1e) !important;
    background: var(--sfarc-hover, rgba(100, 116, 139, 0.1));
}

#sfarc-panel .sfarc-org-tab.active {
    background: var(--primary-color, #0176d3);
    border-color: var(--primary-color, #0176d3);
    color: #ffffff !important;
    font-weight: 600;
}

/* Org limits refresh — matches the global search-bar pill styling */
#sfarc-panel .sfarc-org-refresh {
    height: 26px;
    padding: 0 12px;
    display: flex;
    align-items: center;
    gap: 6px;
    border-radius: 8px !important;
    border: none !important;
    background: rgba(0, 0, 0, 0.05) !important;
    color: var(--sfarc-text, #1c1c1e) !important;
    font-size: 11.5px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s ease;
}

#sfarc-panel.sfarc-dark-theme .sfarc-org-refresh {
    background: rgba(255, 255, 255, 0.08) !important;
    color: var(--sfarc-text, #f5f5f7) !important;
}

#sfarc-panel .sfarc-org-refresh:hover {
    background: rgba(0, 0, 0, 0.08) !important;
}

#sfarc-panel.sfarc-dark-theme .sfarc-org-refresh:hover {
    background: rgba(255, 255, 255, 0.14) !important;
}

/* Limit cards — compact metric tiles */
#sfarc-panel .sfarc-limit-card {
    background: var(--sfarc-card-bg, #ffffff);
    border: 1px solid var(--sfarc-border, rgba(0, 0, 0, 0.08));
    border-radius: 8px;
    padding: 10px;
    flex-direction: column;
    gap: 7px;
    min-width: 0;
}

#sfarc-panel .sfarc-limit-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 6px;
}

#sfarc-panel .sfarc-limit-name {
    font-size: 10.5px;
    font-weight: 600;
    color: var(--sfarc-text, #1c1c1e);
    line-height: 1.25;
    word-break: break-all;
    min-width: 0;
}

#sfarc-panel .sfarc-limit-pct {
    font-size: 10px;
    font-weight: 700;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
}

#sfarc-panel .sfarc-limit-pct.neutral {
    color: var(--sfarc-secondary-text, #8e8e93);
}

#sfarc-panel .sfarc-limit-bar {
    height: 5px;
    background: var(--sfarc-progress-track, rgba(100, 116, 139, 0.18));
    border-radius: 999px;
    overflow: hidden;
}

#sfarc-panel .sfarc-limit-fill {
    height: 100%;
    border-radius: 999px;
    transition: width 0.5s ease-out;
}

#sfarc-panel .sfarc-limit-vals {
    display: flex;
    justify-content: space-between;
    font-size: 9.5px;
    color: var(--sfarc-secondary-text, #8e8e93);
    font-variant-numeric: tabular-nums;
}

/* ─────────────────────────────────────────────────────────
   Object Search — themed empty state + suggestion chips
   ───────────────────────────────────────────────────────── */
#sfarc-panel .sfarc-object-search-empty {
    color: var(--sfarc-secondary-text, #64748b);
}

#sfarc-panel .sfarc-object-search-empty-icon {
    width: 62px;
    height: 62px;
    margin-bottom: 16px;
    border-radius: 18px;
    color: var(--primary-color, #0176d3);
    background: linear-gradient(135deg, rgba(var(--primary-color-rgb, 1, 118, 211), 0.16), rgba(var(--primary-color-rgb, 1, 118, 211), 0.05));
    border: 1px solid rgba(var(--primary-color-rgb, 1, 118, 211), 0.3);
    box-shadow: 0 10px 28px rgba(var(--primary-color-rgb, 1, 118, 211), 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.5);
}

#sfarc-panel.sfarc-dark-theme .sfarc-object-search-empty-icon {
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.07);
    border-color: rgba(var(--primary-color-rgb, 1, 118, 211), 0.35);
}

#sfarc-panel .sfarc-object-search-empty-title {
    color: var(--sfarc-text, #1e293b);
}

#sfarc-panel .sfarc-object-search-empty-copy {
    color: var(--sfarc-secondary-text, #64748b);
}

#sfarc-panel .sfarc-object-search-empty-hint {
    display: inline-flex;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
    gap: 1px;
    margin-top: 16px;
    padding: 5px 12px;
    color: var(--sfarc-secondary-text, #475569);
    background: var(--sfarc-input-bg, #f8fafc);
    border: 1px solid var(--sfarc-border, #e2e8f0);
    border-radius: 999px;
    font-size: 11px;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
}

#sfarc-panel .sfarc-suggest-obj {
    background: none !important;
    border: none !important;
    cursor: pointer;
    font: inherit;
    font-weight: 700 !important;
    color: var(--primary-color, #0176d3) !important;
    padding: 0 3px;
    border-radius: 4px;
    transition: all 0.12s ease;
}

#sfarc-panel .sfarc-suggest-obj:hover {
    background: rgba(var(--primary-color-rgb, 1, 118, 211), 0.12) !important;
    text-decoration: underline;
}

#sfarc-panel .sfarc-suggest-obj:focus-visible {
    outline: 2px solid rgba(var(--primary-color-rgb, 1, 118, 211), 0.5);
    outline-offset: 1px;

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Query tab icon — harness</title>
<style>
  /* ===== Real rules: base from data-export.css, active from styles/sfir.css ===== */
  .query-tabs {
    display: flex;
    align-items: flex-end;
    padding: 4px 6px 0 6px;
    position: relative;
    gap: 3px;
    background: #f8fafc;
    border-bottom: 1px solid #e2e8f0;
  }
  .query-tab {
    padding: 5px 12px;
    cursor: pointer;
    border: 1px solid #cbd5e1;
    border-bottom: none;
    margin-right: 1px;
    margin-bottom: -1px;
    border-radius: 8px 8px 0 0;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    user-select: none;
    background-color: #f1f5f9;
    color: #475569;
    height: 30px;
    box-sizing: border-box;
    font-size: 12.5px;
    font-weight: 500;
    flex-shrink: 0;
  }
  .query-tab-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #0284c7;
    flex-shrink: 0;
  }
  /* NEW FIX */
  .query-tab.active .query-tab-icon {
    color: #ffffff !important;
  }
  /* active tab (sfir.css) */
  .query-tab.active {
    background-color: #0176d3 !important;
    color: #ffffff !important;
    font-weight: 600 !important;
    border: 1px solid #0176d3 !important;
    border-bottom: none !important;
    border-radius: 7px 7px 0 0 !important;
    margin-bottom: -1px !important;
    height: 28px !important;
    z-index: 2 !important;
  }
  .query-tab.active .query-tab-name { color: #ffffff !important; }
  /* dark (sfir.css standalone override) */
  body.sfarc-dark-theme .query-tabs { background: #12141a; border-bottom-color: #26282e; }
  body.sfarc-dark-theme .query-tab { background-color: transparent; border-color: #2a2c32; color: #94a3b8; }
  body.sfarc-dark-theme .query-tab.active {
    background-color: #1a1c21 !important;
    border: 1px solid #3a3d44 !important;
    border-bottom: none !important;
    border-radius: 7px 7px 0 0 !important;
    color: #f8fafc !important;
    height: 28px !important;
  }
  body.sfarc-dark-theme .query-tab.active .query-tab-name { color: #f8fafc !important; }
  body.sfarc-dark-theme .query-tab.active .query-tab-close { color: #94a3b8 !important; }

  /* harness chrome */
  body { font-family: system-ui, sans-serif; background: #f4f6fb; margin: 0; padding: 24px; }
  body.sfarc-dark-theme { background: #0d1117; }
  .toolbar { display: flex; gap: 12px; margin-bottom: 14px; align-items: center; }
  button { border: 1px solid #d8dde6; background: #fff; border-radius: 6px; padding: 5px 12px; cursor: pointer; font-size: 12px; }
  .note { font-size: 12px; color: #64748b; margin-top: 14px; }
</style>
</head>
<body>
<div class="toolbar">
  <button id="themeBtn">Toggle dark theme</button>
  <span class="note">Active tab icon should be WHITE (visible) in both themes; inactive tabs keep the blue icon.</span>
</div>

<div class="query-tabs" id="tabs">
  <div class="query-tab active">
    <span class="query-tab-icon">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
    </span>
    <span class="query-tab-name">Query 3</span>
    <span class="query-tab-close">×</span>
  </div>
  <div class="query-tab">
    <span class="query-tab-icon">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
    </span>
    <span class="query-tab-name">Query 4</span>
    <span class="query-tab-close">×</span>
  </div>
</div>

<script>
document.getElementById('themeBtn').addEventListener('click', () => {
  document.body.classList.toggle('sfarc-dark-theme');
});
</script>
</body>
</html>

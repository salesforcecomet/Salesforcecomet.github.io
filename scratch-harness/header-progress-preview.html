<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; background: #141418; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  body.sfarc-dark-theme .slds-builder-header_container,
  body.sfarc-dark-theme .slds-builder-header.sfir-header-override { background: transparent !important; }
</style>
<style>/* ============================================================================
   Salesforce Comet — Universal Control System
   ----------------------------------------------------------------------------
   One design language for search inputs, selects/dropdowns, icon buttons and
   toggles across every page of the extension, matching the reference UI
   (the header's segmented nav pill proportions):
     • Uniform control height  — 24px
     • Search inputs & selects — 6px radius on light #e8edf2 / #e5e8ed
     • Icon / "+" buttons      — 24x24 with 6px radius on light #e5e8ed
     • Toggles                 — blue (#2563eb) when checked
   Dark-theme variants are provided via tokens so pages using
   body.sfarc-dark-theme / .sfarc-dark-theme stay coherent.

   Load this file LAST in every page so it wins the cascade (the codebase
   relies on !important; equal-specificity rules resolve by load order).

   Top-bar chrome (.sfir-header-select, .sfir-header-icon-btn,
   .sfir-badge-action-btn) is intentionally untouched — the compact header
   keeps its approved size.
   ========================================================================== */

:root {
    --sfarc-ctl-h: 24px;
    --sfarc-ctl-radius-pill: 6px;
    --sfarc-ctl-radius-box: 6px;
    --sfarc-ctl-bg: #e5e8ed;         /* selects, icon buttons */
    --sfarc-ctl-bg-search: #e8edf2;  /* search fields */
    --sfarc-ctl-border: #d8dde6;
    --sfarc-ctl-text: #1e293b;
    --sfarc-ctl-muted: #64748b;
    --sfarc-ctl-primary: #0070d2;
    --sfarc-ctl-primary-hover: #005fb2;
    --sfarc-ctl-toggle-on: #2563eb;
    --sfarc-ctl-toggle-off: #e9e9ea;
    --sfarc-ctl-hover: rgba(0, 0, 0, 0.06);
    --sfarc-ctl-focus-ring: rgba(0, 112, 210, 0.18);
}

/* Dark-theme tokens — includes the Flow Scanner panel, which toggles its own
   #fs-panel.fs-dark-theme class (not .sfarc-dark-theme) for its dark mode. */
body.sfarc-dark-theme,
.sfarc-dark-theme,
#fs-panel.fs-dark-theme {
    --sfarc-ctl-bg: rgba(255, 255, 255, 0.09);
    --sfarc-ctl-bg-search: rgba(255, 255, 255, 0.1);
    --sfarc-ctl-border: rgba(255, 255, 255, 0.16);
    --sfarc-ctl-text: #f1f5f9;
    --sfarc-ctl-muted: #94a3b8;
    --sfarc-ctl-toggle-off: #555555;
    --sfarc-ctl-hover: rgba(255, 255, 255, 0.12);
    --sfarc-ctl-focus-ring: rgba(56, 189, 248, 0.28);
}

/* ── Search inputs ─────────────────────────────────────────────────────── */
.sfarc-debug-search-input,
.sfarc-search-input,
.sfir-search-input-pill,
input[type="text"].sfir-search-pill,
input[type="search"].sfir-search-pill,
.sfir-col-search-input,
.sfarc-field-search-input,
.sfarc-table-filter,
.feed-search,
.sidebar-search-box input,
.viewer-search-wrapper input,
.sfir-history-drawer-search-wrapper input,
.search-box input[type="text"],
.search-box input[type="search"],
.search-bar input[type="text"],
.search-bar input[type="search"],
input[type="text"].input-small,
input[type="search"].input-small,
.sfarc-raycast-search {
    height: var(--sfarc-ctl-h) !important;
    min-height: var(--sfarc-ctl-h) !important;
    border-radius: var(--sfarc-ctl-radius-pill) !important;
    background-color: var(--sfarc-ctl-bg-search) !important;
    border: 1px solid var(--sfarc-ctl-border) !important;
    color: var(--sfarc-ctl-text) !important;
    font-size: 12.5px !important;
    font-weight: 500 !important;
    outline: none !important;
    box-shadow: none !important;
    box-sizing: border-box !important;
}

/* Search containers that draw the pill themselves */
.sfarc-debug-search-wrapper,
.sidebar-search-container,
.sfir-history-drawer-search-wrapper,
.fs-search-wrapper,
.sfarc-search-container,
.viewer-search-wrapper,
.sfarc-local-search-container {
    background: var(--sfarc-ctl-bg-search) !important;
    border: 1px solid var(--sfarc-ctl-border) !important;
    border-radius: var(--sfarc-ctl-radius-pill) !important;
    height: var(--sfarc-ctl-h) !important;
    min-height: var(--sfarc-ctl-h) !important;
    box-sizing: border-box !important;
}

/* Keep inputs inside glassy local-search surfaces transparent */
.sfarc-local-search-container .sfarc-debug-search-input,
.fs-search-wrapper input {
    background-color: transparent !important;
    border-color: transparent !important;
}

/* History-drawer search must sit flush inside its 24px wrapper — older
   sfir.css generations set 26-32px at higher specificity, which made the
   field overflow the pill by a few px. */
.sfir-history-drawer-header input.sfir-history-drawer-search,
.sfir-history-drawer-search-wrapper input.sfir-history-drawer-search {
    height: 24px !important;
    min-height: 24px !important;
    max-height: 24px !important;
    border-radius: 6px !important;
    box-sizing: border-box !important;
}

/* Custom dropdown containers must never paint their own chevron — the trigger
   already renders one, and some pages' native-select arrow-fix rules would
   otherwise show a duplicate chevron through the translucent pill. */
.sfarc-custom-dropdown-container,
html body .sfarc-custom-dropdown-container,
body.sfarc-dark-theme .sfarc-custom-dropdown-container,
.sfarc-dark-theme .sfarc-custom-dropdown-container {
    background-image: none !important;
    padding-right: 0 !important;
}

/* Search focus — lift the pill to white + soft blue ring */
.sfarc-debug-search-input:focus,
.sfarc-search-input:focus,
.sfir-search-input-pill:focus,
input[type="text"].sfir-search-pill:focus,
input[type="search"].sfir-search-pill:focus,
.sfir-col-search-input:focus,
.sfarc-field-search-input:focus,
.sfarc-table-filter:focus,
.feed-search:focus,
.sidebar-search-box input:focus,
.viewer-search-wrapper input:focus,
.sfir-history-drawer-search-wrapper input:focus,
.search-box input[type="text"]:focus,
.search-box input[type="search"]:focus,
.search-bar input[type="text"]:focus,
.search-bar input[type="search"]:focus,
.sfarc-raycast-search:focus {
    background-color: var(--sfarc-ctl-bg-search) !important;
    border-color: var(--sfarc-ctl-primary) !important;
    box-shadow: 0 0 0 3px var(--sfarc-ctl-focus-ring) !important;
    outline: none !important;
}

/* ── Selects / dropdowns ───────────────────────────────────────────────── */
.sfarc-debug-select,
.sfarc-custom-dropdown-trigger,
.sub-select,
.object-select,
.sfir-select,
.sfarc-table-rows-select,
.feed-select,
.dropdown-small,
.sfarc-builder-select,
#sfarc-builder-object-select {
    height: var(--sfarc-ctl-h) !important;
    min-height: var(--sfarc-ctl-h) !important;
    border-radius: var(--sfarc-ctl-radius-pill) !important;
    background-color: var(--sfarc-ctl-bg) !important;
    border: 1px solid var(--sfarc-ctl-border) !important;
    color: var(--sfarc-ctl-text) !important;
    font-size: 12.5px !important;
    font-weight: 500 !important;
    outline: none !important;
    box-sizing: border-box !important;
    transition: background-color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease !important;
}

.sfarc-debug-select:hover,
.sfarc-custom-dropdown-trigger:hover,
.sub-select:hover,
.object-select:hover,
.sfir-select:hover {
    background-color: var(--sfarc-ctl-hover) !important;
}

.sfarc-debug-select:focus,
.sub-select:focus,
.object-select:focus,
.sfir-select:focus {
    border-color: var(--sfarc-ctl-primary) !important;
    box-shadow: 0 0 0 3px var(--sfarc-ctl-focus-ring) !important;
    outline: none !important;
}

/* ── Icon buttons (incl. "+" add buttons) ──────────────────────────────── */
.sfarc-debug-icon-btn,
.sfarc-dropdown-plus-btn,
.sfarc-action-icon,
.sfarc-icon-btn,
.icon-btn:not(.icon-btn-small):not(.icon-btn-save),
.viewer-btn.icon-btn,
.search-action-btn {
    width: var(--sfarc-ctl-h) !important;
    height: var(--sfarc-ctl-h) !important;
    min-width: var(--sfarc-ctl-h) !important;
    min-height: var(--sfarc-ctl-h) !important;
    max-width: var(--sfarc-ctl-h) !important;
    max-height: var(--sfarc-ctl-h) !important;
    flex: 0 0 var(--sfarc-ctl-h) !important;
    border-radius: var(--sfarc-ctl-radius-box) !important;
    background-color: var(--sfarc-ctl-bg) !important;
    border: 1px solid var(--sfarc-ctl-border) !important;
    color: var(--sfarc-ctl-text) !important;
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    padding: 0 !important;
    box-sizing: border-box !important;
    transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease, transform 0.12s cubic-bezier(0.16, 1, 0.3, 1) !important;
}

.sfarc-debug-icon-btn:hover,
.sfarc-dropdown-plus-btn:hover,
.sfarc-action-icon:hover,
.sfarc-icon-btn:hover,
.icon-btn:not(.icon-btn-small):not(.icon-btn-save):hover,
.viewer-btn.icon-btn:hover,
.search-action-btn:hover {
    background-color: var(--sfarc-ctl-hover) !important;
}

.sfarc-debug-icon-btn:active,
.sfarc-dropdown-plus-btn:active,
.sfarc-action-icon:active,
.sfarc-icon-btn:active,
.icon-btn:not(.icon-btn-small):not(.icon-btn-save):active,
.viewer-btn.icon-btn:active,
.search-action-btn:active {
    transform: scale(0.92) !important;
}

/* Icon buttons on the data pages (.sfarc-btn-icon) — same universal size
   and radius, but keep each page's own surface/colors. Exclude buttons that
   carry a text label too (.sfarc-btn-icon-label): those must keep width:auto
   so their label never overflows/overlaps the next button. Without this
   guard, the !important width below would crush e.g. the Data Import
   Resume/Retry/Hide-config buttons to a 24px square while their labels stay
   visible. */
.sfarc-btn-icon:not(.sfarc-btn-icon-label) {
    width: var(--sfarc-ctl-h) !important;
    height: var(--sfarc-ctl-h) !important;
    min-width: var(--sfarc-ctl-h) !important;
    min-height: var(--sfarc-ctl-h) !important;
    max-width: var(--sfarc-ctl-h) !important;
    max-height: var(--sfarc-ctl-h) !important;
    flex: 0 0 var(--sfarc-ctl-h) !important;
    border-radius: var(--sfarc-ctl-radius-box) !important;
    box-sizing: border-box !important;
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    padding: 0 !important;
}

/* Run buttons that predate the universal system — geometry only, page
   colors kept. */
.run-btn {
    height: var(--sfarc-ctl-h) !important;
    min-height: var(--sfarc-ctl-h) !important;
    border-radius: var(--sfarc-ctl-radius-pill) !important;
    box-sizing: border-box !important;
}

/* ── Primary / action buttons ──────────────────────────────────────────── */
.sfarc-debug-btn.primary,
.sfarc-btn-primary,
.sfir-btn-primary,
.sfarc-primary-btn {
    height: var(--sfarc-ctl-h) !important;
    min-height: var(--sfarc-ctl-h) !important;
    border-radius: var(--sfarc-ctl-radius-pill) !important;
    background-color: var(--sfarc-ctl-primary) !important;
    border: 1px solid var(--sfarc-ctl-primary) !important;
    color: #ffffff !important;
    font-size: 12px !important;
    font-weight: 600 !important;
    padding: 0 14px !important;
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    box-sizing: border-box !important;
}

.sfarc-debug-btn.primary:hover,
.sfarc-btn-primary:hover,
.sfir-btn-primary:hover,
.sfarc-primary-btn:hover {
    background-color: var(--sfarc-ctl-primary-hover) !important;
    border-color: var(--sfarc-ctl-primary-hover) !important;
}

/* Secondary .sfarc-debug-btn — same pill height, light surface */
.sfarc-debug-btn {
    height: var(--sfarc-ctl-h) !important;
    min-height: var(--sfarc-ctl-h) !important;
    border-radius: var(--sfarc-ctl-radius-pill) !important;
    box-sizing: border-box !important;
}

/* Generic .sfarc-btn (data pages) — universal height, keep page colors.
   Icon-only buttons keep their own padding (they size to the icon, so the
   12px side padding here would crush the SVG inside a 30px square). */
.sfarc-btn:not(.sfarc-btn-icon) {
    height: var(--sfarc-ctl-h) !important;
    min-height: var(--sfarc-ctl-h) !important;
    padding: 0 12px !important;
    font-size: 12px !important;
}

/* ── Toggles — iOS green when checked ──────────────────────────────────── */
.sfarc-slider,
.sfir-header-toggle-switch {
    background-color: var(--sfarc-ctl-toggle-off) !important;
}

.sfarc-switch input:checked + .sfarc-slider,
.sfarc-toggle-switch input:checked + .sfarc-slider,
input:checked + .sfir-header-toggle-switch,
#sfarc-header-icons-toggle.active .sfarc-apple-switch {
    background-color: var(--sfarc-ctl-toggle-on) !important;
    border-color: var(--sfarc-ctl-toggle-on) !important;
}

/* Dark theme: checked state must beat the dark OFF overrides */
body.sfarc-dark-theme .sfarc-switch input:checked + .sfarc-slider,
body.sfarc-dark-theme .sfarc-toggle-switch input:checked + .sfarc-slider,
body.sfarc-dark-theme .sfir-header-toggle-container input[type="checkbox"]:checked + .sfir-header-toggle-switch {
    background-color: var(--sfarc-ctl-toggle-on) !important;
    border-color: var(--sfarc-ctl-toggle-on) !important;
}

/* Toggle geometry — one size across the whole extension: the header toggle
   spec (36x20 pill, 16px knob, 16px travel). This normalizes the older
   inspector .sfarc-slider toggles so every toggle looks identical. */
.sfarc-switch,
.sfarc-toggle-switch {
    width: 36px !important;
    height: 20px !important;
    flex: 0 0 36px !important;
}

.sfarc-switch .sfarc-slider,
.sfarc-toggle-switch .sfarc-slider {
    border-radius: 9999px !important;
}

.sfarc-switch .sfarc-slider:before,
.sfarc-toggle-switch .sfarc-slider:before {
    top: 2px !important;
    left: 2px !important;
    bottom: auto !important;
    right: auto !important;
    width: 16px !important;
    height: 16px !important;
}

.sfarc-switch input:checked + .sfarc-slider:before,
.sfarc-toggle-switch input:checked + .sfarc-slider:before {
    transform: translateX(16px) !important;
}

/* ── Unified Comet Loader (replaces all custom spinners/loaders) ── */
.comet-loader {
    width: 50px;
    aspect-ratio: 1;
    display: grid;
    border-radius: 50%;
    background:
        linear-gradient(0deg, rgb(0 0 0/50%) 30%, #0000 0 70%, rgb(0 0 0/100%) 0) 50%/8% 100%,
        linear-gradient(90deg, rgb(0 0 0/25%) 30%, #0000 0 70%, rgb(0 0 0/75%) 0) 50%/100% 8%;
    background-repeat: no-repeat;
    animation: comet-loader-spin 1s infinite steps(12);
}
.comet-loader::before,
.comet-loader::after {
    content: "";
    grid-area: 1/1;
    border-radius: 50%;
    background: inherit;
    opacity: 0.915;
    transform: rotate(30deg);
}
.comet-loader::after {
    opacity: 0.83;
    transform: rotate(60deg);
}
@keyframes comet-loader-spin {
    100% { transform: rotate(1turn); }
}

.comet-loader-inline {
    width: 14px;
    aspect-ratio: 1;
    display: inline-grid;
    border-radius: 50%;
    vertical-align: -2px;
    margin-right: 6px;
    background:
        linear-gradient(0deg, rgb(0 0 0/50%) 30%, #0000 0 70%, rgb(0 0 0/100%) 0) 50%/8% 100%,
        linear-gradient(90deg, rgb(0 0 0/25%) 30%, #0000 0 70%, rgb(0 0 0/75%) 0) 50%/100% 8%;
    background-repeat: no-repeat;
    animation: comet-loader-spin 1s infinite steps(12);
}
.comet-loader-inline::before,
.comet-loader-inline::after {
    content: "";
    grid-area: 1/1;
    border-radius: 50%;
    background: inherit;
    opacity: 0.915;
    transform: rotate(30deg);
}
.comet-loader-inline::after {
    opacity: 0.83;
    transform: rotate(60deg);
}

body.sfarc-dark-theme .comet-loader,
body.sfarc-dark-theme .comet-loader-inline,
.sfarc-dark-theme .comet-loader,
.sfarc-dark-theme .comet-loader-inline {
    filter: invert(1);
}
</style>
<style>:root {
    --sfir-custom-color: var(--slds-g-color-surface-inverse-1, var(--slds-g-color-brand-base-20));
    /* Code font: prefer JetBrains Mono when the webfont loads, then the best
       system mono on each OS (macOS SF Mono/Menlo, Windows Cascadia/Consolas,
       Linux Liberation) so query writers never fall back to Courier-like text. */
    --sfir-mono-font: 'JetBrains Mono', 'Cascadia Code', 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace;
}

.sfir-display-popover-target,
.slds-popover,
.slds-tooltip {
    visibility: hidden;
    z-index: 2147483647 !important;
    position: absolute !important;
}

.sfir-display-popover-trigger {
    cursor: pointer;
    position: relative !important;
    overflow: visible !important;
}

.sfir-display-popover-trigger:hover .sfir-display-popover-target,
.sfir-display-popover-trigger:focus .sfir-display-popover-target,
.sfir-display-popover-trigger:focus-within .sfir-display-popover-target {
    visibility: visible !important;
    opacity: 1 !important;
    z-index: 2147483647 !important;
}

/* ── Glassmorphism for every tooltip/popover family ────────────────────
   One frosted surface + one border per theme, shared by all tooltip
   surfaces: SLDS tooltips/popovers (Tooltip component, avatar popover,
   color picker), the custom tooltip renderer, and the header tooltip
   boxes. The nubbin carets inherit the same border/background colors so
   the arrow always matches the box. */
.slds-tooltip,
.slds-popover,
.slds-popover_tooltip,
.sfir-display-popover-target.slds-popover {
    background: rgba(255, 255, 255, 0.82) !important;
    backdrop-filter: blur(20px) saturate(200%) !important;
    -webkit-backdrop-filter: blur(20px) saturate(200%) !important;
    border: 1px solid rgba(15, 23, 42, 0.14) !important;
    border-radius: 12px !important;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9), 0 16px 40px rgba(15, 23, 42, 0.18), 0 4px 12px rgba(15, 23, 42, 0.08) !important;
    color: #0f172a !important;
}

.slds-nubbin_bottom-left::before,
.slds-nubbin_top-right::before,
.slds-nubbin_bottom::before,
.slds-nubbin_top::before,
.slds-nubbin_bottom-left::after,
.slds-nubbin_top-right::after,
.slds-nubbin_bottom::after,
.slds-nubbin_top::after {
    backdrop-filter: blur(20px) !important;
    -webkit-backdrop-filter: blur(20px) !important;
}

.slds-nubbin_bottom-left::before,
.slds-nubbin_top-right::before,
.slds-nubbin_bottom::before,
.slds-nubbin_top::before {
    background: rgba(15, 23, 42, 0.14) !important;
}

.slds-nubbin_bottom-left::after,
.slds-nubbin_top-right::after,
.slds-nubbin_bottom::after,
.slds-nubbin_top::after {
    background: rgba(255, 255, 255, 0.82) !important;
}

body.sfarc-dark-theme .slds-tooltip,
body.sfarc-dark-theme .slds-popover,
body.sfarc-dark-theme .slds-popover_tooltip,
body.sfarc-dark-theme .sfir-display-popover-target.slds-popover {
    background: rgba(15, 23, 42, 0.78) !important;
    border: 1px solid rgba(255, 255, 255, 0.18) !important;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1), 0 16px 40px rgba(0, 0, 0, 0.5), 0 4px 12px rgba(0, 0, 0, 0.3) !important;
    color: #f8fafc !important;
}

body.sfarc-dark-theme .slds-nubbin_bottom-left::before,
body.sfarc-dark-theme .slds-nubbin_top-right::before,
body.sfarc-dark-theme .slds-nubbin_bottom::before,
body.sfarc-dark-theme .slds-nubbin_top::before {
    background: rgba(255, 255, 255, 0.18) !important;
}

body.sfarc-dark-theme .slds-nubbin_bottom-left::after,
body.sfarc-dark-theme .slds-nubbin_top-right::after,
body.sfarc-dark-theme .slds-nubbin_bottom::after,
body.sfarc-dark-theme .slds-nubbin_top::after {
    background: rgba(15, 23, 42, 0.78) !important;
}

.slds-builder-header.sfir-header-override {
    background-color: transparent !important;
    background: transparent !important;
}

/* ── Global top progress bar (shared across every page) ──────────────── */
/* A slim accent fill glued under the header + a compact glass pill with
   label / percent / counts. Published via chrome.storage.local by whichever
   page runs the operation, rendered here on all pages. */
.sfir-top-progress {
    position: fixed !important;
    top: 48px !important;
    left: 0 !important;
    right: 0 !important;
    height: 3px !important;
    z-index: 2147483646 !important;
    display: none !important;
    pointer-events: none !important;
}

/* Mounted inside the shared header's utility slot: the pill becomes a real
   in-flow element of the top bar instead of a fixed overlay. The container
   shrinks to the pill's own box; hover/pause still expands the island, which
   drops below the header like a Dynamic-Island card. */
.sfir-top-progress.in-header {
    position: relative !important;
    top: auto !important;
    left: auto !important;
    right: auto !important;
    height: auto !important;
    z-index: auto !important;
    display: none !important;
    pointer-events: auto !important;
    flex-shrink: 0 !important;
}

.sfir-top-progress.in-header.active {
    display: block !important;
}

.sfir-top-progress.in-header .sfir-top-progress-pill {
    position: relative !important;
    top: auto !important;
    right: auto !important;
    z-index: 2147483646 !important;
}

.sfir-top-progress.in-header .sfir-top-progress-ring {
    position: absolute !important;
    top: 50% !important;
    right: auto !important;
    left: 50% !important;
    transform: translate(-50%, -50%) !important;
    z-index: 2147483645 !important;
}

.sfir-top-progress.active {
    display: block !important;
}

/* The 3px blue line is intentionally hidden — the floating status pill
   carries all the progress info. */
.sfir-top-progress-fill {
    display: none !important;
}

.sfir-top-progress .sfir-top-progress-fill {
    height: 100% !important;
    width: 0% !important;
    background: linear-gradient(90deg, #0176d3, #38bdf8) !important;
    box-shadow: 0 0 10px rgba(1, 118, 211, 0.55) !important;
    transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1) !important;
}

/* Live indeterminate flow while the operation is running but nothing is
   done yet (e.g. the first batches are still in flight) — the bar never
   looks frozen at 0%. */
.sfir-top-progress.running-zero .sfir-top-progress-fill {
    width: 100% !important;
    background: linear-gradient(90deg, #0176d3 0%, #38bdf8 45%, #0176d3 90%) !important;
    background-size: 200% 100% !important;
    animation: sfirTopProgressFlow 1.4s linear infinite !important;
    box-shadow: 0 0 12px rgba(1, 118, 211, 0.6) !important;
    transition: none !important;
}

@keyframes sfirTopProgressFlow {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
}

.sfir-top-progress.paused .sfir-top-progress-fill {
    background: linear-gradient(90deg, #64748b, #94a3b8) !important;
    box-shadow: none !important;
    opacity: 0.6 !important;
}

/* Apple Dynamic Island / Live-Activity style: a compact black pill at rest
   that grows into a tall media-player-style card on hover (or when paused) —
   thumbnail, title + subtitle, animated wave, progress bar and queue chips.
   Always dark glass, regardless of page theme. */
.sfir-top-progress-pill {
    position: fixed !important;
    top: 9px !important;
    right: 12px !important;
    display: none !important;
    align-items: center !important;
    justify-content: center !important;
    width: 96px !important;
    height: 32px !important;
    max-width: none !important;
    border-radius: 999px !important;
    background: linear-gradient(135deg, rgba(17, 20, 26, 0.92), rgba(10, 13, 18, 0.82)) !important;
    backdrop-filter: blur(28px) saturate(200%) !important;
    -webkit-backdrop-filter: blur(28px) saturate(200%) !important;
    border: 1px solid rgba(255, 255, 255, 0.18) !important;
    box-shadow: 0 10px 34px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.14), 0 0 0 1px rgba(0, 0, 0, 0.25) !important;
    font-size: 11.5px !important;
    color: #f8fafc !important;
    cursor: pointer !important;
    pointer-events: auto !important;
    white-space: nowrap !important;
    z-index: 2147483646 !important;
    overflow: hidden !important;
    transition: width 0.55s cubic-bezier(0.32, 0.72, 0, 1), height 0.55s cubic-bezier(0.32, 0.72, 0, 1), border-radius 0.5s cubic-bezier(0.32, 0.72, 0, 1), box-shadow 0.5s ease !important;
}

.sfir-top-progress-pill.show {
    display: flex !important;
}

/* Outer boundary progress ring — a hairline conic arc that hugs the pill and
   fills to the current percent. It sits just outside the pill (same anchor,
   slightly larger) and morphs with it on hover/pause. */
.sfir-top-progress-ring {
    position: fixed !important;
    top: 6px !important;
    right: 9px !important;
    width: 102px !important;
    height: 38px !important;
    border-radius: 999px !important;
    pointer-events: none !important;
    z-index: 2147483645 !important;
    display: none !important;
    box-sizing: border-box !important;
    padding: 2.5px !important;
    background: conic-gradient(from 0deg,
        #38bdf8 calc(var(--sfir-ring-pct, 0) * 1%),
        rgba(148, 163, 184, 0.28) 0) !important;
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0) !important;
    -webkit-mask-composite: xor !important;
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0) !important;
    mask-composite: exclude !important;
    transition: width 0.55s cubic-bezier(0.32, 0.72, 0, 1), height 0.55s cubic-bezier(0.32, 0.72, 0, 1), border-radius 0.5s cubic-bezier(0.32, 0.72, 0, 1) !important;
}

.sfir-top-progress.active .sfir-top-progress-ring {
    display: block !important;
}

.sfir-top-progress.paused .sfir-top-progress-ring {
    background: conic-gradient(from 0deg,
        #94a3b8 calc(var(--sfir-ring-pct, 0) * 1%),
        rgba(148, 163, 184, 0.18) 0) !important;
}

.sfir-top-progress-pill:hover ~ .sfir-top-progress-ring,
.sfir-top-progress.paused .sfir-top-progress-ring {
    width: 306px !important;
    height: 208px !important;
    border-radius: 16px !important;
}

/* Collapsed content: live dot + percent. */
.sfir-island-rest {
    display: inline-flex !important;
    align-items: center !important;
    gap: 8px !important;
}

/* Expanded content — hidden at rest. */
.sfir-island-body {
    display: none !important;
    flex-direction: column !important;
    width: 100% !important;
    height: 100% !important;
    padding: 14px 14px 12px !important;

}

/* Hover (or paused) → grow into the tall live-activity card. */
.sfir-top-progress-pill:hover,
.sfir-top-progress.paused .sfir-top-progress-pill {
    width: 300px !important;
    height: 202px !important;
    border-radius: 14px !important;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.16), 0 0 0 1px rgba(0, 0, 0, 0.3) !important;
}

/* In-header expansion: pop the card out of the header flow and drop it below
   the bar (like a Dynamic Island) instead of growing the header's own height. */
.sfir-top-progress.in-header .sfir-top-progress-pill:hover,
.sfir-top-progress.in-header.paused .sfir-top-progress-pill {
    position: absolute !important;
    top: calc(100% + 10px) !important;
    left: 50% !important;
    right: auto !important;
    transform: translateX(-50%) !important;
    width: 300px !important;
    height: 202px !important;
    border-radius: 14px !important;
}

.sfir-top-progress.in-header .sfir-top-progress-pill:hover ~ .sfir-top-progress-ring,
.sfir-top-progress.in-header.paused .sfir-top-progress-ring {
    position: absolute !important;

/* Apple Dynamic Island Wrapper & Fluid Animation Physics */
.sfir-dynamic-island-wrapper {
    position: relative !important;
    background: #f8fbff !important;
    border: 1px solid #cbd5e1 !important;
    box-shadow: none !important;
    transition: max-height 0.6s cubic-bezier(0.22, 1, 0.36, 1),
        max-width 0.6s cubic-bezier(0.22, 1, 0.36, 1),
        border-radius 0.55s cubic-bezier(0.22, 1, 0.36, 1),
        background-color 0.35s ease,
        transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1),
        box-shadow 0.45s ease !important;
    will-change: max-height, max-width, border-radius, transform !important;
    overflow: hidden !important;
    box-sizing: border-box !important;
    display: flex !important;
    flex-direction: column !important;
    margin: 0 auto !important;
}

    min-height: 32px !important;

    /* Transform-only motion (translateX + scaleX): stays on the compositor,
       no per-frame layout. Ease-out — fast start, long smooth settle. */
    transform-origin: left center !important;
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1) !important;
    will-change: transform;
    pointer-events: none !important;
    z-index: 0 !important;
}

   animate from the CSS default (left edge) — the resting position is committed

/* Cross-page slide-in: the pill animates from the previously-active tab's
   position/size (set as --sfir-nav-from-* on the element by theme-manager.js).

   the slide runs on the compositor with no jitter. */

    from {
        transform: translateX(var(--sfir-nav-from-x, 0px)) scaleX(var(--sfir-nav-from-s, 1));

    to {

}

/* Save Query Modal Dialog & Overlays */
.sfir-modal-overlay,
.sfarc-modal-overlay,
.sfir-confirm-modal-overlay,
.modal-overlay {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    right: 0 !important;
    bottom: 0 !important;
    background: rgba(0, 0, 0, 0.65) !important;
    backdrop-filter: none !important;
    -webkit-backdrop-filter: none !important;
    z-index: 1000000 !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    animation: sfirFadeIn 0.2s ease !important;
}

.sfir-modal-overlay.is-genie-minimizing {
    animation: sfirGenieFadeOut 0.45s ease forwards !important;
    pointer-events: none !important;
}

.sfir-save-query-modal.is-genie-minimizing {
    transform-origin: bottom left !important;
    animation: sfirGenieWarp 0.45s cubic-bezier(0.55, 0.055, 0.675, 0.19) forwards !important;
    pointer-events: none !important;
}

@keyframes sfirGenieWarp {
    0% {
        transform: translate(0, 0) scale(1) rotate(0deg);
        opacity: 1;
        border-radius: 16px;
    }

    30% {
        transform: translate(-15vw, 16vh) scale(0.65, 0.8) rotate(-3deg);
        opacity: 0.95;
        border-radius: 20px;
        filter: blur(0.5px);
    }

    65% {
        transform: translate(-32vw, 34vh) scale(0.25, 0.4) rotate(-7deg);
        opacity: 0.7;
        border-radius: 28px;
        filter: blur(1px);
    }

    100% {
        transform: translate(-44vw, 46vh) scale(0.02, 0.04) rotate(-10deg);
        opacity: 0;
        border-radius: 40px;
        filter: blur(2px);
    }
}

@keyframes sfirGenieFadeOut {
    0% {
        opacity: 1;
    }

    100% {
        opacity: 0;
    }
}

.sfir-history-drawer-btn.genie-pulse {
    animation: sfirGenieBtnPulse 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) !important;
}

@keyframes sfirGenieBtnPulse {
    0% {
        transform: scale(1);
    }

    35% {
        transform: scale(1.3) translateY(-4px);
        background-color: #0176d3 !important;
        border-color: #0176d3 !important;
        color: #ffffff !important;
        box-shadow: 0 0 20px rgba(1, 118, 211, 0.85) !important;
    }

    100% {
        transform: scale(1);
    }
}

/* ════════════════════════════════════════════════════════════════════
   HISTORY DROPDOWN — full redesign (animated, glass, micro-interactions)
   ════════════════════════════════════════════════════════════════════ */
.sfir-history-drawer {
    background: rgba(255, 255, 255, 0.94) !important;
    backdrop-filter: blur(18px) saturate(140%) !important;
    -webkit-backdrop-filter: blur(18px) saturate(140%) !important;
    border: 1px solid rgba(15, 23, 42, 0.1) !important;
    border-radius: 16px !important;
    box-shadow: 0 24px 64px rgba(15, 23, 42, 0.22), 0 6px 20px rgba(15, 23, 42, 0.12) !important;
    animation: sfirDropIn 0.24s cubic-bezier(0.16, 1, 0.3, 1) !important;
}

/* Header */
.sfir-history-drawer-header {
    padding: 8px 12px !important;
    gap: 10px !important;
    background: transparent !important;
    border-bottom: 1px solid rgba(15, 23, 42, 0.08) !important;
    animation: sfirHeaderIn 0.28s cubic-bezier(0.16, 1, 0.3, 1) both !important;
}

/* Segmented control with sliding animated indicator */
.sfir-history-drawer-segmented-control {
    position: relative !important;
    display: flex !important;
    align-items: center !important;
    padding: 2px !important;
    background-color: rgba(15, 23, 42, 0.06) !important;
    border: 1px solid rgba(15, 23, 42, 0.09) !important;
    border-radius: 999px !important;
    box-sizing: border-box !important;
    flex-shrink: 0 !important;
    gap: 0 !important;
}

.sfir-history-seg-indicator {
    position: absolute !important;
    top: 2px !important;
    bottom: 2px !important;
    left: 2px !important;
    width: calc(50% - 2px) !important;
    border-radius: 999px !important;
    background: linear-gradient(135deg, #0176d3 0%, #0284c7 100%) !important;
    box-shadow: 0 2px 10px rgba(1, 118, 211, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.25) !important;
    transition: transform 0.32s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
    pointer-events: none !important;
}

.sfir-history-seg-indicator.right {

}

.sfir-history-drawer-segmented-control .sfir-segmented-tab {

.sfir-history-drawer-segmented-control .sfir-segmented-tab:hover {

}

.sfir-history-drawer-segmented-control .sfir-segmented-tab.active {

    background: transparent !important;

/* Search */
.sfir-history-drawer-search-wrapper {
    position: relative !important;

}

.sfir-history-drawer-search-icon {

.sfir-history-drawer-header input.sfir-history-drawer-search {

}

input.sfir-history-drawer-search::placeholder {
    color: #94a3b8 !important;

}

/* Actions */
.sfir-history-drawer-actions {
    display: flex !important;
    align-items: center !important;
    gap: 8px !important;
    flex-shrink: 0 !important;
}

.sfir-history-drawer-clear-btn {
    position: relative !important;
    overflow: hidden !important;
    display: inline-flex !important;
    align-items: center !important;
    height: 26px !important;
    padding: 0 10px !important;
    font-size: 11px !important;
    font-weight: 600 !important;
    color: #dc2626 !important;
    background-color: rgba(239, 68, 68, 0.06) !important;
    border: 1px solid rgba(239, 68, 68, 0.3) !important;

.sfir-history-drawer-clear-btn::after {

    position: absolute !important;

    background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%) !important;

}

.sfir-history-drawer-clear-btn:hover::after {

}

.sfir-history-drawer-clear-btn:hover {
    color: #ffffff !important;
    border-color: #dc2626 !important;
    transform: translateY(-1px) !important;

}

.sfir-history-drawer-clear-btn svg {
    position: relative !important;
    z-index: 1 !important;
    stroke: currentColor !important;
    fill: none !important;
    transition: transform 0.2s ease !important;
}

.sfir-history-drawer-clear-btn:hover svg {

}

.sfir-history-drawer-close-btn {
    width: 26px !important;
    height: 26px !important;
    min-width: 26px !important;
    min-height: 26px !important;
    background: rgba(15, 23, 42, 0.05) !important;
    border: 1px solid rgba(15, 23, 42, 0.12) !important;

}

.sfir-history-drawer-close-btn:hover {

/* Body */
.sfir-history-drawer-body {
    flex: 1 !important;

    overflow-y: auto !important;
    padding: 12px 14px !important;
    display: flex !important;

    gap: 8px !important;
}

.sfir-history-drawer-body::-webkit-scrollbar {
    width: 6px !important;
}

.sfir-history-drawer-body::-webkit-scrollbar-thumb {

}

/* Items — staggered entrance */
.sfir-history-item {

.sfir-history-item:hover {

.sfir-history-item-actions {

    flex-shrink: 0 !important;
}

}

.sfir-history-item-load-btn {
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;

    min-height: 28px !important;

    font-size: 11.5px !important;
    font-weight: 600 !important;

    cursor: pointer !important;
    transition: all 0.2s ease !important;

}

.sfir-history-item-load-btn:hover {
    background-color: #0176d3 !important;

    box-shadow: 0 4px 12px rgba(1, 118, 211, 0.35) !important;
}

.sfir-history-item-delete-btn {
    width: 28px !important;
    height: 28px !important;
    min-width: 28px !important;
    min-height: 28px !important;
    max-width: 28px !important;
    max-height: 28px !important;
    padding: 0 !important;
    background-color: transparent !important;
    color: #64748b !important;
    border: 1px solid rgba(15, 23, 42, 0.14) !important;
    border-radius: 9px !important;

    display: inline-flex !important;

    justify-content: center !important;

}

.sfir-history-item-delete-btn svg {
    stroke: currentColor !important;
    fill: none !important;
}

.sfir-history-item-delete-btn:hover {
    background-color: rgba(239, 68, 68, 0.1) !important;
    color: #ef4444 !important;
    border-color: #ef4444 !important;
    animation: sfirShake 0.35s ease !important;
}

/* Empty state */
.sfir-history-empty-state {
    padding: 36px 0 !important;
    text-align: center !important;
    color: #64748b !important;
    font-size: 13px !important;
    animation: sfirHeaderIn 0.3s ease both !important;
}

.sfir-history-empty-icon {
    margin-bottom: 10px !important;
    color: #94a3b8 !important;
    animation: sfirEmptyPulse 2.6s ease-in-out infinite !important;
}

.sfir-history-empty-title {
    font-size: 13px !important;
    font-weight: 700 !important;
    color: #334155 !important;
    margin: 0 0 4px 0 !important;
}

.sfir-history-empty-sub {
    font-size: 11.5px !important;
    color: #94a3b8 !important;
    margin: 0 !important;
}

/* Keyframes */
@keyframes sfirItemIn {
    from {
        opacity: 0;
        transform: translateY(10px) scale(0.985);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@keyframes sfirHeaderIn {
    from {
        opacity: 0;
        transform: translateY(-6px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes sfirFocusPulse {
    0%, 100% {
        box-shadow: 0 0 0 3px rgba(1, 118, 211, 0.16), 0 2px 8px rgba(1, 118, 211, 0.12);
    }
    50% {
        box-shadow: 0 0 0 4px rgba(1, 118, 211, 0.24), 0 2px 10px rgba(1, 118, 211, 0.18);
    }
}

@keyframes sfirShake {
    0%, 100% {
        transform: translateX(0);
    }
    25% {
        transform: translateX(-2px);
    }
    75% {
        transform: translateX(2px);
    }
}

@keyframes sfirEmptyPulse {
    0%, 100% {
        opacity: 0.55;
        transform: scale(1);
    }
    50% {
        opacity: 1;
        transform: scale(1.07);
    }
}

/* ════════════════════════════════════════════════════════════════════
   GLOBAL ANIMATION PASS — dropdowns, toggles, suggestions, results
   ════════════════════════════════════════════════════════════════════ */
@keyframes sfirDropFade {
    from {
        opacity: 0;
        transform: translateY(-6px) scale(0.97);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@keyframes sfirTogglePulse {
    0% {
        transform: scale(1);
    }
    40% {
        transform: scale(1.08);
    }
    100% {
        transform: scale(1);
    }
}

.slds-checkbox_toggle input:checked+.slds-checkbox_faux_container .slds-checkbox_faux {
    animation: sfirTogglePulse 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
}

.sfir-header-toggle-container input[type="checkbox"]:checked+.sfir-header-toggle-switch {
    background-color: #0176d3 !important;
    box-shadow: 0 0 0 3px rgba(1, 118, 211, 0.18) !important;
    animation: sfirTogglePulse 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
}

@keyframes sfirPanelIn {
    from {
        opacity: 0;
        transform: translateY(-5px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes sfirSuggestionIn {
    from {
        opacity: 0;
        transform: translateY(5px) scale(0.96);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@keyframes sfirResultIn {
    from {
        opacity: 0;
        transform: translateX(-6px);
    }
    to {
        opacity: 1;
        transform: translateX(0);
    }
}

/* The autocomplete panel itself is a persistent list — don't re-animate it
   on every keystroke; animate the result rows instead (suggestion-on-type). */
.autocomplete-results {
    animation: none !important;
    transform-origin: unset !important;
}

.autocomplete-result {
    animation: sfirResultIn 0.22s ease both !important;
}

/* Suggestions strip pills — cascading entrance */
.sfir-suggestions-panel .slds-pill {
    animation: sfirSuggestionIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) backwards !important;
}

.sfir-suggestions-panel .slds-pill:nth-child(1) {
    animation-delay: 0.02s !important;
}

.sfir-suggestions-panel .slds-pill:nth-child(2) {
    animation-delay: 0.07s !important;
}

.sfir-suggestions-panel .slds-pill:nth-child(3) {
    animation-delay: 0.12s !important;
}

.sfir-suggestions-panel .slds-pill:nth-child(4) {
    animation-delay: 0.17s !important;
}

.sfir-suggestions-panel .slds-pill:nth-child(5) {
    animation-delay: 0.22s !important;
}

.sfir-suggestions-panel .slds-pill:nth-child(6) {
    animation-delay: 0.27s !important;
}

.sfir-suggestions-empty {
    animation: sfirPanelIn 0.2s ease both !important;
}

/* Copy menu already has its own entrance — keep it, ensure origin */
.sfir-copy-menu {
    transform-origin: top left !important;
}

/* Dropdown item hover micro-interaction */
.sfir-datatype-dropdown-menu > div,
.sfir-copy-menu button,
.sfir-col-filter-item {
    transition: transform 0.15s ease, background-color 0.15s ease, color 0.15s ease !important;
}

.sfir-datatype-dropdown-menu > div:hover,
.sfir-copy-menu button:hover {
    transform: translateX(2px) !important;
}

/* ════════════════════════════════════════════════════════════════════
   HISTORY DRAWER v2 — consolidated glass redesign
   (final block wins the cascade over the legacy generations above)
   ════════════════════════════════════════════════════════════════════ */

/* Glass drawer shell — compact, less curved */
.sfir-history-drawer {
    top: 64px !important;
    width: 600px !important;
    max-height: min(68vh, 560px) !important;
    background: rgba(255, 255, 255, 0.82) !important;

/* ── Unified Comet Loader (replaces all custom spinners/loaders) ── */
.comet-loader {
    width: 50px;
    aspect-ratio: 1;
    display: grid;
    border-radius: 50%;
    background:
        linear-gradient(0deg, rgb(0 0 0/50%) 30%, #0000 0 70%, rgb(0 0 0/100%) 0) 50%/8% 100%,
        linear-gradient(90deg, rgb(0 0 0/25%) 30%, #0000 0 70%, rgb(0 0 0/75%) 0) 50%/100% 8%;
    background-repeat: no-repeat;
    animation: comet-loader-spin 1s infinite steps(12);
}
.comet-loader::before,
.comet-loader::after {
    content: "";
    grid-area: 1/1;
    border-radius: 50%;
    background: inherit;
    opacity: 0.915;
    transform: rotate(30deg);
}
.comet-loader::after {
    opacity: 0.83;
    transform: rotate(60deg);
}
@keyframes comet-loader-spin {
    100% { transform: rotate(1turn); }
}

/* Inline (button/row) variant — small, keeps adjacent text baseline */
.comet-loader-inline {
    width: 14px;
    aspect-ratio: 1;
    display: inline-grid;
    border-radius: 50%;
    vertical-align: -2px;
    margin-right: 6px;
    background:
        linear-gradient(0deg, rgb(0 0 0/50%) 30%, #0000 0 70%, rgb(0 0 0/100%) 0) 50%/8% 100%,
        linear-gradient(90deg, rgb(0 0 0/25%) 30%, #0000 0 70%, rgb(0 0 0/75%) 0) 50%/100% 8%;
    background-repeat: no-repeat;
    animation: comet-loader-spin 1s infinite steps(12);
}
.comet-loader-inline::before,
.comet-loader-inline::after {
    content: "";
    grid-area: 1/1;
    border-radius: 50%;
    background: inherit;
    opacity: 0.915;
    transform: rotate(30deg);
}
.comet-loader-inline::after {
    opacity: 0.83;
    transform: rotate(60deg);
}

body:not(.sfarc-dark-theme) .sfarc-loader-overlay .comet-loader {

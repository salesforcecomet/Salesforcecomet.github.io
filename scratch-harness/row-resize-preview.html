<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Row Resize Harness — real data-load.js</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  #scroller {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    overflow: auto; background: #fff;
  }
  .controls { position: fixed; bottom: 12px; right: 12px; z-index: 9999; display: flex; gap: 8px; }
  .controls button { border: 1px solid rgba(0,0,0,0.2); background: #fff; border-radius: 8px; padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,0.15); }
  .status { position: fixed; top: 10px; left: 10px; z-index: 9999; background: rgba(0,0,0,0.75); color: #fff; font-size: 12px; padding: 6px 10px; border-radius: 8px; font-family: ui-monospace, monospace; white-space: pre; }
</style>
<style>.sfir-inspector-table {
  border-collapse: collapse;
  font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, Courier, monospace;
  font-size: 11px !important;
  background-color: #ffffff;
  border: 1px solid #e2e8f0 !important;
  width: 100% !important;
}
table.sfir-inspector-table th,
table.sfir-inspector-table td {
  border: 1px solid #e2e8f0 !important;
  padding: 2px 8px !important;
  white-space: pre-wrap !important;
  color: #334155 !important;
  line-height: 1.3 !important;
  font-size: 11px !important;
  /* height intentionally NOT !important: the row-resizer sets an inline
     height while dragging and on re-render, so a hard !important here would
     override it and snap every row back to 22px (resize appears broken). */
  height: 22px;
}
table.sfir-inspector-table td {
  border: 1px solid #e2e8f0 !important;
  padding: 2px 8px !important;
  white-space: pre-wrap !important;
  color: #334155 !important;
  line-height: 1.3 !important;
  font-size: 11px !important;
  /* height intentionally NOT !important: the row-resizer sets an inline
     height while dragging and on re-render, so a hard !important here would
     override it and snap every row back to 22px (resize appears broken). */
  height: 22px;
}
.sfir-inspector-table .sfir-row-number {
  text-align: right;
  border-right: 2px solid #cbd5e1 !important;
  user-select: none;
  background-color: #f4f6f9;
  color: #706e6b;
}
table.sfir-inspector-table th.sfir-row-number,
table.sfir-inspector-table td.sfir-row-number {
  padding: 0 6px !important;
}
.sfir-table-row:nth-child(even) {
  background-color: #f8fafc;
}
body.sfarc-dark-theme .sfir-inspector-table {
  background-color: #1e1e1e;
  border-color: #3a3a3a;
}

.sfir-row-resizer {
    position: absolute !important;
    bottom: -2px !important;
    left: 0 !important;
    width: 100% !important;
    height: 6px !important;
    cursor: row-resize !important;
    z-index: 15 !important;
    user-select: none !important;
    background-color: transparent;
    transition: background-color 0.15s ease;
}
tr.sfir-row-resizing td {
    user-select: none !important;
}
.scrolltable-scrolled tr:hover .scrolltable-cell:not(.header) {
    background-color: #f1f5f9 !important;
    color: #0f172a !important;
}
</style>
</head>
<body>
  <div id="scroller"></div>
  <div class="status" id="status">loading...</div>
  <div class="controls">
    <button onclick="simulateDrag()">Simulate Row Drag +120px</button>
    <button onclick="location.reload()">Reload</button>
  </div>
<script>

// stubs for things data-load.js references
function cellToString(v){ if(v==null) return ''; return String(v); }
function renderCell(data, cell, td, r, c, onChange){ td.textContent = cell == null ? '' : String(cell); }
function renderHeaderCell(data, cell, td, c){ td.textContent = cell == null ? '' : String(cell); }
window.sfirConfirm = window.sfirConfirm || (() => {});
window.isRecordId = window.isRecordId || (() => false);




// In-app glass confirm — replaces native confirm() so destructive actions
// never trigger blocking browser dialogs (Chrome Web Store best practice).
function sfirConfirm({title, message, confirmLabel, onConfirm}) {
  if (window.__sfirConfirmEl) {
    window.__sfirConfirmEl.remove();
    window.__sfirConfirmEl = null;
  }
  const overlay = document.createElement("div");
  overlay.className = "sfir-modal-overlay";
  const card = document.createElement("div");
  card.className = "sfir-modal-card";
  card.style.width = "380px";
  card.style.maxWidth = "92vw";
  const close = () => {
    overlay.remove();
    window.__sfirConfirmEl = null;
  };
  overlay.addEventListener("click", close);
  card.addEventListener("click", e => e.stopPropagation());
  const header = document.createElement("div");
  header.className = "sfir-modal-header";
  const titleWrap = document.createElement("div");
  titleWrap.className = "sfir-modal-title-group";
  const titleEl = document.createElement("h3");
  titleEl.className = "sfir-modal-title";
  titleEl.textContent = title || "Confirm";
  const closeBtn = document.createElement("button");
  closeBtn.type = "button";
  closeBtn.className = "sfir-modal-close-btn";
  closeBtn.textContent = "\u2715";
  closeBtn.addEventListener("click", close);
  titleWrap.appendChild(titleEl);
  header.appendChild(titleWrap);
  header.appendChild(closeBtn);
  const body = document.createElement("div");
  body.className = "sfir-modal-body";
  const msg = document.createElement("p");
  msg.textContent = message || "Are you sure?";
  msg.style.margin = "0";
  msg.style.lineHeight = "1.5";
  msg.style.color = "var(--sfir-text-secondary, #64748b)";
  body.appendChild(msg);
  const footer = document.createElement("div");
  footer.className = "sfir-modal-footer";
  const cancelBtn = document.createElement("button");
  cancelBtn.type = "button";
  cancelBtn.className = "sfir-modal-cancel-btn";
  cancelBtn.textContent = "Cancel";
  cancelBtn.addEventListener("click", close);
  const okBtn = document.createElement("button");
  okBtn.type = "button";
  okBtn.className = "sfir-modal-save-btn sfir-confirm-danger-btn";
  okBtn.textContent = confirmLabel || "Delete";
  okBtn.addEventListener("click", () => {
    close();
    if (onConfirm) onConfirm();
  });
  footer.appendChild(cancelBtn);
  footer.appendChild(okBtn);
  card.appendChild(header);
  card.appendChild(body);
  card.appendChild(footer);
  overlay.appendChild(card);
  document.body.appendChild(overlay);
  window.__sfirConfirmEl = overlay;
}

let activeEditRowIdx = -1;
let activeEditRowDrafts = {};

function hasRowChanges(rowIdx, rtTable) {
  if (activeEditRowIdx !== rowIdx) return false;
  if (!activeEditRowDrafts) return false;
  for (let colIdx in activeEditRowDrafts) {
    let originalVal = rtTable && rtTable.originalRowValues && rtTable.originalRowValues[rowIdx] !== undefined
      ? cellToString(rtTable.originalRowValues[rowIdx][colIdx])
      : "";
    if (originalVal === "[null]") originalVal = "";
    if (activeEditRowDrafts[colIdx] !== originalVal) {
      return true;
    }
  }
  return false;
}
const greyOutSkippedColumns = localStorage.getItem("greyOutSkippedColumns") === "true" && !window.location.href.includes("data-export");
// Inspired by C# System.Linq.Enumerable
function Enumerable(iterable) {
  this[Symbol.iterator] = iterable[Symbol.iterator].bind(iterable);
}
Enumerable.prototype = {
  __proto__: function*(){}.prototype,
  *map(f) {
    for (let e of this) {
      yield f(e);
    }
  },
  *filter(f) {
    for (let e of this) {
      if (f(e)) {
        yield e;
      }
    }
  },
  *flatMap(f) {
    for (let e of this) {
      yield* f(e);
    }
  },
  *concat(other) {
    yield* this;
    yield* other;
  },
  some() {
    for (let e of this) {
      return true;
    }
    return false;
  },
  toArray() {
    return Array.from(this);
  }
};
Enumerable.prototype.map.prototype = Enumerable.prototype;
Enumerable.prototype.filter.prototype = Enumerable.prototype;
Enumerable.prototype.flatMap.prototype = Enumerable.prototype;
Enumerable.prototype.concat.prototype = Enumerable.prototype;

// @param didUpdate: A callback function to listen for updates to describe data
function DescribeInfo(spinFor, didUpdate) {
  function initialState() {
    return {
      data: {global: {globalStatus: "pending", globalDescribe: null}, sobjects: null},
      tool: {global: {globalStatus: "pending", globalDescribe: null}, sobjects: null}
    };
  }
  let sobjectAllDescribes = initialState();
  function getGlobal(useToolingApi) {
    let apiDescribes = sobjectAllDescribes[useToolingApi ? "tool" : "data"];
    if (apiDescribes.global.globalStatus == "pending") {
      apiDescribes.global.globalStatus = "loading";
      spinFor(sfConn.rest(
        useToolingApi
          ? "/services/data/v" + apiVersion + "/tooling/sobjects/"
          : "/services/data/v" + apiVersion + "/sobjects/",
        {useCache: false}
      ).then(res => {
        apiDescribes.global.globalStatus = "ready";
        apiDescribes.global.globalDescribe = res;
        apiDescribes.sobjects = new Map();
        for (let sobjectDescribe of res.sobjects) {
          apiDescribes.sobjects.set(sobjectDescribe.name.toLowerCase(), {global: sobjectDescribe, sobject: {sobjectStatus: "pending", sobjectDescribe: null}});
        }
        didUpdate();
      }, () => {
        apiDescribes.global.globalStatus = "loadfailed";
        didUpdate();
      }));
    }
    return apiDescribes;
  }
  // Makes global and sobject describe API calls, and caches the results.
  // If the result of an API call is not already cashed, empty data is returned immediately, and the API call is made asynchronously.
  // The caller is notified using the didUpdate callback or the spinFor promise when the API call completes, so it can make the call again to get the cached results.
  return {
    // Returns an object with two properties:
    // - globalStatus: a string with one of the following values:
    //    "pending": (has not started loading, never returned by this function)
    //    "loading": Describe info for the api is being downloaded
    //    "loadfailed": Downloading of describe info for the api failed
    //    "ready": Describe info is available
    // - globalDescribe: contains a DescribeGlobalResult if it has been loaded
    describeGlobal(useToolingApi) {
      return getGlobal(useToolingApi).global;
    },
    // Returns an object with two properties:
    // - sobjectStatus: a string with one of the following values:
    //    "pending": (has not started loading, never returned by this function)
    //    "notfound": The object does not exist
    //    "loading": Describe info for the object is being downloaded
    //    "loadfailed": Downloading of describe info for the object failed
    //    "ready": Describe info is available
    // - sobjectDescribe: contains a DescribeSObjectResult if the object exists and has been loaded
    describeSobject(useToolingApi, sobjectName) {
      let apiDescribes = getGlobal(useToolingApi);
      if (!apiDescribes.sobjects) {
        return {sobjectStatus: apiDescribes.global.globalStatus, sobjectDescribe: null};
      }
      let sobjectInfo = apiDescribes.sobjects.get(sobjectName.toLowerCase());
      if (!sobjectInfo) {
        return {sobjectStatus: "notfound", sobjectDescribe: null};
      }
      if (sobjectInfo.sobject.sobjectStatus == "pending") {
        sobjectInfo.sobject.sobjectStatus = "loading";
        spinFor(sfConn.rest(sobjectInfo.global.urls.describe, {useCache: false}).then(res => {
          sobjectInfo.sobject.sobjectStatus = "ready";
          sobjectInfo.sobject.sobjectDescribe = res;
          didUpdate();
        }, () => {
          sobjectInfo.sobject.sobjectStatus = "loadfailed";
          didUpdate();
        }));
      }
      return sobjectInfo.sobject;
    },
    reloadAll() {
      sobjectAllDescribes = initialState();
      didUpdate();
    }
  };
}

// Pluralize a numeric value by adding an s (or optional suffix) if it is not 1
function s(num, suffix = "s") {
  return num == 1 ? "" : suffix;
}

function cellToString(cell) {
  if (cell == null) {
    return "";
  } else if (typeof cell == "object") {
    if (cell.attributes && cell.attributes.type) {
      return "[" + cell.attributes.type + "]";
    }
    // Format compound Address fields (e.g., BillingAddress, ShippingAddress)
    if ("street" in cell || "city" in cell || "state" in cell || "country" in cell || "postalCode" in cell) {
      let addr = [cell.street, cell.city, cell.state, cell.postalCode, cell.country]
        .map(val => val ? String(val).trim() : "")
        .filter(Boolean)
        .join(", ");
      return addr.replace(/\r?\n/g, " ");
    }
    // Format compound Location fields (Geolocation)
    if ("latitude" in cell && "longitude" in cell) {
      if (cell.latitude == null && cell.longitude == null) {
        return "";
      }
      return "Lat: " + cell.latitude + ", Lon: " + cell.longitude;
    }
    // General fallback to JSON string representation
    try {
      let jsonStr = JSON.stringify(cell);
      return jsonStr.replace(/\r?\n/g, " ");
    } catch (e) {
      return "" + cell;
    }
  } else {
    return ("" + cell).replace(/\r?\n/g, " ");
  }
}

function openEditModal(r, objectType, recordId, rt, updateRowCallback) {
  let modalContainer = document.createElement("div");
  modalContainer.className = "sfir-modal-container";
  
  let backdrop = document.createElement("div");
  backdrop.className = "slds-backdrop slds-backdrop_open";
  modalContainer.appendChild(backdrop);
  
  let modal = document.createElement("div");
  modal.className = "slds-modal slds-fade-in-open";
  modal.setAttribute("role", "dialog");
  modal.setAttribute("aria-modal", "true");
  modalContainer.appendChild(modal);
  
  let modalContainerInner = document.createElement("div");
  modalContainerInner.className = "slds-modal__container";
  modalContainerInner.style.maxWidth = "500px";
  modal.appendChild(modalContainerInner);
  
  let header = document.createElement("div");
  header.className = "slds-modal__header";
  header.innerHTML = `<h2 class="slds-text-heading_medium">Edit Record</h2><p class="slds-m-top_xx-small" style="font-family: monospace; font-size: 11px; color: #64748b;">${window.escapeHtml(objectType)} (${window.escapeHtml(recordId)})</p>`;
  modalContainerInner.appendChild(header);
  
  let body = document.createElement("div");
  body.className = "slds-modal__content slds-p-around_medium";
  body.style.maxHeight = "400px";
  body.style.overflowY = "auto";
  modalContainerInner.appendChild(body);
  
  let footer = document.createElement("div");
  footer.className = "slds-modal__footer";
  modalContainerInner.appendChild(footer);
  
  // Build form fields
  let fieldInputs = [];
  for (let c = 0; c < rt.table[0].length; c++) {
    let fieldName = rt.table[0][c];
    if (!fieldName || fieldName.startsWith("_") || fieldName.includes(".") || ["id", "createddate", "createdbyid", "lastmodifieddate", "lastmodifiedbyid", "systemmodstamp"].includes(fieldName.toLowerCase())) {
      continue;
    }
    
    let formElement = document.createElement("div");
    formElement.className = "slds-form-element slds-m-bottom_small";
    
    let label = document.createElement("label");
    label.className = "slds-form-element__label";
    label.style.fontWeight = "600";
    label.style.fontSize = "11px";
    label.textContent = fieldName;
    formElement.appendChild(label);
    
    let control = document.createElement("div");
    control.className = "slds-form-element__control";
    formElement.appendChild(control);
    
    let currentVal = cellToString(rt.table[r][c]);
    if (currentVal === "[null]") {
      currentVal = "";
    }
    
    let input = document.createElement("input");
    input.type = "text";
    input.className = "slds-input";
    input.style.fontSize = "11px";
    input.value = currentVal;
    control.appendChild(input);
    
    body.appendChild(formElement);
    fieldInputs.push({ colIdx: c, fieldName, input });
  }
  
  if (fieldInputs.length === 0) {
    body.innerHTML = '<p class="slds-text-align_center slds-p-around_medium" style="color: #64748b;">No editable fields found in this query.</p>';
  }
  
  // Footer buttons
  let btnCancel = document.createElement("button");
  btnCancel.className = "slds-button slds-button_neutral";
  btnCancel.textContent = "Cancel";
  btnCancel.addEventListener("click", closeModal);
  footer.appendChild(btnCancel);
  
  let btnSave = document.createElement("button");
  btnSave.className = "slds-button slds-button_brand";
  btnSave.textContent = "Save";
  if (fieldInputs.length === 0) btnSave.disabled = true;
  
  btnSave.addEventListener("click", () => {
    btnSave.disabled = true;
    btnSave.textContent = "Saving...";
    
    let payload = {};
    fieldInputs.forEach(({ fieldName, input }) => {
      payload[fieldName] = input.value === "" ? null : input.value;
    });
    
    let updateUrl = `/services/data/v${apiVersion}/sobjects/${objectType}/${recordId}`;
    if (rt.isTooling) {
      updateUrl = `/services/data/v${apiVersion}/tooling/sobjects/${objectType}/${recordId}`;
    }
    
    sfConn.rest(updateUrl, {
      method: "PATCH",
      body: payload
    })
    .then(() => {
      // Update table data
      fieldInputs.forEach(({ colIdx, input }) => {
        rt.table[r][colIdx] = input.value === "" ? null : input.value;
      });
      
      // Repaint virtual scrolltable
      updateRowCallback();
      closeModal();
    })
    .catch(err => {
      btnSave.disabled = false;
      btnSave.textContent = "Save";
      if (typeof toast !== "undefined" && toast.error) toast.error("Error saving record: " + (err.message || err));
      else              if (typeof toast !== "undefined" && toast.error) toast.error("Error saving record: " + (err.message || err));
              else alert("Error saving record: " + (err.message || err));
    });
  });
  footer.appendChild(btnSave);
  
  document.body.appendChild(modalContainer);
  
  function closeModal() {
    document.body.removeChild(modalContainer);
  }
}

function renderDiffCell(originalVal, newVal, td) {
  let container = document.createElement("div");
  container.className = "sfir-cell-diff-container";
  
  let prevRow = document.createElement("div");
  prevRow.className = "sfir-cell-diff-row prev";
  
  let prevText = document.createElement("span");
  prevText.className = "text";
  prevText.textContent = originalVal === null || originalVal === undefined ? "[null]" : originalVal;
  prevRow.appendChild(prevText);
  
  let prevBadge = document.createElement("span");
  prevBadge.className = "badge";
  prevBadge.textContent = "Prev:";
  prevRow.appendChild(prevBadge);
  
  let newRow = document.createElement("div");
  newRow.className = "sfir-cell-diff-row new";
  
  let newText = document.createElement("span");
  newText.className = "text";
  newText.textContent = newVal === null || newVal === undefined ? "[null]" : newVal;
  newRow.appendChild(newText);
  
  let newBadge = document.createElement("span");
  newBadge.className = "badge";
  newBadge.textContent = "New:";
  newRow.appendChild(newBadge);
  
  container.appendChild(prevRow);
  container.appendChild(newRow);
  
  td.innerHTML = "";
  td.appendChild(container);
}

function renderCell(rt, cell, td, r, c, updateRowCallback) {
  let fieldName = rt.table[0][c];

  if (r === 0) {
    if (fieldName === "_actions") {
      td.innerHTML = "";
      td.textContent = "";
      td.style.width = "55px";
      return;
    }
    if (fieldName === "_") {
      td.innerHTML = "";
      td.textContent = "Object";
      return;
    }
  }

  if (fieldName === "_actions") {
    td.innerHTML = "";
    let record = rt.table[r][0];
    if (typeof record === "object" && record !== null && updateRowCallback) {
      let recordInfo = () => {
        let recordId = null;
        if (record.attributes && record.attributes.url) {
          recordId = record.attributes.url.replace(/.*\//, "");
        }
        let objectTypes = record.attributes && record.attributes.type ? [record.attributes.type] : [];
        return {objectTypes, recordId};
      };
      
      let actionsContainer = document.createElement("span");
      actionsContainer.className = "sfir-inline-actions-container";
      
      if (activeEditRowIdx === r) {
        // Save Button (starts splashing if unsaved changes exist)
        let inlineSave = document.createElement("span");
        let isDirtyRow = hasRowChanges(r, rt);
        inlineSave.className = "sfir-inline-btn edit" + (isDirtyRow ? " sfir-pulse-save" : "");
        inlineSave.title = "Save Changes (Click to commit)";
        inlineSave.innerHTML = `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
        
        inlineSave.addEventListener("click", ev => {
          ev.preventDefault();
          ev.stopPropagation();
          let {objectTypes, recordId} = recordInfo();
          let resolvedObjectType = undefined;
          
          function proceedUpdate(objType) {
            let payload = {};
            let hasChanges = false;
            
            for (let colIdx in activeEditRowDrafts) {
              let fieldName = rt.table[0][colIdx];
              let originalVal = rt.originalRowValues && rt.originalRowValues[r] !== undefined
                ? cellToString(rt.originalRowValues[r][colIdx])
                : "";
              if (originalVal === "[null]") {
                originalVal = "";
              }
              let draftVal = activeEditRowDrafts[colIdx];
              if (draftVal !== originalVal) {
                payload[fieldName] = draftVal === "" ? null : draftVal;
                hasChanges = true;
              }
            }
            
            if (!hasChanges) {
              activeEditRowIdx = -1;
              activeEditRowDrafts = {};
              updateRowCallback();
              return;
            }
            
            let updateUrl = `/services/data/v${apiVersion}/sobjects/${objType}/${recordId}`;
            if (rt.isTooling) {
              updateUrl = `/services/data/v${apiVersion}/tooling/sobjects/${objType}/${recordId}`;
            }
            
            sfConn.rest(updateUrl, {
              method: "PATCH",
              body: payload
            })
            .then(() => {
              for (let colIdx in activeEditRowDrafts) {
                rt.table[r][colIdx] = activeEditRowDrafts[colIdx] === "" ? null : activeEditRowDrafts[colIdx];
              }
              activeEditRowIdx = -1;
              activeEditRowDrafts = {};
              updateRowCallback();
            })
            .catch(err => {
              if (typeof toast !== "undefined" && toast.error) toast.error("Error saving record: " + (err.message || err));
      else              if (typeof toast !== "undefined" && toast.error) toast.error("Error saving record: " + (err.message || err));
              else alert("Error saving record: " + (err.message || err));
            });
          }
          
          if (objectTypes.length === 1 && objectTypes[0] !== "Unknown") {
            resolvedObjectType = objectTypes[0];
            proceedUpdate(resolvedObjectType);
          } else if (recordId && isRecordId(recordId)) {
            const prefixMap = {
              "001": "Account", "003": "Contact", "005": "User", "006": "Opportunity",
              "00Q": "Lead", "500": "Case", "07L": "ApexLog", "01p": "ApexClass",
              "01q": "ApexTrigger", "09y": "ApexPage", "01m": "ApexComponent",
              "707": "AsyncApexJob", "00e": "Profile", "002": "Note", "00T": "Task",
              "00a": "Event", "022": "Attachment", "087": "CronTrigger",
              "03d": "ApexTestSuite", "0D5": "OrgWideEmailAddress", "00G": "Group",
              "00X": "EmailTemplate", "01M": "EventLogFile", "04g": "ProcessInstance",
              "026": "Period", "03s": "QueueSobject", "08m": "ApexTestResult"
            };
            let prefix = recordId.substring(0, 3);
            if (prefixMap[prefix]) {
              resolvedObjectType = prefixMap[prefix];
              proceedUpdate(resolvedObjectType);
            } else {
              sfConn.rest(`/services/data/v${apiVersion}/ui-api/records/${recordId}?layoutTypes=Compact`).then(res => {
                resolvedObjectType = res.apiName;
                proceedUpdate(resolvedObjectType);
              }).catch(() => {
                if (typeof toast !== "undefined" && toast.warning) toast.warning("Could not identify SObject type for this record.");
                else                if (typeof toast !== "undefined" && toast.warning) toast.warning("Could not identify SObject type for this record.");
                else alert("Could not identify SObject type for this record.");

          sfConn.rest(`/services/data/v${apiVersion}/ui-api/records/${recordId}?layoutTypes=Compact`).then(res => {
            objectType = res.apiName;
            setLinks(defaultOptions);
          }).catch(() => {

            defaultOptions.isShowAllData = false;
            setLinks(defaultOptions);

        defaultOptions.isShowAllData = false;

  }

    return /^\/services\/data\/v[0-9]{2,3}.[0-9]{1}\/sobjects\/EventLogFile\/[a-z0-9]{5}0000[a-z0-9]{9}\/LogFile$/i.exec(text);

          let keyPrefix = recordId.substring(0, 3);

        }

      },
      cell
    );
  } else if (typeof cell == "string" && isEventLogFile(cell)) {
    popLink(
      () => {

    let offsetMinutes = textDate.getTimezoneOffset();
    let offsetHours = Math.floor(Math.abs(offsetMinutes) / 60);
    let offsetMinutesRemainder = Math.abs(offsetMinutes) % 60;

    // Adjust the date to the local time based on the offset
    textDate.setMinutes(textDate.getMinutes() - offsetMinutes);

    let localTime = textDate.toISOString().replace("Z", "") // Remove 'Z' from ISO string (UTC)
      + (offsetMinutes > 0 ? "-" : "+") // Use the appropriate sign based on offset

    td.textContent = cellToString(cell);
  }
}

// A table that contains millions of records will freeze the browser if we try to render the entire table at once.
// Therefore we implement a table within a scrollable area, where the cells are only rendered, when they are scrolled into view.
// 
// Limitations:
// * It is not possible to select or search the contents of the table outside the rendered area. The user will need to copy to Excel or CSV to do that.
// * Since we initially estimate the size of each cell and then update as we render them, the table will sometimes "jump" as the user scrolls.
// * There is no line wrapping within the cells. A cell with a lot of text will be very wide.
// 
// Implementation:
// Since we don't know the height of each row before we render it, we assume to begin with that it is fairly small, and we then grow it to fit the rendered content, as the user scrolls.
// We never schrink the height of a row, to ensure that it stabilzes as the user scrolls. The heights are stored in the `rowHeights` array.
// To avoid re-rendering the visible part on every scroll, we render an area that is slightly larger than the viewport, and we then only re-render, when the viewport moves outside the rendered area.
// Since we don't know the height of each row before we render it, we don't know exactly how many rows to render.
// However since we never schrink the height of a row, we never render too few rows, and since we update the height estimates after each render, we won't repeatedly render too many rows.
// The initial estimate of the height of each row should be large enough to ensure we don't render too many rows in our initial render.
// We only measure the current size at the end of each render, to minimize the number of synchronous layouts the browser needs to make.
// We support adding new rows to the end of the table, and new cells to the end of a row, but not deleting existing rows, and we do not reduce the height of a row if the existing content changes.
// Each row may be visible or hidden.
// In addition to keeping track of the height of each cell, we keep track of the total height in order to adjust the height of the scrollable area, and we keep track of the position of the scrolled area.
// After a scroll we search for the position of the new rendered area using the position of the old scrolled area, which should be the least amount of work when the user scrolls in one direction.
// The table must have at least one row, since the code keeps track of the first rendered row.
// We assume that the height of the cells we measure sum up to the height of the table.
// We do the exact same logic for columns, as we do for rows.
// We assume that the size of a cell is not influenced by the size of other cells. Therefore we style cells with `white-space: pre`.
// 
// @param element A scrollable DOM element to render the table within.
// ScrollTable initScrollTable(DOMElement element);
// interface Table {
//   Cell[][] table; // a two-dimensional array of table rows and cells
//   boolean[] rowVisibilities; // For each row, true if it is visible, or false if it is hidden
//   boolean[] colVisibilities; // For each column, true if it is visible, or false if it is hidden
//   // Refactor: The following three attributes are only used by renderCell, they should be moved to a different interface
//   boolean isTooling;
//   DescribeInfo describeInfo;
//   String sfHost;
// }
// void renderCell(Table table, Cell cell, DOMElement element); // Render cell within element
// interface Cell {
//   // Anything, passed to the renderCell function
// }
// interface ScrollTable {
//   void viewportChange(); // Must be called whenever the size of viewport changes.
//   void dataChange(Table newData); // Must be called whenever the data changes. (even if it is the same object)
// }
function initScrollTable(scroller) {
  let data = null;
  let scrolled = document.createElement("div");
  scrolled.className = "scrolltable-scrolled";
  scroller.appendChild(scrolled);

  let initialRowHeight = 22;
  let initialColWidth = 50;
  // Dynamic buffer calculation based on viewport size
  let bufferHeight = Math.min(500, scroller.offsetHeight);
  let bufferWidth = Math.min(500, scroller.offsetWidth);
  let headerRows = 1;
  let headerCols = 0;

  let rowHeights = [];
  let rowVisible = [];
  let rowCount = 0;
  let totalHeight = 0;
  let firstRowIdx = 0;
  let firstRowTop = 0;
  let lastRowIdx = 0;
  let lastRowTop = 0;
  let colWidths = [];
  let colVisible = [];
  let colCount = 0;
  let totalWidth = 0;
  let firstColIdx = 0;
  let firstColLeft = 0;
  let lastColIdx = 0;
  let lastColLeft = 0;

  function updateBuffers() {
    // Recalculate buffers when viewport changes
    bufferHeight = Math.min(500, scroller.offsetHeight);
    bufferWidth = Math.min(500, scroller.offsetWidth);
  }

  function estimateColumnWidth(data, c) {
    if (!data || !data.table) {
      return 80;
    }
    let colName = (data.table[0] && data.table[0][c] != null) ? cellToString(data.table[0][c]) : "";
    if (colName === "_actions") {
      return 55;
    }
    let maxLength = colName ? colName.length : 0;
    let rowsToInspect = Math.min(data.table.length, 200);
    for (let r = 0; r < rowsToInspect; r++) {
      if (data.table[r]) {
        let cell = data.table[r][c];
        let strVal = cellToString(cell);
        if (strVal.length > maxLength) {
          maxLength = strVal.length;
        }
      }
    }
    return Math.max(65, Math.min(650, maxLength * 8 + 24));
  }

  function dataChange(newData) {
    data = newData;
    if (data && (!Array.isArray(data.rowVisibilities) || !Array.isArray(data.colVisibilities)) && (data.header || data.data || data.table)) {
      let table = data.table || (data.header ? [data.header].concat(data.data || []) : (data.data || []));
      data = {
        table: table,
        header: data.header,
        data: data.data,
        rowVisibilities: new Array(table.length).fill(true),
        colVisibilities: new Array(table[0] ? table[0].length : 0).fill(true)
      };
    }
    if (data == null || !Array.isArray(data.rowVisibilities) || data.rowVisibilities.length == 0 || !Array.isArray(data.colVisibilities) || data.colVisibilities.length == 0) {
      rowHeights = [];
      rowVisible = [];
      rowCount = 0;
      totalHeight = 0;
      firstRowIdx = 0;
      firstRowTop = 0;
      lastRowIdx = 0;
      lastRowTop = 0;

      colWidths = [];
      colVisible = [];
      colCount = 0;
      totalWidth = 0;
      firstColIdx = 0;
      firstColLeft = 0;
      lastColIdx = 0;
      lastColLeft = 0;
      renderData({force: true});
    } else {
      let newRowCount = data.rowVisibilities.length;
      for (let r = rowCount; r < newRowCount; r++) {
        rowHeights[r] = initialRowHeight;
        rowVisible[r] = 0;
      }
      rowCount = newRowCount;
      for (let r = 0; r < rowCount; r++) {
        let newVisible = Number(data.rowVisibilities[r]);
        let visibilityChange = newVisible - rowVisible[r];
        totalHeight += visibilityChange * rowHeights[r];
        if (r < firstRowIdx) {
          firstRowTop += visibilityChange * rowHeights[r];
        }
        rowVisible[r] = newVisible;
      }
      let newColCount = data.colVisibilities.length;
      for (let c = colCount; c < newColCount; c++) {
        colWidths[c] = estimateColumnWidth(data, c);
        colVisible[c] = 0;
      }
      colCount = newColCount;
      for (let c = 0; c < colCount; c++) {
        let newVisible = Number(data.colVisibilities[c]);
        let visibilityChange = newVisible - colVisible[c];
        totalWidth += visibilityChange * colWidths[c];
        if (c < firstColIdx) {
          firstColLeft += visibilityChange * colWidths[c];
        }
        colVisible[c] = newVisible;
      }
      renderData({force: true});
    }

  }

  let scrollTop = 0;
  let scrollLeft = 0;
  let offsetHeight = 0;
  let offsetWidth = 0;
  function viewportChange() {
    // Enhanced viewport change detection
    let newScrollTop = scroller.scrollTop;
    let newScrollLeft = scroller.scrollLeft;
    let newOffsetHeight = scroller.offsetHeight;
    let newOffsetWidth = scroller.offsetWidth;

    if (scrollTop !== newScrollTop || scrollLeft !== newScrollLeft
        || offsetHeight !== newOffsetHeight || offsetWidth !== newOffsetWidth) {
      scrollTop = newScrollTop;
      scrollLeft = newScrollLeft;
      offsetHeight = newOffsetHeight;
      offsetWidth = newOffsetWidth;
      updateBuffers();
      renderData({force: false});
    }
  }

  function renderData({force}) {
    try {
      scrollTop = scroller.scrollTop;
      scrollLeft = scroller.scrollLeft;
      offsetHeight = scroller.offsetHeight;
      offsetWidth = scroller.offsetWidth;

      if (rowCount == 0 || colCount == 0) {
        scrolled.textContent = "";
        scrolled.style.height = "0px";
        scrolled.style.width = "0px";
        return;
      }

      if (!force && firstRowTop <= scrollTop && (lastRowTop >= scrollTop + offsetHeight || lastRowIdx == rowCount) && firstColLeft <= scrollLeft && (lastColLeft >= scrollLeft + offsetWidth || lastColIdx == colCount)) {
        return;
      }

      while (firstRowTop < scrollTop - bufferHeight && firstRowIdx < rowCount - 1) {
        firstRowTop += rowVisible[firstRowIdx] * rowHeights[firstRowIdx];
        firstRowIdx++;
      }
      while (firstRowTop > scrollTop - bufferHeight && firstRowIdx > 0) {
        firstRowIdx--;
        firstRowTop -= rowVisible[firstRowIdx] * rowHeights[firstRowIdx];
      }
      while (firstColLeft < scrollLeft - bufferWidth && firstColIdx < colCount - 1) {
        firstColLeft += colVisible[firstColIdx] * colWidths[firstColIdx];
        firstColIdx++;
      }
      while (firstColLeft > scrollLeft - bufferWidth && firstColIdx > 0) {
        firstColIdx--;
        firstColLeft -= colVisible[firstColIdx] * colWidths[firstColIdx];
      }

      lastRowIdx = firstRowIdx;
      lastRowTop = firstRowTop;
      while (lastRowTop < scrollTop + offsetHeight + bufferHeight && lastRowIdx < rowCount) {
        lastRowTop += rowVisible[lastRowIdx] * rowHeights[lastRowIdx];
        lastRowIdx++;
      }
      lastColIdx = firstColIdx;
      lastColLeft = firstColLeft;
      while (lastColLeft < scrollLeft + offsetWidth + bufferWidth && lastColIdx < colCount) {
        lastColLeft += colVisible[lastColIdx] * colWidths[lastColIdx];
        lastColIdx++;
      }

      scrolled.textContent = "";

      let table = document.createElement("table");
      table.className = "sfir-inspector-table";
      let cellsVisible = false;

      // Ensure firstRowIdx never goes below headerRows
      firstRowIdx = Math.max(headerRows, firstRowIdx);

      // Render header rows separately to ensure they're always visible
      for (let r = 0; r < headerRows; r++) {
        if (rowVisible[r] == 0) continue;
        let row = data.table[r];
        let tr = document.createElement("tr");
        tr.className = "sfir-table-row sfir-table-header-row";
        tr.style.position = "sticky";
        tr.style.top = "0";
        tr.style.zIndex = "9";
        
        let thRowNumber = document.createElement("th");
        thRowNumber.className = "scrolltable-cell header sfir-row-number";
        thRowNumber.textContent = "";
        tr.appendChild(thRowNumber);
        for (let c = firstColIdx; c < lastColIdx; c++) {
          if (colVisible[c] == 0) continue;
          let cell = row[c];
          let td = document.createElement("td");
          let cellClasses = `scrolltable-cell header ${(cell.startsWith("_") && greyOutSkippedColumns) ? "skipped" : ""}`;
          if (data.preventLineWrap !== false) {
            cellClasses += " prevent-line-wrap";
          }
          td.className = cellClasses;
          td.setAttribute("data-col", c);
          td.style.minWidth = colWidths[c] + "px";
          td.style.width = colWidths[c] + "px";
          td.style.height = rowHeights[r] + "px";
          td.style.position = "relative";
          renderCell(data, cell, td, r, c);

          // Add Excel-style Column Resizer Handle
          let resizer = document.createElement("div");
          resizer.className = "sfir-col-resizer";
          resizer.title = "Drag to resize column width (Double-click to auto-fit)";

          resizer.addEventListener("mousedown", function(e) {
            e.preventDefault();
            e.stopPropagation();
            let startX = e.pageX;
            let startWidth = colWidths[c];
            resizer.classList.add("resizing");

            function onMouseMove(me) {
              let delta = me.pageX - startX;
              let newWidth = Math.max(35, startWidth + delta);
              colWidths[c] = newWidth;
              let colCells = table.querySelectorAll(`[data-col="${c}"]`);
              colCells.forEach(el => {
                el.style.minWidth = newWidth + "px";
                el.style.width = newWidth + "px";
              });
            }

            function onMouseUp() {
              document.removeEventListener("mousemove", onMouseMove);
              document.removeEventListener("mouseup", onMouseUp);
              resizer.classList.remove("resizing");
              totalWidth = 0;
              for (let i = 0; i < colCount; i++) {
                totalWidth += colVisible[i] * colWidths[i];
              }
              renderData({force: true});
            }

            document.addEventListener("mousemove", onMouseMove);
            document.addEventListener("mouseup", onMouseUp);
          });

          resizer.addEventListener("dblclick", function(e) {
            e.preventDefault();
            e.stopPropagation();
            let autoWidth = estimateColumnWidth(data, c);
            colWidths[c] = autoWidth;
            totalWidth = 0;
            for (let i = 0; i < colCount; i++) {
              totalWidth += colVisible[i] * colWidths[i];
            }
            renderData({force: true});
          });

          td.appendChild(resizer);
          tr.appendChild(td);
        }
        table.appendChild(tr);
      }

      function createRowResizer(r, tr) {
        let rowResizer = document.createElement("div");
        rowResizer.className = "sfir-row-resizer";
        rowResizer.title = "Drag to resize row height (Double-click to reset)";

        rowResizer.addEventListener("mousedown", function(e) {
          e.preventDefault();
          e.stopPropagation();
          let startY = e.pageY;
          let startHeight = rowHeights[r] || 28;
          rowResizer.classList.add("resizing");
          tr.classList.add("sfir-row-resizing");

          function onMouseMove(me) {
            let delta = me.pageY - startY;
            let newHeight = Math.max(22, startHeight + delta);
            rowHeights[r] = newHeight;
            tr.style.height = newHeight + "px";
            Array.from(tr.children).forEach(cell => {
              cell.style.height = newHeight + "px";
            });
          }

          function onMouseUp() {
            document.removeEventListener("mousemove", onMouseMove);
            document.removeEventListener("mouseup", onMouseUp);
            rowResizer.classList.remove("resizing");
            tr.classList.remove("sfir-row-resizing");
            totalHeight = 0;
            for (let i = 0; i < rowCount; i++) {

            }
            renderData({force: true});
          }

          document.addEventListener("mousemove", onMouseMove);
          document.addEventListener("mouseup", onMouseUp);
        });

        rowResizer.addEventListener("dblclick", function(e) {
          e.preventDefault();
          e.stopPropagation();
          rowHeights[r] = initialRowHeight || 28;
          totalHeight = 0;
          for (let i = 0; i < rowCount; i++) {
            totalHeight += (rowVisible[i] !== undefined ? rowVisible[i] : 1) * (rowHeights[i] || 28);
          }
          renderData({force: true});
        });

        return rowResizer;
      }

      // Render data rows
      for (let r = Math.max(headerRows, firstRowIdx); r < lastRowIdx; r++) {
        if (rowVisible[r] == 0) {
          continue;
        }
        let row = data.table[r];
        let tr = document.createElement("tr");
        tr.className = "sfir-table-row" + (activeEditRowIdx === r ? " sfir-row-editing" : "");
        
        let tdRowNumber = document.createElement("td");
        tdRowNumber.className = "scrolltable-cell header sfir-row-number";
        tdRowNumber.textContent = r;
        tdRowNumber.style.position = "relative";
        tdRowNumber.style.height = rowHeights[r] + "px";
        tdRowNumber.appendChild(createRowResizer(r, tr));

        if (typeof data.onRowClick === "function") {
          tdRowNumber.addEventListener("click", (ev) => {
            if (ev.target && ev.target.closest && ev.target.closest(".sfir-row-resizer")) return;
            data.onRowClick(r, tdRowNumber, ev);
          });
        }
        tr.appendChild(tdRowNumber);

        for (let c = firstColIdx; c < lastColIdx; c++) {
          if (colVisible[c] == 0) {
            continue;
          }
          let cell = row[c];
          let td = document.createElement("td");
          let cellClasses = "scrolltable-cell";
          if (c < headerCols) {
            cellClasses += " header";
          }
          if (data.preventLineWrap !== false) {
            cellClasses += " prevent-line-wrap";
          }
          td.className = cellClasses;
          td.setAttribute("data-col", c);
          td.setAttribute("data-row", r);
          td.style.position = "relative";
          td.style.minWidth = colWidths[c] + "px";
          td.style.width = colWidths[c] + "px";
          td.style.height = rowHeights[r] + "px";
          renderCell(data, cell, td, r, c, () => { dataChange(data); });
          // --- Apply cellMeta (highlight) ---
          if (data.cellMeta) {
            let meta = data.cellMeta.get(r + "," + c);
            if (meta) {
              if (meta.bgColor) {
                td.style.setProperty("background-color", meta.bgColor, "important");
              }
              if (meta.borderColor) {
                // Use inset box-shadow so it doesn't affect layout
                td.style.setProperty("box-shadow", `inset 0 0 0 2.5px ${meta.borderColor}`, "important");
                td.style.setProperty("z-index", "2", "important");
                td.style.setProperty("position", "relative", "important");
              }
            }
          }
          // --- Cell click handler for annotation modes ---
          if (typeof data.onCellClick === "function") {
            td.addEventListener("click", (ev) => {
              data.onCellClick(r, c, td, ev);
            });
          }
          td.appendChild(createRowResizer(r, tr));
          tr.appendChild(td);
          cellsVisible = true;
        }
        table.appendChild(tr);
      }

      // Adjust table position to prevent header overlap at the top
      let tableTop = Math.max(0, firstRowTop);
      table.style.top = tableTop + "px";
      table.style.left = firstColLeft + "px";
      scrolled.appendChild(table);

      if (cellsVisible) {
        // Measure the sticky header row(s) too: the header renders at its real
        // height (~24px) but the layout math still uses the 15px estimate, which
        // leaves a visible gap under the header and makes it jitter while
        // scrolling. Keep rowHeights in sync with what actually rendered.
        for (let hr = 0; hr < headerRows && hr < table.children.length; hr++) {
          let hRow = table.children[hr];
          let hCell = hRow.firstElementChild;
          if (!hCell) continue;
          let hHeight = hCell.getBoundingClientRect().height || 0;
          let hOld = rowHeights[hr] || 0;
          if (hHeight > hOld) {
            let dh = hHeight - hOld;
            rowHeights[hr] = hHeight;
            totalHeight += dh;
            if (hr < firstRowIdx) {
              firstRowTop += dh;
            }
            lastRowTop += dh;
          }
        }
        // Start adjusting heights from the first data row, not header
        let tr = table.children[headerRows];
        for (let r = Math.max(headerRows, firstRowIdx); r < lastRowIdx; r++) {
          if (rowVisible[r] == 0) {
            continue;
          }
          let rowRect = tr.firstElementChild.getBoundingClientRect();
          let oldHeight = rowHeights[r];
          let newHeight = Math.max(oldHeight, rowRect.height);
          rowHeights[r] = newHeight;
          totalHeight += newHeight - oldHeight;
          lastRowTop += newHeight - oldHeight;
          tr = tr.nextElementSibling;
        }
        let td = table.firstElementChild.firstElementChild;
        if (td && td.classList.contains("sfir-row-number")) {
          td = td.nextElementSibling;
        }
        for (let c = firstColIdx; c < lastColIdx; c++) {
          if (colVisible[c] == 0) {
            continue;
          }
          let colRect = td.getBoundingClientRect();
          let oldWidth = colWidths[c];
          let colName = data && data.table && data.table[0] ? data.table[0][c] : "";
          let newWidth = Math.max(oldWidth, colRect.width);
          if (c === 0 || colName === "_actions") {
            newWidth = 55;
          }
          colWidths[c] = newWidth;
          totalWidth += newWidth - oldWidth;
          lastColLeft += newWidth - oldWidth;
          td = td.nextElementSibling;
        }
      }
    } catch (error) {
      console.error("Error in renderData:", error);
    }
  }

  dataChange(null);
  scroller.addEventListener("scroll", viewportChange);
  // Added resize event listener to handle viewport changes
  window.addEventListener("resize", viewportChange);

  return {
    viewportChange,
    dataChange
  };
}

  data: table.slice(1),
  rowVisibilities: new Array(table.length).fill(true),
  colVisibilities: new Array(3).fill(true),
  preventLineWrap: true
});

const status = document.getElementById('status');
function refreshStatus() {
  const r = st.getRowHeights ? st.getRowHeights() : null;
  status.textContent = 'rows: ' + table.length + '\nresizers: ' + document.querySelectorAll('.sfir-row-resizer').length;
}
refreshStatus();

// Simulate: mousedown on first data row's resizer, move +120px, mouseup.
function simulateDrag() {
  const resizer = document.querySelector('.sfir-row-resizer');
  if (!resizer) { status.textContent = 'NO RESIZER FOUND'; return; }
  const tr = resizer.closest('tr');
  const before = tr ? tr.getBoundingClientRect().height : 0;
  const rect = resizer.getBoundingClientRect();
  const startY = rect.top + 3;

  const md = new MouseEvent('mousedown', { bubbles: true, cancelable: true, pageY: startY, clientY: startY });
  resizer.dispatchEvent(md);

  // fire several mousemoves on document
  let lastH = -1;
  for (let i = 1; i <= 12; i++) {
    const y = startY + i * 10;
    document.dispatchEvent(new MouseEvent('mousemove', { bubbles: true, cancelable: true, pageY: y, clientY: y }));
    const h = tr ? tr.style.height : null;
    if (h) lastH = parseFloat(h);
  }
  document.dispatchEvent(new MouseEvent('mouseup', { bubbles: true, cancelable: true, pageY: startY + 120, clientY: startY + 120 }));

  setTimeout(() => {
    const after = tr ? tr.getBoundingClientRect().height : 0;
    status.textContent = 'before: ' + before.toFixed(1) + 'px\nmid-drag style.height: ' + lastH + 'px\nafter mouseup: ' + after.toFixed(1) + 'px';
  }, 50);
}
</script>

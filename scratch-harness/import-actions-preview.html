<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Data Import — action bar harness</title>
<style>
/* ===== Real rules copied from src/data-import.css ===== */
:root {
  --sfarc-i-accent: #0176d3;
  --sfarc-i-accent-strong: #014486;
  --sfarc-i-card-bg: #ffffff;
  --sfarc-i-card-border: #e3e8ef;
  --sfarc-i-card-shadow: 0 8px 28px rgba(16, 42, 67, 0.07), 0 1px 3px rgba(16, 42, 67, 0.05);
  --sfarc-i-text: #1a2233;
  --sfarc-i-muted: #64748b;
  --sfarc-i-chip-bg: #f1f5f9;
  --sfarc-i-btn-bg: #ffffff;
  --sfarc-i-btn-border: #d8dde6;
  --sfarc-i-btn-text: #334155;
  --sfarc-i-btn-hover-bg: #f4f6f9;
  --sfarc-i-btn-hover-border: #c3cdd9;
  --sfarc-i-danger: #dc2626;
  --sfarc-i-warning: #d97706;
  --sfarc-i-success: #059669;
  --sfarc-i-info: #0284c7;
  --sfarc-i-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
body.sfarc-dark-theme {
  --sfarc-i-accent: #2f81f7;
  --sfarc-i-accent-strong: #1f6feb;
  --sfarc-i-card-bg: #17181c;
  --sfarc-i-card-border: #27282e;
  --sfarc-i-card-shadow: 0 10px 30px rgba(0,0,0,0.35);
  --sfarc-i-text: #e6e9ef;
  --sfarc-i-muted: #9aa6b6;
  --sfarc-i-chip-bg: #1e2025;
  --sfarc-i-btn-bg: #222b36;
  --sfarc-i-btn-border: #333f4e;
  --sfarc-i-btn-text: #d7dee8;
  --sfarc-i-btn-hover-bg: #2a3542;
  --sfarc-i-btn-hover-border: #46566a;
  --sfarc-i-danger: #f87171;
  --sfarc-i-warning: #fbbf24;
  --sfarc-i-success: #34d399;
  --sfarc-i-info: #38bdf8;
}
.sfarc-import-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: nowrap;
  gap: 8px;
  padding: 8px 10px;
  background: var(--sfarc-i-card-bg);
  border: 1px solid var(--sfarc-i-card-border);
  border-radius: 10px;
  box-shadow: var(--sfarc-i-card-shadow);
  overflow-x: auto;
  container-type: inline-size;
  container-name: sfarc-import-actions;
}
.sfarc-action-group { display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; flex-shrink: 0; }
.sfarc-status-pills { display: flex; align-items: center; gap: 5px; flex-wrap: nowrap; flex-shrink: 1; min-width: 0; justify-content: center; }
.sfarc-status-pills .status-stat-pill { flex-shrink: 1; min-width: 0; }
.sfarc-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 30px; padding: 0 12px; border-radius: 6px;
  font-family: var(--sfarc-i-font); font-size: 12px; font-weight: 600;
  border: 1px solid var(--sfarc-i-btn-border); cursor: pointer;
  transition: background .15s ease, border-color .15s ease, box-shadow .15s ease, transform .05s ease;
  white-space: nowrap; user-select: none; flex-shrink: 0; background: var(--sfarc-i-btn-bg); color: var(--sfarc-i-btn-text);
}
.sfarc-btn-primary { color: #fff; background: var(--sfarc-i-accent); border-color: var(--sfarc-i-accent); box-shadow: 0 1px 3px rgba(1,118,211,.25); }
.sfarc-btn-icon { width: 30px; min-width: 30px; padding: 0; background: var(--sfarc-i-btn-bg); color: var(--sfarc-i-muted); border-color: var(--sfarc-i-btn-border); }
.sfarc-btn-icon-label { width: auto; min-width: 30px; padding: 0 10px; color: var(--sfarc-i-btn-text); background: var(--sfarc-i-btn-bg); border-color: var(--sfarc-i-btn-border); }
.sfarc-btn-icon-label .sfarc-btn-label { font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.sfarc-btn-primary .sfarc-btn-label { font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.sfarc-btn-icon-svg { display: block; flex-shrink: 0 !important; width: 16px !important; height: 16px !important; min-width: 16px !important; min-height: 16px !important; }
.sfarc-import-actions .sfarc-action-group .sfarc-btn { height: 24px !important; min-height: 24px !important; }
.sfarc-import-actions .sfarc-btn-icon { width: 24px; min-width: 24px; }
@container sfarc-import-actions (max-width: 620px) {
  .sfarc-btn-icon-label { width: 24px; min-width: 24px; padding: 0; }
  .sfarc-btn-icon-label .sfarc-btn-label { display: none; }
  .sfarc-import-actions .sfarc-action-group .sfarc-btn-primary { width: 24px; min-width: 24px; padding: 0; }
  .sfarc-import-actions .sfarc-action-group .sfarc-btn-primary .sfarc-btn-label { display: none; }
}
.status-stat-pill {
  display: inline-flex; align-items: center; gap: 4px; height: 24px; box-sizing: border-box;
  padding: 0 7px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; user-select: none;
  border: 1px solid var(--sfarc-i-card-border); background: var(--sfarc-i-chip-bg); color: var(--sfarc-i-muted);
  transition: all .18s cubic-bezier(.4,0,.2,1);
}
.status-stat-pill .stat-count { font-variant-numeric: tabular-nums; }
.status-stat-pill.stat-queued.stat-live { background: rgba(2,132,199,.12); color: var(--sfarc-i-info); border-color: rgba(2,132,199,.28); }
.status-stat-pill.stat-processing.stat-live { background: rgba(217,119,6,.12); color: var(--sfarc-i-warning); border-color: rgba(217,119,6,.28); }
.status-stat-pill.stat-succeeded.stat-live { background: rgba(5,150,105,.12); color: var(--sfarc-i-success); border-color: rgba(5,150,105,.28); }
.status-stat-pill.stat-failed.stat-live { background: rgba(220,38,38,.14); color: var(--sfarc-i-danger); border-color: rgba(220,38,38,.34); }

body.sfarc-dark-theme .sfarc-btn {
  background: var(--sfarc-i-btn-bg) !important;
  border: 1px solid var(--sfarc-i-btn-border) !important;
  color: var(--sfarc-i-btn-text) !important;
  box-shadow: none !important;
}
body.sfarc-dark-theme .sfarc-btn-primary {
  background: var(--sfarc-i-accent) !important;
  border-color: var(--sfarc-i-accent) !important;
  color: #ffffff !important;
}
body.sfarc-dark-theme .sfarc-btn-icon {
  color: var(--sfarc-i-muted) !important;
}

/* Harness chrome */
body { font-family: system-ui, sans-serif; background: #f4f6fb; margin: 0; padding: 24px; color: #1a2233; }
.toolbar { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
button.pill-btn { border: 1px solid #d8dde6; background: #fff; border-radius: 6px; padding: 5px 12px; cursor: pointer; font-size: 12px; }
#widthVal { font: 12px monospace; color: #64748b; }
</style>
</head>
<body>
<div class="toolbar">
  <button class="pill-btn" id="themeBtn">Toggle dark theme</button>
  <label style="font-size:12px;">Bar width: <input type="range" id="width" min="300" max="900" value="820" style="vertical-align:middle;"></label>
  <span id="widthVal">820px</span>
</div>

<!-- ===== Real markup as rendered by data-import.js (h() calls) ===== -->
<div class="sfarc-import-actions" id="actions">
  <div class="sfarc-action-group">
    <button class="sfarc-btn sfarc-btn-primary" title="Run update">
      <svg class="sfarc-btn-icon-svg" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" stroke="none"><path d="M8 5v14l11-7z"></path></svg>
      <span class="sfarc-btn-label">Run update</span>
    </button>
    <button class="sfarc-btn sfarc-btn-icon sfarc-btn-icon-label" title="Resume queued records">
      <svg class="sfarc-btn-icon-svg" viewBox="0 0 24 24" width="15" height="15" fill="currentColor" stroke="none"><path d="M8 5v14l11-7z"></path></svg>
      <span class="sfarc-btn-label">Resume</span>
    </button>
    <button class="sfarc-btn sfarc-btn-icon sfarc-btn-icon-label" title="Retry failed records">
      <svg class="sfarc-btn-icon-svg" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"></path><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
      <span class="sfarc-btn-label">Retry failed</span>
    </button>
    <button class="sfarc-btn sfarc-btn-icon sfarc-btn-icon-label" title="Hide Configuration">
      <svg class="sfarc-btn-icon-svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>
      <span class="sfarc-btn-label">Hide config</span>
    </button>
  </div>
  <div class="sfarc-status-pills">
    <div class="status-stat-pill stat-queued"><span class="stat-count" style="margin-right:4px;">0</span><span>Queued</span></div>
    <div class="status-stat-pill stat-processing"><span class="stat-count" style="margin-right:4px;">0</span><span>Processing</span></div>
    <div class="status-stat-pill stat-succeeded"><span class="stat-count" style="margin-right:4px;">0</span><span>Succeeded</span></div>
    <div class="status-stat-pill stat-failed stat-live"><span class="stat-count" style="margin-right:4px;">144</span><span>Failed</span></div>
  </div>
  <div class="sfarc-action-group">
    <button class="sfarc-btn sfarc-btn-icon" title="Excel-like editing toolbar">
      <svg class="sfarc-btn-icon-svg" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect></svg>
    </button>
    <button class="sfarc-btn sfarc-btn-secondary sfarc-copy-btn">Copy<svg class="sfarc-copy-chevron" viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><path d="M7 10l5 5 5-5z"></path></svg></button>
    <button class="sfarc-btn sfarc-btn-icon" title="Skip all unknown fields">
      <svg class="sfarc-btn-icon-svg" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 4 15 12 5 20"></polyline><line x1="19" y1="5" x2="19" y2="19"></line></svg>
    </button>
  </div>
</div>
<p style="font-size:12px;color:#64748b;max-width:820px;">Drag the width slider below 620px to verify the container query collapses Run/Resume/Retry/Hide config to square icon buttons.</p>

<script>
const actions = document.getElementById('actions');
const width = document.getElementById('width');
const widthVal = document.getElementById('widthVal');
width.addEventListener('input', () => {
  actions.style.width = width.value + 'px';
  widthVal.textContent = width.value + 'px';
});
document.getElementById('themeBtn').addEventListener('click', () => {
  document.body.classList.toggle('sfarc-dark-theme');
  document.body.style.background = document.body.classList.contains('sfarc-dark-theme') ? '#0d1117' : '#f4f6fb';
});
</script>
</body>
</html>
